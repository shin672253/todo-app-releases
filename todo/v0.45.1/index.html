<!-- ToDoアプリ 画面（版は下の VERSION）。Apps Script の HTML ファイル「index」に貼り付ける -->
<style>
:root {
  --bg: #ffffff; --panel: #ffffff; --side: #f7f7f8; --text: #1f1f1f; --sub: #8a8a8e; --line: #efeff1;
  --accent: #4772fa; --accent-text: #ffffff; --hover: #f5f5f6; --soft: #edf1fe; --picked: #ececee;
  --late: #e5484d; --soon: #d97a00; --ok: #4772fa; --today-bg: #edf1fe;
  --d-today: #d98b00; --d-later: #2f6fe0; /* v0.32.0（B3）：日付の意味の色（テーマ色と別） */
  --shadow: none;
  --shadow-lg: 0 10px 34px rgba(0, 0, 0, .16);
  color-scheme: light; /* 入力欄なども、表示に合わせた色にする */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --panel: #1c1c1e; --side: #232325; --text: #ececec; --sub: #8e8e93; --line: #2c2c2e;
    --accent: #6e8fff; --accent-text: #0f1424; --hover: #2a2a2c; --soft: #26304d; --picked: #343436;
    --late: #ff6b6b; --soon: #f2b45c; --ok: #6e8fff; --today-bg: #26304d; --d-today: #ffb627; --d-later: #6ea2ff;
    --shadow: none; --shadow-lg: 0 10px 34px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --panel: #1c1c1e; --side: #232325; --text: #ececec; --sub: #8e8e93; --line: #2c2c2e;
  --accent: #6e8fff; --accent-text: #0f1424; --hover: #2a2a2c; --soft: #26304d; --picked: #343436;
  --late: #ff6b6b; --soon: #f2b45c; --ok: #6e8fff; --today-bg: #26304d; --d-today: #ffb627; --d-later: #6ea2ff;
  --shadow: none; --shadow-lg: 0 10px 34px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
/* v0.22.0：テーマ色（ボタン・選んだ印の色だけ変える。期限切れの赤・近い橙など意味のある色は変えない）。青は上の既定のまま */
:root[data-accent="green"] { --accent: #23935f; --ok: #23935f; --soft: #e6f4ed; --today-bg: #e6f4ed; }
:root[data-accent="teal"] { --accent: #1488a0; --ok: #1488a0; --soft: #e3f3f6; --today-bg: #e3f3f6; }
:root[data-accent="purple"] { --accent: #7c4ff0; --ok: #7c4ff0; --soft: #f1ecfe; --today-bg: #f1ecfe; }
:root[data-accent="pink"] { --accent: #d13f7a; --ok: #d13f7a; --soft: #fcebf2; --today-bg: #fcebf2; }
:root[data-accent="orange"] { --accent: #d9701c; --ok: #d9701c; --soft: #fcefe3; --today-bg: #fcefe3; }
:root[data-accent="brown"] { --accent: #8d6240; --ok: #8d6240; --soft: #f4ede7; --today-bg: #f4ede7; }
:root[data-accent="gray"] { --accent: #5f6673; --ok: #5f6673; --soft: #eef0f2; --today-bg: #eef0f2; }
@media (prefers-color-scheme: dark) { :root[data-accent="green"]:not([data-theme="light"]) { --accent: #4cc38a; --ok: #4cc38a; --soft: #1d3a2c; --today-bg: #1d3a2c; } }
:root[data-accent="green"][data-theme="dark"] { --accent: #4cc38a; --ok: #4cc38a; --soft: #1d3a2c; --today-bg: #1d3a2c; }
@media (prefers-color-scheme: dark) { :root[data-accent="teal"]:not([data-theme="light"]) { --accent: #3fb8cf; --ok: #3fb8cf; --soft: #183840; --today-bg: #183840; } }
:root[data-accent="teal"][data-theme="dark"] { --accent: #3fb8cf; --ok: #3fb8cf; --soft: #183840; --today-bg: #183840; }
@media (prefers-color-scheme: dark) { :root[data-accent="purple"]:not([data-theme="light"]) { --accent: #a585ff; --ok: #a585ff; --soft: #2f2650; --today-bg: #2f2650; } }
:root[data-accent="purple"][data-theme="dark"] { --accent: #a585ff; --ok: #a585ff; --soft: #2f2650; --today-bg: #2f2650; }
@media (prefers-color-scheme: dark) { :root[data-accent="pink"]:not([data-theme="light"]) { --accent: #f07aa8; --ok: #f07aa8; --soft: #4a2233; --today-bg: #4a2233; } }
:root[data-accent="pink"][data-theme="dark"] { --accent: #f07aa8; --ok: #f07aa8; --soft: #4a2233; --today-bg: #4a2233; }
@media (prefers-color-scheme: dark) { :root[data-accent="orange"]:not([data-theme="light"]) { --accent: #f5a35a; --ok: #f5a35a; --soft: #4a3220; --today-bg: #4a3220; } }
:root[data-accent="orange"][data-theme="dark"] { --accent: #f5a35a; --ok: #f5a35a; --soft: #4a3220; --today-bg: #4a3220; }
@media (prefers-color-scheme: dark) { :root[data-accent="brown"]:not([data-theme="light"]) { --accent: #c49a74; --ok: #c49a74; --soft: #3b2e24; --today-bg: #3b2e24; } }
:root[data-accent="brown"][data-theme="dark"] { --accent: #c49a74; --ok: #c49a74; --soft: #3b2e24; --today-bg: #3b2e24; }
@media (prefers-color-scheme: dark) { :root[data-accent="gray"]:not([data-theme="light"]) { --accent: #a3a9b4; --ok: #a3a9b4; --soft: #33363b; --today-bg: #33363b; } }
:root[data-accent="gray"][data-theme="dark"] { --accent: #a3a9b4; --ok: #a3a9b4; --soft: #33363b; --today-bg: #33363b; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
  font: 15px/1.55 "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
/* v0.34.0（受付15）：select の開いた一覧も表示の色に（Windows の Chrome では一覧が白地のまま、文字だけ明るくなって読めなかった） */
select option, select optgroup { background-color: var(--panel); color: var(--text); }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); }
/* v0.18.0：スクロールバーを目立たなく（細く、ふだんは薄く、上に乗せたときだけ少し濃く） */
* { scrollbar-width: thin; scrollbar-color: transparent transparent; }
*:hover, *:focus-within { scrollbar-color: color-mix(in srgb, var(--sub) 45%, transparent) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
:hover::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--sub) 40%, transparent); }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--sub) 70%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 17px; font-weight: 700; letter-spacing: .02em; margin: 0; flex: 1; white-space: nowrap; }
/* v0.33.0（B7）：骨組み表示 */
.skel { padding: 12px 16px; }
.skel-h { height: 18px; width: 40%; border-radius: 9px; background: var(--picked); margin: 4px 0 14px; }
.skel-row { display: flex; align-items: center; gap: 10px; height: 44px; border-bottom: 1px solid var(--line, var(--picked)); }
.skel-c { width: 16px; height: 16px; border-radius: 4px; background: var(--picked); flex: none; }
.skel-t { height: 11px; border-radius: 6px; background: var(--picked); }
.skel-h, .skel-c, .skel-t { animation: skelPulse 1.2s ease-in-out infinite; }
@keyframes skelPulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .skel-h, .skel-c, .skel-t { animation: none; } }
/* v0.33.0：左上は名前の文字の代わりにアイコン（本人 2026-11-08）。版の表記はそのまま */
.bar h1 { display: flex; align-items: center; gap: 6px; }
.bar h1 .appmark { width: 26px; height: 26px; flex: none; display: block; }
.ver { font-size: 11px; color: var(--sub); font-weight: normal; margin-left: 6px; }
.tools { display: flex; gap: 2px; }
/* 線のアイコン：文字と同じ色・大きさで、細い線 */
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon .ic { width: 20px; height: 20px; }
.meta .ic { width: 13px; height: 13px; vertical-align: -2px; }
.meta > span { display: inline-flex; align-items: center; gap: 2px; }
.chk .ic { width: 12px; height: 12px; stroke-width: 2.4; }
.icon { min-width: 38px; height: 38px; border: none; border-radius: 10px; background: transparent;
  cursor: pointer; font-size: 18px; line-height: 1; padding: 0 8px; color: var(--sub); transition: background .15s, color .15s; }
.icon:hover { background: var(--hover); color: var(--text); }
.icon.on { background: var(--soft); color: var(--accent); }
.icon.txt { font-size: 14px; font-weight: 600; }
main { flex: 1; min-width: 0; max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 2.5vw, 40px) 80px; }
/* v0.18.0：画面の大きさに合わせて伸び縮み。カレンダーは窓の幅いっぱい、月の段と時間の帯の高さは窓の高さから決める */
body.v-cal main { max-width: none; }
.mweek { min-height: max(84px, calc((100vh - 230px) / 6)); }
/* v0.20.0：カレンダーは下の一覧をやめ、窓の高さいっぱいに出す（画面全体はスクロールしない。時間の帯・終日の段・日付なしの欄は中でスクロール） */
body.v-cal { height: 100vh; height: 100dvh; overflow: hidden; }
body.v-cal main { height: calc(100dvh - var(--barh, 51px) - var(--tabh, 0px)); display: flex; flex-direction: column; overflow: hidden; padding-bottom: 10px; }
body.v-cal main > * { flex: none; }
body.v-cal .mcal { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
body.v-cal .mweek { flex: 1 1 0; min-height: 0; overflow: hidden; }
body.v-cal .tl { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
body.v-cal .tl > * { flex: none; }
body.v-cal .tl-allwrap { max-height: 30vh; }
body.v-cal .tl-scroll { flex: 1 1 0; min-height: 0; max-height: none; }
/* 左のフォルダの木。広い画面ではいつも出し、狭い画面では☰で引き出す */
.layout { display: flex; align-items: flex-start; }
#side { flex: none; width: 250px; position: sticky; top: 51px; height: calc(100vh - 51px); overflow: auto; padding: 10px 8px 40px; background: var(--side); border-right: 1px solid var(--line); }
#side.hide { display: none; }
.side-in { }
.fold { display: flex; align-items: center; gap: 2px; border-radius: 6px; min-height: 36px; }
.fold:hover { background: var(--hover); }
.fold.cur { background: var(--picked); font-weight: 600; }
.tw { flex: none; width: 22px; border: none; background: none; color: var(--sub); cursor: pointer; padding: 0; font-size: 11px; }
.fold .nm { flex: 1; min-width: 0; border: none; background: none; text-align: left; cursor: pointer; padding: 6px 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: inherit; color: inherit; }
.fold .cnt { flex: none; margin-right: 8px; }
.side-add { margin: 6px 4px 2px; }
#scrim { display: none; }
/* 左の欄の上：今日・明日・7日間などの画面 */
.nav { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; border: none; background: none; border-radius: 6px;
  padding: 0 8px 0 6px; cursor: pointer; text-align: left; color: var(--text); }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--picked); font-weight: 600; }
.nav .ni { width: 22px; text-align: center; color: var(--accent); font-size: 15px; }
.nav .nl { flex: 1; }
.side-h { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--sub);
  margin: 10px 0 2px; padding: 8px 4px 0 8px; border-top: 1px solid var(--line); }
.side-h .icon { min-width: 28px; height: 28px; font-size: 16px; }
#tabs { display: none; }
/* v0.40.0（12）：上の追加の帯はやめ、どの幅でも右下の青い丸の＋だけ（Android と同じ：56px・白い＋）。押すと＋の上に追加の欄が開く */
#fab { position: fixed; right: 24px; bottom: 24px; z-index: 16; width: 56px; height: 56px; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; box-shadow: var(--shadow-lg); display: grid; place-items: center; }
#fab svg { width: 28px; height: 28px; }
body.selecting #fab, body.v-set #fab { display: none; }
.qa.main-qa:not(.open) { display: none; }
.qa.main-qa { position: fixed; right: 24px; bottom: 92px; z-index: 17; width: min(560px, calc(100vw - 48px)); margin: 0; padding: 10px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); }
/* v0.26.0（20番）：左端の記号だけの帯 */
#rail { display: none; }
@media (min-width: 600px) {
  #rail { display: flex; flex-direction: column; align-items: center; gap: 4px; position: fixed; top: 51px; left: 0; bottom: 0; width: 48px; padding: 8px 0 12px;
    background: var(--side); border-right: 1px solid var(--line); z-index: 12; }
  body.v-set #rail { top: 0; }
  #rail button { width: 40px; height: 40px; border: none; background: none; border-radius: 8px; color: var(--sub); cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center; }
  #rail button:hover { background: var(--hover); }
  #rail button.on { color: var(--accent); background: var(--picked); }
  #rail .rail-sp { flex: 1; }
  .layout, body.v-set .layout { margin-left: 48px; }
}
.upd-badge { font-size: 12px; padding: 2px 10px; min-height: 30px; color: var(--accent); border-color: var(--accent); }
.upd-badge[hidden] { display: none; }
/* カレンダーのときのサイドバー：小さな月と、出すものを選ぶチェック */
.mm { margin: 2px 4px 8px; font-size: 12px; }
.mm-h { display: flex; align-items: center; justify-content: space-between; font-weight: 700; padding: 2px 0 4px; }
.mm-h .icon { min-width: 26px; height: 26px; }
.mm-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center; }
.mm-g span { color: var(--sub); font-size: 11px; padding: 2px 0; }
.mm-g button { border: none; background: none; border-radius: 50%; aspect-ratio: 1; font-size: 12px; cursor: pointer; color: var(--text); padding: 0; }
.mm-g button.out { color: var(--sub); opacity: .5; }
.mm-g button.td { color: var(--accent); font-weight: 700; }
.mm-g button.on { background: var(--accent); color: var(--accent-text); }
.mm-g button:hover:not(.on) { background: var(--hover); }
.vchk { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.vchk:hover { background: var(--hover); }
.vchk input { margin: 0; accent-color: var(--vc, var(--accent)); width: 16px; height: 16px; }
.vchk .nl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calpick { display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.calpick .miss { color: var(--late); }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
@media (max-width: 599px) {
  :root { --tabh: 58px; }
  #tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; height: 58px; background: var(--bg); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); }
  #tabs button { flex: 1; border: none; background: none; color: var(--sub); font-size: 10px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; cursor: pointer; padding: 0; }
  #tabs button b { font-size: 19px; font-weight: 400; line-height: 1; }
  #tabs button b { padding: 4px 18px; border-radius: 16px; transition: background-color .15s; }
  /* v0.32.0（B2）：今いる画面の記号に丸い背景 */
  #tabs button.on { color: var(--accent); font-weight: 600; }
  #tabs button.on b { background: var(--picked); }
  #fab { right: 16px; bottom: 74px; }
  .qa.main-qa { right: 16px; bottom: 142px; width: calc(100vw - 32px); }
}
@media (max-width: 899px) {
  #side, #side.hide { display: block; position: fixed; top: 0; left: 0; bottom: 0; z-index: 20; width: min(300px, 85vw); max-height: none; height: auto;

/* 狭い画面：帯は透明で、☰ と ⟳ だけ左上・右上に浮かせる。見出しの行はその間に入る */
@media (max-width: 599px) {
  header.bar { position: fixed; left: 0; right: 0; top: 0; padding: 4px 4px; background: transparent; border: none; pointer-events: none; z-index: 14; flex-wrap: nowrap; }
  header.bar > *, header.bar .tools > * { pointer-events: auto; }
  header.bar h1 { display: none; }
  header.bar .tools { margin-left: auto; }
  header.bar .icon { background: color-mix(in srgb, var(--bg) 85%, transparent); }
  main { padding-top: 4px; }
  main > :first-child { margin-left: 40px; margin-right: 40px; }
  body:has(#saveSt:not([hidden])) main > :first-child, body:has(#updBadge:not([hidden])) main > :first-child { margin-right: 80px; }
  header.bar .icon { min-width: 36px; height: 36px; padding: 0 6px; }
  main > :first-child.calhead, main > :first-child.lhead { min-height: 42px; }
  main > :first-child.lhead.withcrumb, body:has(#saveSt:not([hidden])) main > :first-child.lhead.withcrumb, body:has(#updBadge:not([hidden])) main > :first-child.lhead.withcrumb { margin-left: 0; margin-right: 0; }
  main > .lhead.withcrumb > .crumb { padding-left: 40px; padding-right: 40px; min-height: 40px; box-sizing: border-box; }
  body:has(#saveSt:not([hidden])) main > .lhead.withcrumb > .crumb, body:has(#updBadge:not([hidden])) main > .lhead.withcrumb > .crumb { padding-right: 80px; }
}
/* B：カレンダーの見出し1行 */
.calhead { flex-wrap: nowrap; gap: 2px; }
.calhead h2.ctitle { flex: 0 1 auto; margin: 0; white-space: nowrap; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.calhead > * { flex-shrink: 0; }
.calhead > h2.ctitle { flex-shrink: 1; }
.calhead .sp { flex: 1; }
.calhead .cnav { flex: none; }
.calhead .modes { display: flex; background: var(--hover); border-radius: 10px; padding: 2px; margin: 0 4px; }
.calhead .modes .icon { height: 32px; min-width: 40px; }
.modebtn { display: none; }
.traybtn, .evbtn { position: relative; }
.tcnt { position: absolute; right: 1px; top: 1px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: var(--accent); color: var(--accent-text); font-size: 10px; line-height: 16px; font-weight: 600; box-sizing: border-box; }
.icon.on .tcnt { background: var(--accent); }
@media (max-width: 759px) {
  .calhead .modes { display: none; }
  .modebtn { display: inline-block; min-width: 44px; }
  .calhead h2.ctitle { font-size: 17px; }
  .calhead .icon { min-width: 30px; padding: 0 3px; }
  .calhead .cnav { gap: 0; }
  .calhead h2.ctitle { font-size: 16px; }
}
/* C：日付なしの浮かぶ小窓（つかんで動かせる）。狭い画面は下から出す */
.traypop { position: fixed; right: 24px; top: 64px; z-index: 13; width: min(340px, calc(100vw - 32px)); max-height: min(60vh, 520px); display: flex; flex-direction: column;
  margin: 0; padding: 6px 10px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); animation: popIn .18s ease-out; }
.traypop .tray-head { cursor: move; user-select: none; touch-action: none; padding: 2px 0 4px; border-bottom: 1px solid var(--line); }
.traypop .tray-head b { font-size: 13px; }
.traypop .tray-head .sp { flex: 1; }
.traypop .tray-head .icon { min-width: 30px; height: 30px; }
.traypop .tray-items { flex: 1 1 auto; max-height: none; min-height: 0; overflow: auto; flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
.traypop .tray-items .it { max-width: none; }
.traypop .note { font-size: 11px; margin: 4px 0 0; }
.traypop.moving { opacity: .92; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
@media (max-width: 559px) {
  .traypop { left: 8px !important; right: 8px; top: auto !important; bottom: calc(var(--tabh, 0px) + 8px); width: auto; max-height: 45vh; }
  .traypop .tray-head { cursor: default; }
}
@media (prefers-reduced-motion: reduce) { .traypop { animation: none; } }
/* E：道のりと名前を1行に */
.lhead.withcrumb { flex-wrap: wrap; }
.lhead .crumb { flex: none; flex-wrap: nowrap; max-width: 45%; overflow: hidden; white-space: nowrap; }
.lhead .crumb .cf { overflow: hidden; text-overflow: ellipsis; max-width: 12em; }
.lhead h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 599px) { .lhead .crumb { order: -1; flex-basis: 100%; max-width: none; } .lhead h2 { flex: 1 1 0; min-width: 6em; } .lhead > .iconbtn, .lhead > button { width: 34px; padding: 0; } }

/* v0.37.0：カレンダーの見た目を Android にそろえる（外枠・縦線なし、選んだ日は薄い灰色、前後の月は数字だけ薄く、タスクは枠なし・期限は赤い字だけ） */
.mcal { border: none; border-radius: 0; background: transparent; }
.mbg .cell { border-right: none; }
.cell.sel { background: var(--hover); }
.cell.other { background: transparent; }
.it.task-it:not(.due) { box-shadow: none; }
.it.due { background: transparent; }
.it.task-it:hover { box-shadow: none; background: var(--hover); }
</style>
</head>
<body>
<header class="bar">
  <button class="icon" id="sideBtn" title="フォルダの一覧を出す・隠す" aria-label="フォルダの一覧を出す・隠す"><i data-ic="menu"></i></button>
  <h1 aria-label="To Cal" title="To Cal"><svg class="appmark" viewBox="28 26 52 52" aria-hidden="true"><g fill="none" stroke="var(--appmark,#4772FA)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M38,36h32a5,5 0,0 1,5 5v28a5,5 0,0 1,-5 5H38a5,5 0,0 1,-5 -5V41a5,5 0,0 1,5 -5z"/><path d="M33,46h42M43,31v9M65,31v9"/><path d="M44,59l6,6 13,-13" stroke-width="6"/></g></svg><span class="ver" id="verTag"></span></h1>
  <nav class="tools">
    <button class="btn upd-badge" id="updBadge" hidden title="新しい版があります。設定の「この版・更新」で ⟳ を押すと入れ替わります"><i data-ic="refresh"></i> 新しい版</button>
    <button class="icon save-st" id="saveSt" hidden onclick="retrySave()"></button>
    <button class="icon" id="reloadBtn" title="最新の内容を読み直す" aria-label="最新の内容を読み直す"><i data-ic="refresh"></i></button>
  </nav>
</header>
<!-- v0.26.0（20番）：TickTick のように、いちばん左に記号だけの細い帯（広い画面）。狭い画面では下のタブが同じ4つ -->
<nav id="rail" aria-label="画面の切り替え">
  <div id="railTop" class="rail-grp"></div>
  <button data-rail="list" title="ToDoリストを開く" aria-label="ToDoリストを開く"><i data-ic="tasks"></i></button>
  <button data-rail="cal" title="カレンダーを開く" aria-label="カレンダーを開く"><i data-ic="calendar"></i></button>

  <span class="rail-sp"></span>
  <div id="railBot" class="rail-grp"></div>

</nav>
<div class="layout">
  <aside id="side" aria-label="フォルダ"></aside>
  <main id="main"><p class="note">読み込み中…</p></main>
</div>
<div id="scrim"></div>
<!-- スマホでは、下に画面を切り替えるタブと、右下に追加の＋ボタンを出す。フォルダの一覧は左上の ☰ で開く（v0.22.0、Android と同じ） -->
<nav id="tabs" aria-label="画面の切り替え">
  <button data-rail="list" title="ToDoリストを開く" aria-label="ToDoリストを開く"><b><i data-ic="tasks"></i></b>ToDo</button>
  <button data-rail="cal" title="カレンダーを開く" aria-label="カレンダーを開く"><b><i data-ic="calendar"></i></b>カレンダー</button>
  <button data-rail="search" title="タスクを探す" aria-label="タスクを探す"><b><i data-ic="search"></i></b>探す</button>
  <button data-rail="settings" title="設定を開く" aria-label="設定を開く"><b><i data-ic="settings"></i></b>設定</button>
</nav>
<button id="fab" title="タスクを追加する" aria-label="タスクを追加する"><i data-ic="plus"></i></button>
<div id="status" role="status"></div>
<div id="selbar" class="selbar" hidden></div>
<div id="menu" class="pop" hidden></div>

<!-- v0.28.0（9番）：開いたとき最初の入力欄（フォルダ欄）に入らないよう、窓そのものに入る（iPad でフォルダの一覧が勝手に開いていた） -->
<dialog id="taskDlg" tabindex="-1" autofocus>
  <div class="dgrab" id="taskGrab" aria-hidden="true"><span></span></div>
  <form id="taskForm" class="form" novalidate>
    <!-- 上に日時の行（実行日・期限・繰り返し・通知）、その下に大きな名前とメモ。フォルダと親タスクはいちばん下 -->
    <div class="dbar">
      <label title="フォルダ">▤ <select name="listId" aria-label="フォルダ"></select></label>
      <select name="parentTaskId" aria-label="親タスク" hidden></select>
      <span class="dbtns">
      <button type="button" class="icon" id="taskPin" title="上に固定（フォルダの一番上）" aria-label="上に固定"><i data-ic="pin"></i></button>
      <button type="button" class="icon" id="taskMore" title="そのほか（テンプレート・やらない・フォルダにする・削除）" aria-label="そのほか" aria-haspopup="menu" aria-expanded="false">⋯</button>
      <span class="dmenu" id="taskMenu" hidden>
      <button type="button" class="icon" id="taskTpl" title="テンプレートとして残す" aria-label="テンプレートとして残す"><i data-ic="template"></i><span class="ml">テンプレートとして残す</span></button>
      <button type="button" class="icon" id="taskWont" title="やらないで終える" aria-label="やらないで終える"><i data-ic="ban"></i><span class="ml">やらないで終える</span></button>
      <button type="button" class="icon" id="taskConv" title="フォルダにする" aria-label="フォルダにする"><i data-ic="convert"></i><span class="ml">フォルダにする</span></button>
      <button type="button" class="btn danger icon-btn" id="taskDel" title="このタスクを消す" aria-label="このタスクを消す"><i data-ic="trash"></i><span class="ml">消す</span></button>
      </span>
      </span>
    <button type="submit" class="icon dx" id="taskClose" title="閉じる（変えた分は保存されます）" aria-label="閉じる"><i data-ic="close"></i></button>
    </div>
    <div class="dhead">
    <button type="button" class="dchk" id="taskDone" title="完了にする" aria-label="完了にする" role="checkbox" aria-checked="false"></button>
    <div class="dcol">
    <div class="dtop">
      <div class="drow"><span class="dk" title="期限"><i data-ic="flag"></i></span><button type="button" class="dfield" data-key="due" title="期限を選ぶ"></button></div>
      <div class="drow"><span class="dk" title="実行日"><i data-ic="calendar"></i></span><button type="button" class="dfield" data-key="doDate" title="実行日を選ぶ"></button>
      <span id="endWrap" hidden>〜 <button type="button" class="dfield" data-key="doEnd" title="期間の終わりを選ぶ"></button></span>
      <label class="pchk" hidden><input type="checkbox" id="periodChk"> 期間</label></div>
      <div class="drow"><span class="dk" title="所要時間"><i data-ic="clock"></i></span><button type="button" class="dfield" data-key="estimate" title="所要時間を選ぶ"></button></div>
      <div class="drow" hidden><span class="dk" title="優先度"><i data-ic="prio"></i></span><button type="button" class="dfield" id="prioBtn" title="優先度を選ぶ（□ の枠の色）"></button></div>
    </div>
    </div>
    </div>
    <div class="dpath" id="taskPath"></div>
    <input name="title" class="ttl-in" required autocomplete="off" placeholder="タスク名" aria-label="タスク名">
    <textarea name="memo" class="memo-in" rows="3" placeholder="メモ" aria-label="メモ"></textarea>
    <div id="chkWrap" hidden>
    <div class="sub-head"><i data-ic="checklist"></i> チェックリスト <span class="cnt" id="chkCnt"></span></div>
    <div id="chkList"></div>
    <div class="ci"><span class="cbox" style="visibility:hidden"></span><input type="text" class="ci-add" id="chkIn" placeholder="＋ 項目を追加（Enter）" aria-label="チェックリストに足す項目" autocomplete="off"></div>
    </div>
    <div hidden id="subWrap">
    <div class="sub-head"><i data-ic="subtask"></i> 子タスク <span class="cnt" id="subCnt"></span></div>
    <div id="subList" class="sub-box"></div>
    <div class="qa"><input type="text" class="qa-in" id="subIn" placeholder="子タスク名を入れて Enter" aria-label="追加する子タスク名" autocomplete="off">
      <button type="button" class="icon" id="subAdd" title="この子タスクを追加する" aria-label="この子タスクを追加する">＋</button></div>
    </div>
    <div id="attBox" hidden>
    <div id="attList"></div>
    <input type="file" id="attInput" multiple hidden aria-label="添付するファイルを選ぶ">
    <button type="button" class="mini" id="attPick" title="添付するファイルを選ぶ（Googleドライブに保存・1つ10MBまで）">＋ ファイルを添付</button>
    </div>
    <div class="dtop dbottom">
      <button type="button" class="dfield" id="chkBtn" title="チェックリスト" aria-label="チェックリスト"><i data-ic="checklist"></i><span id="chkBtnCnt"></span></button>
      <span class="dk" title="繰り返し"><i data-ic="repeat"></i></span><button type="button" class="dfield" data-key="repeat" title="繰り返しを選ぶ"></button>
      <span class="dk" title="通知"><i data-ic="bell"></i></span><span id="remChips" class="rchips"></span>
      <button type="button" class="dfield" data-key="notifyAt" title="日時の通知（押すと変える）" hidden></button>
      <button type="button" class="dfield empty" id="remAdd" title="通知を足す（実行日・期限の◯分前／日時を決める）" aria-label="通知を足す" aria-haspopup="menu"><i data-ic="bell"></i>＋</button>
      <button type="button" class="dfield" id="attFold" title="添付ファイル" aria-label="添付ファイル" aria-expanded="false"><i data-ic="clip"></i><span id="attCnt"></span></button>
    </div>
    <p class="dlg-err" id="taskErr" hidden></p>
    <div class="dlg-acts">
      <span class="sp"></span>
      <span class="saved" id="savedMark" aria-live="polite"></span>

  </form>
  <div id="pop" class="pop" hidden></div>
</dialog>

<dialog id="keyDlg">
  <div class="keys" id="keyBody"></div>
  <button type="button" class="dlg-x" id="keyClose" title="閉じる" aria-label="閉じる"><i data-ic="close"></i></button>
</dialog>
<dialog id="planDlg" aria-label="朝の段取り"><div id="planBody"></div></dialog>
<dialog id="listDlg">
  <form id="listForm" class="form">
    <button type="button" class="dlg-x" id="listClose" title="閉じる" aria-label="閉じる"><i data-ic="close"></i></button>
    <label>フォルダの名前<input name="name" required autocomplete="off"></label>
    <label>入れる場所<select name="parentId"></select></label>
    <label>目印の絵文字（なしなら色の点）</label>
    <div class="emos"><input name="icon" maxlength="16" autocomplete="off" aria-label="目印の絵文字" placeholder="なし"><span id="emoPick"></span></div>
    <label>予定を入れるカレンダー（このフォルダの「＋予定」で入れる先）<select name="calId"></select></label>
    <label>目印の言葉（工事番号など。名前にこの言葉がある予定もこのフォルダに出し、＋予定で名前の後ろに付ける。空白で区切って複数）<input name="keyword" autocomplete="off" placeholder="例 R7-23"></label>
    <label>色（カレンダーの色。なしなら上のフォルダの色）</label>
    <div class="swatches" id="listColors"></div>
    <div class="dlg-acts">
      <button type="button" class="btn danger icon-btn" id="listDel" title="このフォルダを消す" aria-label="このフォルダを消す"><i data-ic="trash"></i></button>
      <span class="sp"></span>
      <button type="submit" class="btn primary icon-btn" title="保存する" aria-label="保存する"><i data-ic="save"></i></button>
    </div>
  </form>
</dialog>

<script>
const VERSION = '0.45.1'; // v0.45.1：コード.gs の APP_VERSION と同じにする（v045_test が照らす）
// 左上の版の表示は、ここから入れる（直し忘れないように1か所だけに書く）
document.getElementById('verTag').textContent = 'v' + VERSION;
// 繰り返しは「頻度/間隔[/曜日か決め方]」（例 weekly/2/2,5＝2週ごと火・金、monthly/1/nth＝毎月 第N◯曜日）。古い名前も読める
const OLD_REPEATS = { daily: 'daily/1', weekdays: 'weekly/1/1,2,3,4,5', weekly: 'weekly/1', monthly: 'monthly/1/day',
  monthlyNth: 'monthly/1/nth', monthlyLast: 'monthly/1/last', yearly: 'yearly/1' };
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
const MAX_ATTACH = 10 * 1024 * 1024;
const CACHE_KEY = 'todo-cache';
// v0.33.0（C8）：覚えておく中身の形の番号。版を上げても、形が同じなら前回の中身をすぐ出す（形を変えたときだけ上げる）
const CACHE_FMT = 1;
// フォルダの色。Googleカレンダーの予定の色（番号 1〜11）と同じにして、書き込んだ予定にも同じ色を付ける
const COLORS = { 1: ['ラベンダー', '#7986cb'], 2: ['セージ', '#33b679'], 3: ['ブドウ', '#8e24aa'], 4: ['フラミンゴ', '#e67c73'],
  5: ['バナナ', '#f6bf26'], 6: ['ミカン', '#f4511e'], 7: ['ピーコック', '#039be5'], 8: ['グラファイト', '#616161'],
  9: ['ブルーベリー', '#3f51b5'], 10: ['バジル', '#0b8043'], 11: ['トマト', '#d50000'] };
const SNAP = 15; // 時間の帯は15分きざみで動かす
let KBZ = 'main'; // v0.45.0：矢印を効かせる側（'side'＝サイドバー／'main'＝リスト）
const LIST_VIEWS = ['today', 'tomorrow', 'next7', 'lists', 'search', 'smart', 'done'];
const S = { lists: [], tasks: [], settings: {}, templates: [], smart: [], smartId: '', fsel: null, bump: null, view: 'today', folderId: '', addList: null, showDone: false,
  calMode: 'month', calDay: null, calMonth: null, events: {}, editing: null, editingList: null,
  foldF: loadSet('todo-fold-folders'), foldT: loadSet('todo-fold-tasks'), foldS: loadSet('todo-fold-secs'), sideHidden: false, loaded: false, addKidOf: null,
  sel: null, q: '', qDone: false, tlTop: null, trayList: '', trayOpen: loadFlag('todo-traypop') === 'open', evOpen: loadFlag('todo-evband') === 'open', holidays: {}, holYears: new Set() };

// 畳んだフォルダ・タスクなどは、この端末に覚えておく
function loadSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch (e) { return new Set(); } }
function saveSet(key, set) { try { localStorage.setItem(key, JSON.stringify([...set])); } catch (e) { /* 覚えられなくても動く */ } uiNote(key); }
function toggleIn(set, key, id) { if (set.has(id)) set.delete(id); else set.add(id); saveSet(key, set); }
function loadFlag(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
function saveFlag(key, v) { try { localStorage.setItem(key, v); } catch (e) { /* なし */ }  uiNote(key); }
// ---- v0.36.0（受付1）：表示の状態を端末・Web/Android をまたいで同じに（設定の ui に鍵ごと [値, 変えた時刻]） ----
// この端末の覚え方（localStorage の鍵）はそのままにして、決めた鍵だけを共通の形にして送る。届いた方は新しいものだけ入れる。
// 端末ごとに違ってよいもの（時間の帯の高さ・サイドバーの開け閉め・今開いている画面・マイク）は送らない
const UI_SYNC = {
  'todo-fold-folders': ['foldF', v => JSON.parse(v || '[]'), v => JSON.stringify(Array.isArray(v) ? v : [])],
  'todo-fold-tasks': ['foldT', v => JSON.parse(v || '[]'), v => JSON.stringify(Array.isArray(v) ? v : [])],
  'todo-fold-secs': ['foldS', v => JSON.parse(v || '[]'), v => JSON.stringify(Array.isArray(v) ? v : [])],
  'todo-cal-hide': ['calHide', v => { const o = JSON.parse(v || 'null') || {}; return { f: o.f || [], c: o.c || [] }; }, v => JSON.stringify({ f: (v && v.f) || [], c: (v && v.c) || [] })],
  'todo-cal-groups': ['calGroups', v => JSON.parse(v || '[]'), v => JSON.stringify(Array.isArray(v) ? v : [])],
  'todo-tray': ['tray', v => v === 'hide' ? '0' : '1', v => v === '0' ? 'hide' : ''],
  'todo-size': ['size', v => v || '', v => ['s', 'l'].includes(v) ? v : ''],
  'todo-dense': ['dense', v => v || '', v => ['loose', 'tight'].includes(v) ? v : ''],
  'todo-evband': ['evband', v => v === 'open' ? '1' : '0', v => v === '1' ? 'open' : ''],
  'todo-quick': ['quick', v => v === 'off' ? '0' : '1', v => v === '0' ? 'off' : '']
};
// 並べ方は Android と同じ「k:1／k:0」に、カレンダーの表示（月・週・3日・日）は todo-view の c だけを送る

// v0.31.0：消す・別のフォルダへ・日付を変えるとき。消えた行はその場で縮んで消え（0.2秒）、残りの行は詰まり、
// 移った先に見えている行は短く光る。読み込み・保存の結果の描き直しでは使わない（Codex の案）
function motionRender(ids) {
  if (reduceMotion()) { render(); return; }
  const m = document.getElementById('main');
  const keyed = rows => { const n = {}; return rows.map(r => { const id = r.dataset.id; n[id] = (n[id] || 0) + 1; return { r, id, k: id + '#' + n[id] }; }); };
  const old = keyed([...m.querySelectorAll('.task[data-id]')]).map(o => Object.assign(o, { rc: o.r.getBoundingClientRect() }));
  const before = {};

  const seen = new Set(now.map(o => o.k));
  const ease = 'cubic-bezier(.2,0,0,1)';
  old.forEach(o => {
    if (seen.has(o.k) || o.rc.height < 1 || o.rc.bottom < 0 || o.rc.top > innerHeight) return;

// ---- v0.23.0：繰り返しの先の回（6番）。サーバーの advance_ と同じ数え方（最初の回 repeatBase から n 回目）で、見ている範囲の回を出す ----
function nthWeekdayDay(anchor, n, last) {
  const [y0, m0, d0] = anchor.split('-').map(Number);
  const wd = new Date(y0, m0 - 1, d0).getDay();
  const nth = Math.ceil(d0 / 7);

function occurrenceDay(anchor, r, n) {

    const days = r.days.length ? r.days : [wd];

    const k = n - after.length - 1;
    return addDays(anchor, (1 + Math.floor(k / days.length)) * 7 * r.interval + days[k % days.length] - wd);
  }

  const p = t.repeatBase ? String(t.repeatBase).split('|') : [t.doDate, t.due, t.notifyAt, t.doEnd];
  const base = { doDate: p[0] || '', due: p[1] || '', doEnd: p[3] || '' };
  const anchor = day(base.doDate || base.due);
  if (!anchor) return [];
  const curDay = day(t.doDate || t.due);
  const out = [];
  const n0 = t.repeatBase ? Number(t.repeatCount) || 0 : 0;
  for (let n = n0 + 1, i = 0; i < 5000; n++, i++) {
    const od = occurrenceDay(anchor, r, n);
    if (r.until && od > r.until) break;
    const delta = daysBetween(anchor, od);
    const sh = s => (s ? shiftKeepTime(s, delta) : '');
    const occ = { doDate: sh(base.doDate), due: sh(base.due), doEnd: sh(base.doEnd) };
    // v0.25.0：期限の終わりも、その回の期限と同じ日数だけずらす（Codex の指摘）

// ---- v0.23.0：開く・閉じるところの動き（上の線はそのまま、下だけ 0.15〜0.25 秒で伸び縮み）。動きを減らす設定では動かさない ----
function slideOpen(el, from) {
  if (!el || reduceMotion()) return;
  const full = el.offsetHeight;
  if (full <= (from || 0)) return;
  el.style.overflow = 'hidden';
  const a = el.animate([{ height: (from || 0) + 'px', opacity: from ? 1 : 0 }, { height: full + 'px', opacity: 1 }], { duration: 200, easing: 'ease' });
  a.onfinish = a.oncancel = () => { el.style.overflow = ''; };
}
function slideShut(el, to, done) {
  if (!el || reduceMotion()) { done(); return; }
  el.style.overflow = 'hidden';
  const a = el.animate([{ height: el.offsetHeight + 'px', opacity: 1 }, { height: (to || 0) + 'px', opacity: to ? 1 : 0 }], { duration: 180, easing: 'ease', fill: 'forwards' });
  a.onfinish = () => { done(); };
}
// 見出しの段を開け閉めする（閉じるときは縮めてから、開くときは描いてから伸ばす）
function toggleSec(key, sec) {
  const opening = S.foldS.has(key);
  const head = sec && sec.querySelector('h3');
  const shutH = head ? head.getBoundingClientRect().bottom - sec.getBoundingClientRect().top + 2 : 0;
  if (!opening && sec) { slideShut(sec, shutH, () => { toggleIn(S.foldS, 'todo-fold-secs', key); render(); }); return; }
  toggleIn(S.foldS, 'todo-fold-secs', key);
  render();
  const now = [...document.querySelectorAll('#main section[data-sk]')].find(x => x.dataset.sk === key);
  if (now) slideOpen(now, shutH);
}

const tipEl = h('div', { id: 'tip', role: 'tooltip', 'aria-hidden': 'true' });
document.body.append(tipEl);
let tipFor = null, tipT = 0, tipEat = false;
function tipTarget(el) {
  const b = el && el.closest && el.closest('button[title], a.icon[title], [role=checkbox][title], .dk[title], .cb[title], button[data-tip], a.icon[data-tip]');
  if (!b || b.disabled) return null;
  const txt = (b.textContent || '').replace(/\s/g, '');
  // 文字が読めるボタンには出さない（記号だけ・短い記号＋数のもの）
  if (txt.length > 3 && !b.classList.contains('icon')) return null;
  if (b.classList.contains('icon') && txt.length > 6) return null;
  return b;
}
function showTip(b) {
  if (!b.isConnected) return;
  const host = b.closest('dialog[open]') || document.body; // v0.31.0：窓の中なら窓の中へ（Codex の指摘）
  if (tipEl.parentNode !== host) host.append(tipEl);
  const t = b.getAttribute('title') || b.dataset.tip;
  if (!t) return;
  b.dataset.tip = t;
  b.removeAttribute('title');
  tipFor = b;
  tipEl.textContent = t;
  tipEl.className = 'show';
  const r = b.getBoundingClientRect();
  const w = tipEl.offsetWidth, hh = tipEl.offsetHeight;
  let y = r.bottom + 6;
  if (y + hh > innerHeight - 6) y = r.top - hh - 6;
  tipEl.style.left = Math.max(6, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 6)) + 'px';
  tipEl.style.top = Math.max(6, y) + 'px';
}
function hideTip() {
  clearTimeout(tipT);

  tipFor = null;

}
document.addEventListener('pointerover', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;

// v0.31.0（Codex の案）：キーボードで選んだときも説明を出す

// ---- タスクの操作 ----
function replaceTask(t, oldId) {
  const i = S.tasks.findIndex(x => x.id === (oldId || t.id));
  if (i >= 0) mergeInto(S.tasks[i], t); else S.tasks.push(t);
}
// ---- v0.45.0（受付④ 軽量化）：保存の答えが今の画面と同じなら描き直さない ----
// 行のボタンは押したときのタスクの入れ物を覚えているので、答えは入れ物を取り替えずに中身だけ移す（描き直さなくても次の操作が正しい物に効く）
function mergeInto(o, n) {
  if (o === n) return o;
  Object.keys(o).forEach(k => { if (!(k in n)) delete o[k]; });
  return Object.assign(o, n);
}
function mergeTasks(all) {
  const by = new Map(S.tasks.map(t => [t.id, t]));
  S.tasks = all.map(n => { const o = by.get(n.id); return o ? mergeInto(o, n) : n; });
}
// 一覧の見た目に関わる中身の印。保存の時刻などは除き、メモとチェックリストの文字は「あるか」だけ（行には出ないので）
const SIG_SKIP = new Set(['updatedAt', 'notified', 'doneWith']);
function rowSigOf(t) {
  // 探す画面は、メモとチェックリストの文字でも探すので、文字の変化も見る（Codex #149）
  const full = S.view === 'search';
  return JSON.stringify(t, (k, v) => SIG_SKIP.has(k) ? undefined : k === 'doneAt' ? String(v || '').slice(0, 10) : full ? v : k === 'memo' ? !!v : k === 'checklist' && Array.isArray(v) ? v.map(c => !!(c && c.d)) : v);
}
function tasksSig() {
  return S.tasks.map(t => t.id + '\u0001' + rowSigOf(t)).sort().join('\u0002');
}
let SHOWN_SIG = '';
// 保存の答えを受けたあとの描き直し：画面に出した時と変わっていなければしない。ドラッグ中は指を離してから
function renderData() {
  if (tasksSig() === SHOWN_SIG) { if (S.loaded) saveCache(); return; } // 描き直さなくても、端末内の写しは最新に（Codex #149）
  if (drag) { renderAfterPointer(); return; }

}
async function addTask(t) {
  const tmp = Object.assign({ id: 'tmp' + Date.now(), listId: S.addList, doDate: '', doEnd: '', due: '', repeat: 'none',
    notifyAt: '', memo: '', done: false, createdAt: '', attachments: [], parentTaskId: '', checklist: [], reminders: [], order: '', wontDo: false,
    estimate: '', dayOrder: '', isSomeday: false, priority: 0, isPinned: false }, t);

// 完了・未完了を切り替える。wont なら「やらない」で終える
async function toggleDone(t, wont) {
  if (t.id.startsWith('tmp') || FINISHING.has(t.id)) return;
  if (!t.done && !wont) await finishMotion(t.id);
  const before = { done: t.done, wontDo: t.wontDo };
  bump(t.id);
  t.done = !t.done;
  t.wontDo = t.done && !!wont;
  t.doneAt = t.done ? today() + 'T' + new Date().toTimeString().slice(0, 8) : ''; // v0.45.0：先に入れておく（答えと同じなら描き直さない）
  render();
  try {
    const [r, back] = await callU('setDone', t.id, t.done, t.wontDo);
    // 返ってくるのは、自分・一緒に変わった子や親・繰り返しの次の回（作った／消した）
    const created = r.some(x => !x.removed && !taskOf(x.id));
    const removed = r.some(x => x.removed);
    r.forEach(x => { if (x.removed) S.tasks = S.tasks.filter(y => y.id !== x.id); else replaceTask(x); });
    report(t.done ? (t.wontDo ? 'やらないにしました' : '完了にしました') + (created ? '。次の回を作りました' : '')
      : (removed ? '未完了に戻し、次の回を取り消しました' : '未完了に戻しました'), back);
  } catch (e) { Object.assign(t, before); fail(e); }
  renderData(); // v0.45.0
}
// 完了にするとき、一覧の行の四角を青く塗って ✓ を出し、0.2秒ほどで薄くして消す（動きを減らす設定なら動かさない）。
// 消えたあとは下の知らせの「元に戻す」で戻せる
const FINISHING = new Set();
function finishMotion(id) {
  const rows = [...document.querySelectorAll('#main .task[data-id]')].filter(r => r.dataset.id === id);
  if (!rows.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return Promise.resolve();
  FINISHING.add(id);
  rows.forEach(r => { r.classList.add('finishing'); const c = r.querySelector('.chk'); if (c) c.replaceChildren(ic('check')); });
  return new Promise(res => setTimeout(() => { FINISHING.delete(id); res(); }, 220));
}
// 保存した結果を反映する。フォルダを移したときは、子・孫も一緒に移っている
// 子を足したり戻したりして、完了していた親が未完了に戻ったときは also に入っている
function applySaved(saved, oldId) {
  (saved.also || []).forEach(x => { if (x.removed) S.tasks = S.tasks.filter(y => y.id !== x.id); else replaceTask(x); });
  delete saved.also;
  replaceTask(saved, oldId);
  taskDescendants(saved.id).forEach(c => { c.listId = saved.listId; });
}
// 画面は先に変え、保存に失敗したら元に戻す
async function patchTask(t, patch) {
  if (t.id.startsWith('tmp')) return;
  const old = {};
  Object.keys(patch).forEach(k => { old[k] = t[k]; });
  Object.assign(t, patch);
  // v0.31.0：日付・フォルダが変わると行が移る（縮んで消える／詰まる／移り先が光る）
  if (['listId', 'doDate', 'due', 'doEnd', 'parentTaskId'].some(k => k in patch)) motionRender([t.id]); else render();
  try {
    const [saved, back] = await callU('saveTask', Object.assign({}, t));
    applySaved(saved);
    report('変えました', back);
  } catch (e) { Object.assign(t, old); fail(e); }
  renderData(); // v0.45.0：答えが同じなら描き直さない
}
// 実行日を newDay から始まるように動かす（期間の長さと時刻はそのまま）。実行日がなければその日にする
function moveDo(t, newDay) {
  if (!t.doDate) { patchTask(t, { doDate: newDay }); return; }
  const n = daysBetween(doFirst(t), newDay);
  if (n) patchTask(t, { doDate: shiftKeepTime(t.doDate, n), doEnd: shiftKeepTime(t.doEnd, n) });
}

// v0.32.0（B3）：日付の色は3段。過ぎた＝赤（over）・今日＝黄色寄りの橙（dtoday）・明日以降＝青（later）
function dueClass(t) {
  if (t.done || !t.due) return '';
  const td = today();
  const now = new Date();
  // 時刻付きの期限は、その時刻を過ぎたら期限切れ
  const last = dueLast(t);
  if (last < (timeOf(last) ? td + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes()) : td)) return 'over';
  if (day(t.due) <= td) return 'dtoday';
  return 'later';
}
function doClass(t) {
  if (t.done || !t.doDate) return '';
  const td = today();
  return doLast(t) < td ? 'late' : doFirst(t) <= td ? 'dtoday' : 'later';
}
// opt: tree（親子の形）・manual（手で並べた順）・drag（ドラッグで動かせる）・inDlg（編集画面の中）など
function taskRow(t, opt) {
  opt = opt || {};
  const td = today();

    onchange: e => { S.addList = e.target.value; } }, folderOptions(S.addList)) : null;
  // 読み取りの結果。× を押した言葉は読まない（名前に戻す）
  const chips = h('div', { class: 'qa-chips', 'aria-live': 'polite' });
  let skip = new Set();
  const parse = () => {
    const d = defaults();
    return quickParse(inp.value.trim(), { today: today(), folders: S.lists, skip, defaultDay: day(d.doDate || '') });
  };
  const showChips = () => {
    if (!quickOn() || !inp.value.trim()) { chips.replaceChildren(); return; }
    const r = parse();
    chips.replaceChildren(
      ...r.parts.map(p => h('span', { class: 'qa-chip', title: '読み取った言葉：' + p.raw },
        p.kind === 'folder' ? folderMark(p.value) : null, p.kind === 'folder' ? 'フォルダ ' + p.label : p.label,
        h('button', { type: 'button', title: '読み取らずに名前に戻す', 'aria-label': p.label + ' を読み取らずに名前に戻す',
          onmousedown: e => e.preventDefault(),
          onclick: () => { [p.i].concat(p.more || []).forEach(i => skip.add(i)); showChips(); inp.focus(); } }, '×'))),
      ...r.warn.map(w => h('span', { class: 'qa-warn' }, w)),
      ...(r.parts.length ? [h('span', { class: 'qa-hint' }, '名前「' + r.title + '」・Shift+Enterで読み取らずに追加')] : [])); // null を渡すと「null」と出る
  };
  const go = plain => {
    const text = inp.value.trim();
    if (!text) return;
    const t = Object.assign({ title: text }, defaults());
    if (sel) t.listId = sel.value;
    if (!plain && quickOn()) quickApply(t, parse());
    inp.value = '';
    skip = new Set();
    chips.replaceChildren();
    box.classList.remove('typing');
    addTask(t);
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); go(e.shiftKey); }
    // v0.40.0（12）：Esc で欄を閉じる（打ちかけは残す）
    if (e.key === 'Escape' && !e.isComposing) { e.preventDefault(); box.classList.remove('open'); inp.blur(); }
  });
  // 言葉の数が変わったら、× で戻した印を付け直す（打ち直した言葉は、また読む）
  let words = 0;
  inp.addEventListener('input', () => {
    const n = inp.value.trim().split(/[\s\u3000]+/).filter(Boolean).length;
    if (n !== words) { skip = new Set([...skip].filter(i => i < n - 1)); words = n; }
    showChips();
  });
  const base = () => Object.assign({ listId: S.addList }, defaults(), sel ? { listId: sel.value } : {});
  S.addBase = base;
  onPasteLines(inp, base);
  // 打ちかけの間は、フォルダの選択と＋を出したままにする
  const box = h('div', { class: 'qa main-qa' }, inp, sel,
    h('button', { class: 'icon tpl', title: 'テンプレートから作る', 'aria-label': 'テンプレートから作る', onclick: e => tplMenu(e.currentTarget, base) }, ic('template')),
    micBtn(inp), h('button', { class: 'icon', title: 'このタスクを追加する', 'aria-label': 'このタスクを追加する', onclick: () => go(false) }, ic('plus')), chips);
  inp.addEventListener('input', () => box.classList.toggle('typing', !!inp.value));
  // 欄に入ったら開き、何も打たずに外へ出たら閉じる（＋や⧉を押す間は待つ）
  box.addEventListener('focusin', () => box.classList.add('open'));
  box.addEventListener('focusout', () => setTimeout(() => {
    if (box.isConnected && !inp.value && !box.contains(document.activeElement) && !menu.contains(document.activeElement) && menu.hidden) box.classList.remove('open');
  }, 250));
  return box;
}

// v0.22.0：声でタスク名を入れる。聞き取った文は欄に入るだけで、確かめてから Enter・＋で追加する。
// 使えないブラウザ（仮想ブラウザなど）では出さない。一度使えなかった端末では、次から出さない
function micBtn(inp) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || loadFlag('todo-mic') === 'off') return null;
  const tip = '声で入れる（話し終わると欄に入ります）';
  const b = h('button', { type: 'button', class: 'icon mic', title: tip, 'aria-label': tip }, ic('mic'));
  let rec = null;
  b.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'ja-JP'; rec.interimResults = true; rec.maxAlternatives = 1;
    const before = inp.value;
    rec.onresult = e => {
      const heard = Array.from(e.results, r => r[0].transcript).join('');
      inp.value = (before ? before + ' ' : '') + heard;
      inp.dispatchEvent(new Event('input'));
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'network' || e.error === 'audio-capture') {
        saveFlag('todo-mic', 'off');
        status('この画面では声の入力が使えませんでした。Windows なら Win＋H、スマホならキーボードのマイクで入れられます', true);
        b.remove();
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') status('聞き取れませんでした（' + e.error + '）', true);
    };
    rec.onend = () => { rec = null; b.classList.remove('on'); inp.focus(); };
    try { rec.start(); b.classList.add('on'); status('聞いています…話し終わると欄に入ります'); }
    catch (e) { rec = null; status('声の入力を始められませんでした', true); }
  };
  return b;
}

// v0.32.0（B6）：全部終わったときの大きな ✓

// ---- 今日 ----
function viewToday(m) {
  const td = today();
  const open = liveTasks().filter(t => !t.done);
  const left = open.filter(t => t.doDate && doLast(t) < td);
  const now = open.filter(t => onDay(t, td));
  const soon = open.filter(t => t.due && day(t.due) <= addDays(td, 3) && !(t.doDate && doFirst(t) <= td));
  const finished = liveTasks().filter(t => t.done && (t.doneAt || '').slice(0, 10) === td);
  const planTip = '朝の段取り：やり残しの振り分け → 期限が近いものを選ぶ → 今日の順番';
  const sort = sortOf();
  const hand = sort.k === 'hand';
  m.append(h('div', { class: 'lhead' }, h('h2', null, dayTitle(td)),
    h('button', { class: 'icon', title: planTip, 'aria-label': planTip, onclick: openPlan }, ic('sunrise')), sortBtn(), selBtn()),
    loadBar(td) || '', quickAdd(() => ({ doDate: today() }), true));
  section(m, 'やり残し', left, '', { redo: true, drag: true, sort }, 'left');
  // v0.32.0（B6）：今日の分を全部終えたら、大きな ✓ とひと言（まだ何も無いときは今までの案内）
  const allDone = !now.length && !left.length && finished.length > 0;
  const tmN = open.filter(t => onDay(t, addDays(td, 1))).length;
  section(m, '今日やる', now, allDone ? allDoneBox('今日の分は全部終わりました', tmN ? '明日の分：' + tmN + '件' : '')
    : '今日やるタスクはありません。右下の＋から追加できます。', { drag: true, day: td, byDay: hand ? td : null, sort });
  section(m, '期限が近い（3日以内・期限切れ）', soon, '', { drag: true, sort });
  section(m, '今日終えた', finished, '');
}

// ---- 次の7日間（日ごとに並べ、別の日へドラッグすると実行日が変わる） ----
function viewNext7(m) {
  const td = today();
  const open = liveTasks().filter(t => !t.done);
  const sort = sortOf();
  m.append(h('div', { class: 'lhead' }, h('h2', null, '次の7日間'), sortBtn(), selBtn()), quickAdd(() => ({ doDate: today() }), true));
  const left = open.filter(t => (t.doDate ? doLast(t) < td : t.due && day(t.due) < td));

// ---- v0.26.0（20番）：完了の一覧（完了・やらないで終えたものを、終えた日ごとに新しい順。□ で未完了に戻す） ----
function viewDone(m) {
  const done = S.tasks.filter(t => t.done && !t.id.startsWith('tmp')).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  m.append(h('div', { class: 'lhead' }, h('h2', null, '完了'), selBtn()),
    h('p', { class: 'note' }, '完了・やらないで終えたタスクです（新しい順・300件まで）。□ を押すと未完了に戻ります。'));

// ---- 探す（タスク名・メモ・チェックリスト。言葉をスペースで区切ると全部を含むもの） ----
function viewSearch(m) {
  const inp = h('input', { type: 'search', class: 'qa-in', placeholder: '探す言葉（タスク名・メモ・チェックリスト・予定）', 'aria-label': '探す言葉', autocomplete: 'off' });
  inp.value = S.q;
  const box = h('div');
  const draw = () => {
    const words = norm(S.q).split(/\s+/).filter(Boolean);
    if (!words.length) { box.replaceChildren(h('p', { class: 'empty' }, '言葉を入れると、ここに出ます。')); return; }
    const hits = S.tasks.filter(t => (S.qDone || !t.done) && !t.id.startsWith('tmp') && (() => {
      const s = norm([t.title, t.memo, (t.checklist || []).map(x => x.t).join(' ')].join(' '));
      return words.every(w => s.includes(w));
    })());
    const list = sortTasks(hits.filter(t => !t.done)).concat(hits.filter(t => t.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '')));
    const eq = S.evQ && S.evQ.q === S.q ? S.evQ : null;
    const wd = d => '日月火水木金土'[toDate(d).getDay()];
    const evWhen = e => { const d = day(e.start); return d.slice(0, 4) + '/' + md(d) + '(' + wd(d) + ')' + (e.allDay ? '' : ' ' + tmLabel(timeOf(e.start))); };
    box.replaceChildren(secBox('見つかったタスク', hits.length, '', null, null,
      list.length ? list.slice(0, 200).map(t => taskRow(t)) : h('p', { class: 'empty' }, '見つかりませんでした。')),
      // v0.29.0（10番の9）：予定も探す（表示しているカレンダー、1年前〜2年先）
      secBox('見つかった予定', eq && eq.list ? eq.list.length : '…', '', null, null,
        !eq || !eq.list ? h('p', { class: 'empty' }, '探しています…')
          : eq.list.length ? eq.list.map(e => h('button', { class: 'evrow ev-hit', style: '--evc:' + (e.color || ''), onclick: () => openEvent(e) }, h('span', { class: 'w' }, evWhen(e)), h('span', { class: 't' }, e.title, ' ', h('span', { class: 'cal' }, e.calendar || ''))))
          : h('p', { class: 'empty' }, eq.err ? '予定を探せませんでした（' + eq.err + '）' : '予定は見つかりませんでした（1年前〜2年先）。')));
  };
  const draw0 = draw;
  const drawEv = () => { if (S.view === 'search') draw0(); };
  inp.addEventListener('input', () => { S.q = inp.value; evSearch(S.q, drawEv); draw(); });
  evSearch(S.q, drawEv);
  const tip = S.qDone ? '完了したタスクは探さない' : '完了したタスクも探す';
  m.append(h('div', { class: 'lhead' }, h('h2', null, '探す'),
    h('button', { class: 'icon' + (S.qDone ? ' on' : ''), title: tip, 'aria-label': tip, onclick: () => { S.qDone = !S.qDone; render(); } }, '✓'),
    selBtn()), h('div', { class: 'qa' }, inp), box);
  draw();
  if (S.focusSearch) { S.focusSearch = false; inp.focus(); }
}

// ---- フォルダ ----
// フォルダを開くと、その中と、中のフォルダのタスクをフォルダごとに並べる（フォルダを開き直さなくても見える）。
// ここでは手で並べた順に出し、ドラッグで並べ替え・子タスクにする・フォルダを移すができる
function viewLists(m) {
  const cur = listOf(S.folderId);
  if (!cur) S.folderId = '';
  // パンくず（今いる場所）
  const crumb = h('div', { class: 'crumb' }, h('button', { class: 'cf', 'data-ftop': '1', onclick: () => goFolder('') }, 'すべて'));
  const chain = [];
  for (let l = cur, i = 0; l && i < 50; l = listOf(parentOf(l)), i++) chain.unshift(l);
  // v0.41.0（受付19 E）：道のりは名前と同じ行に小さく（今いるフォルダの名前は見出しが兼ねる）
  chain.slice(0, -1).forEach(l => crumb.append('›', h('button', { class: 'cf', 'data-list': l.id, onclick: () => goFolder(l.id) }, dispName(l))));
  if (cur) crumb.append('›');
  const doneTip = S.showDone ? '完了したタスクを隠す' : '完了したタスクも表示する';
  const newTip = cur ? 'この中にフォルダを作る' : 'フォルダを作る';
  // 予定の帯は、ふだんは畳んで「予定 N」のボタンだけ（開け閉めは覚える）
  const band = cur ? folderEvBand(cur) : null;
  const nEv = band ? band.dataset.n : '';
  const evTip = (S.evOpen ? 'この業務の予定を畳む' : 'この業務の予定を出す') + (nEv ? '（' + nEv + '件）' : '');
  const evBtn = band ? h('button', { class: 'icon evbtn' + (S.evOpen ? ' on' : ''), title: evTip, 'aria-label': evTip, 'aria-expanded': String(!!S.evOpen),
    onclick: () => { S.evOpen = !S.evOpen; saveFlag('todo-evband', S.evOpen ? 'open' : ''); render(); } }, ic('calendar'), nEv > 0 ? h('span', { class: 'tcnt' }, nEv) : null) : null;
  m.append(h('div', { class: 'lhead' + (cur ? ' withcrumb' : '') }, cur ? crumb : null, folderTitle(cur), evBtn,
    cur ? h('button', { class: 'icon', title: 'このフォルダの名前や場所・色を変える', 'aria-label': 'このフォルダの名前や場所・色を変える', onclick: () => openList(cur, '') }, ic('edit')) : null,
    h('button', { class: 'icon', title: newTip, 'aria-label': newTip, onclick: () => openList(null, S.folderId) }, '⊞'),
    h('button', { class: 'icon' + (S.showDone ? ' on' : ''), title: doneTip, 'aria-label': doneTip, onclick: () => { S.showDone = !S.showDone; render(); } }, '✓'),
    sortBtn(), selBtn()));
  if (band && S.evOpen) m.append(band);
  m.append(quickAdd(() => (cur ? { listId: cur.id } : {}), !cur));
  const shown = cur ? [cur].concat(tree(cur.id).map(x => x.l)) : tree('').map(x => x.l);
  const sort = sortOf();
  const rowOpt = { showList: false, tree: true, manual: sort.k === 'hand', drag: true, sort };
  let any = false;
  if (cur) {
    const open = S.tasks.filter(t => !t.done && t.listId === cur.id);
    any = any || open.length > 0;
    m.append(secBox('このフォルダ', open.length, '', {}, addHereBtn(cur, 'lists:' + cur.id + ':このフォルダ'), folderAddRow(cur), open.length ? rowsOf(open, rowOpt) : h('p', { class: 'empty' }, '未完了のタスクはありません。')));
  }
  // v0.40.0（3・受付1）：中のフォルダは1行の道のりにせず、入れ子の見出しで全部ひらく。中身のない子フォルダも件数0で出す
  // 済のフォルダは出さない（開いているのが済のフォルダなら、その中は出す）
  const showClosed = cur && isClosedList(cur.id);
  const node = (f, depth) => {
    const open = S.tasks.filter(t => !t.done && t.listId === f.id);
    if (open.length) any = true;
    // v0.29.0（2番）：中のフォルダの見出しの下にも、そのフォルダの予定の帯（予定があるときだけ）
    const band = cur && S.evOpen ? folderEvBand(f, true) : null;  // Codex：予定の帯を畳んだら中のフォルダの帯も出さない
    const kids = depth < 30 ? childrenOf(f.id).filter(k => showClosed || !k.closed).map(k => node(k, depth + 1)) : [];
    const sec = secBox(h('button', { class: 'flink', title: '「' + pathOf(f.id) + '」を開く（見出しをつかんでほかのフォルダへ動かせる）', onclick: () => goFolder(f.id) }, folderMark(f.id), dispName(f)),
      open.length, 'fsec', { 'data-list': f.id, 'data-depth': String(depth), 'data-sk': secKeyOf(f) }, addHereBtn(f, secKeyOf(f)), band, folderAddRow(f), open.length ? rowsOf(open, rowOpt) : null, ...kids);
    // v0.40.0（9）：見出しをつかんで、ほかの見出し・上の道のり・左のフォルダへ落とすと、その中へ移る。タスクを見出しに落とすと、そのフォルダへ
    const hd = sec.querySelector('h3');
    hd.classList.add('fhead'); hd.dataset.list = f.id; hd.dataset.fdrag = '1';
    return sec;
  };
  childrenOf(cur ? cur.id : '').filter(k => showClosed || !k.closed).forEach(f => m.append(node(f, 0)));
  if (!cur) {
    const lost = S.tasks.filter(t => !t.done && !listOf(t.listId));
    if (lost.length) section(m, 'フォルダなし', lost, '', { tree: true });
    if (!S.lists.length) m.append(h('p', { class: 'empty' }, 'フォルダがありません。⊞で作ってください。'));
    else if (!any && !lost.length) m.append(h('p', { class: 'empty' }, '未完了のタスクはありません。右下の＋から追加できます。'));
  }
  const ids = shown.map(f => f.id);
  const dn = S.tasks.filter(t => t.done && (ids.includes(t.listId) || (!cur && !listOf(t.listId))))
    .sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  if (S.showDone) {
    m.append(secBox('完了', dn.length, '', null, null,
      dn.length ? dn.map(t => taskRow(t, { showList: shown.length > 1 })) : h('p', { class: 'empty' }, '完了したタスクはありません。')));
  } else if (dn.length) {
    // v0.40.0（15）：完了したタスクは、閉じた「完了」の見出しをいちばん下に出す（押すと開く。上の ✓ と同じ）
    m.append(h('section', { class: 'sec done-shut' }, h('h3', null, h('button', { type: 'button', class: 'sh', title: '完了したタスクを表示する', 'aria-expanded': 'false',
      onclick: e => { const sec = e.currentTarget.closest('section'); const from = sec ? sec.offsetHeight : 0; S.showDone = true; render(); const now = [...document.querySelectorAll('#main section.sec')].pop(); if (now) slideOpen(now, from); } }, h('span', { class: 'arw' }, '▸'), '完了'), h('span', { class: 'cnt' }, dn.length))));
  }
}

// v0.40.0（14）：フォルダの画面の名前は、押すとその場で直せる（Enter・外を押すと保存、Esc でやめる）。インボックスは直せない
function folderTitle(cur) {
  if (!cur) return h('h2', null, 'すべてのフォルダ');
  if (S.renFolder !== cur.id || isInbox(cur)) {
    return h('h2', null, folderMark(cur.id), isInbox(cur) ? dispName(cur)
      : h('span', { class: 'ren-f', role: 'button', tabindex: '0', title: '押すと名前を直せる', onclick: () => { S.renFolder = cur.id; S.renFolderSel = true; render(); },
        onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); S.renFolder = cur.id; S.renFolderSel = true; render(); } } }, cur.name));
  }
  const inp = h('input', { type: 'text', class: 'ren-f-in', value: cur.name, 'aria-label': 'フォルダの名前', autocomplete: 'off' });
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    S.renFolder = null;
    const name = inp.value.trim();
    if (!save || !name || name === cur.name) { render(); return; }
    const old = Object.assign({}, cur);
    const i = S.lists.indexOf(cur);
    S.lists[i] = Object.assign({}, cur, { name });
    render();

// 押したボタンの下（入らなければ上）に出す。狭い画面では下から出す

  const sheet = innerWidth < 560;

function weekStart() { return S.settings.weekStart === 'mon' ? 1 : 0; }

// 時間の帯の1時間の高さ。v0.16.0：Ctrl＋ホイールで変えられ、この端末に覚える（0なら画面の幅で決める）

function hourH() { return HH_USER || Math.round(Math.max(innerWidth < 560 ? 40 : 46, Math.min(64, (innerHeight - 260) / 12))); } // 窓の高さで12時間分ほどが見える（v0.18.0）

let ALLH_USER = (v => v >= 20 && v <= 2000 ? Math.round(v) : 0)(Number(loadFlag('todo-allh')));
function eventsOn(d) {
  const ev = (S.events[d.slice(0, 7)] || []).filter(e => !eventHidden(e));
  const next = addDays(d, 1);
  // 時間指定の予定は、その日の0時〜翌日0時と重なっていれば出す（日をまたぐ予定も両方の日に出る）
  return ev.filter(e => e.allDay ? (e.start <= d && d < e.end) : (e.start < next + 'T00:00' && e.end > d + 'T00:00'));
}
// v0.26.0（25番）：予定は月ごとに、この端末に覚えたものを先に出し、開いてから1回だけ裏で読み直して丸ごと置き換える。
// 読めなかったときは前の中身を残す。設定を変えた・読み直したあとに届いた古い答えは捨てる（evGen）。前後の月も先に読んでおく
S.evFresh = new Set();
S.evGen = 0;
try { const o = JSON.parse(loadFlag('todo-ev') || 'null'); if (o && o.v === 1 && o.m) S.events = Object.assign({}, o.m); } catch (e) { /* 覚えていなければ読むだけ */ }
function shiftMonth(key, n) { const [y, mo] = key.split('-').map(Number); return ymd(new Date(y, mo - 1 + n, 1)).slice(0, 7); }
function needEvents(days) {
  // 月表示は前月・当月・翌月の3か月にまたがることがあるので、表示する日すべての月を読む
  const keys = [...new Set(days.map(d => d.slice(0, 7)))];
  keys.forEach(fetchMonth);
  if (keys.length) setTimeout(() => { fetchMonth(shiftMonth(keys[0], -1)); fetchMonth(shiftMonth(keys[keys.length - 1], 1)); }, 600);
  return keys.some(k => S.events[k] == null);
}
function fetchMonth(key) {
  if (S.evFresh.has(key)) return;
  S.evFresh.add(key);
  if (S.events[key] === undefined) S.events[key] = null; // 読み込み中
  loadEvents(key, key + '-01', shiftMonth(key, 1) + '-01');
}
async function loadEvents(key, from, to) {
  const gen = S.evGen;
  const before = JSON.stringify(S.events[key] || null);
  try {
    const got = await call('getEvents', from, to);
    if (gen !== S.evGen) { S.evFresh.delete(key); return; }
    S.events[key] = got;
    saveEvCache();
  } catch (e) {
    if (gen !== S.evGen) { S.evFresh.delete(key); return; }
    if (S.events[key] == null) { S.events[key] = []; fail(e); }
  }
  if ((S.view === 'cal' || S.view === 'lists') && JSON.stringify(S.events[key]) !== before) render();
}
function saveEvCache() {
  const m = {};
  Object.keys(S.events).filter(k => Array.isArray(S.events[k])).sort().slice(-8).forEach(k => { m[k] = S.events[k]; });
  saveFlag('todo-ev', JSON.stringify({ v: 1, m }));
}
// from〜to の日にかかる予定（月ごとに読んでいるので、月をまたぐ予定は1つにまとめる）
function eventsIn(from, to) {
  const seen = new Set();
  const out = [];
  for (let k = from.slice(0, 7), i = 0; k <= to.slice(0, 7) && i < 4; k = addDays(k + '-28', 7).slice(0, 7), i++) {
    (S.events[k] || []).forEach(e => {
      if (eventHidden(e)) return;
      const key = e.id ? (e.calendarId || '') + '|' + e.id + '|' + e.start : e.title + '|' + e.start + '|' + e.end;
      if (!seen.has(key)) { seen.add(key); out.push(e); }
    });
  }
  return out;
}
// from〜to に出すもの。s〜e は日（期間なら最初と最後の日）。timed は時間の帯に置けるもの（1日の中で時刻があるもの）
function calItems(from, to) {
  const out = [];
  const hit = (s, e) => s <= to && e >= from;
  // v0.23.0：繰り返しのタスクは、見ている範囲の先の回もすべて点線の枠で出す（ghost。押すと今の回の詳細を開く）
  liveTasks().forEach(t => {
    // v0.16.0：完了したタスクも薄く出す（□で未完了に戻せるように）。「やらない」で終えたものは出さない
    if (t.done && t.wontDo) return;
    if (taskHiddenOnCal(t)) return; // v0.26.0（19番）：左のチェックで外したフォルダ
    addItem(t, false);
    repeatOccurrences(t, from, to).forEach(o => addItem(Object.assign({}, t, o), true));
  });
  function addItem(t, ghost) {
    const color = colorOf(t.listId);
    if (t.doDate) {
      const s = doFirst(t);
      const e = doLast(t) < s ? s : doLast(t);
      if (hit(s, e)) {
        const tm = timeOf(t.doDate);
        const sMin = tm ? mins(tm) : 0;
        const hasEnd = !!(tm && t.doEnd && timeOf(t.doEnd) && s === e);
        // 終わりがなければ所要時間の長さの帯（v0.34.0 受付11。所要時間も無ければ30分）
        let eMin = hasEnd ? mins(timeOf(t.doEnd)) : sMin + (Number(t.estimate) > 0 ? Math.min(Number(t.estimate), 1440) : 30);
        if (eMin <= sMin) eMin = sMin + 30;
        // v0.20.0：期限が実行日（期間ならその間）の日なら、⚑ は別に出さず、この帯に ⚑ を付けて1つにまとめる（2026-11-06 ユーザーがカードで決定）
        const flag = !!t.due && day(dueLast(t)) === day(t.due) && day(t.due) >= s && day(t.due) <= e;
        out.push({ kind: 'do', t, s, e, timed: !!tm && s === e, sMin, eMin: Math.min(eMin, 1440), hasEnd, key: tm, title: (flag ? '⚑' : '') + t.title, color, flag, ghost });
      }
    }
    // v0.25.0（7番）：期限に期間があれば、期限の帯を始まり〜終わりで出す（実行日の帯に ⚑ でまとめるのは1日の期限だけ）
    const dS = t.due ? day(t.due) : '', dE = t.due ? day(dueLast(t)) : '';
    const inDo = t.doDate && dS === dE && dS >= doFirst(t) && dS <= (doLast(t) < doFirst(t) ? doFirst(t) : doLast(t));
    if (t.due && hit(dS, dE) && !inDo) {
      const tm = timeOf(t.due);
      const sMin = tm ? mins(tm) : 0;
      const te = dS === dE && t.dueEnd > t.due && timeOf(t.dueEnd) ? mins(timeOf(t.dueEnd)) : 0;
      out.push({ kind: 'due', t, s: dS, e: dE, timed: !!tm && dS === dE, sMin, eMin: Math.min(te > sMin ? te : sMin + 30, 1440), key: tm, title: '⚑' + t.title, color, ghost });
    }
  }
  eventsIn(from, to).forEach(ev => {
    let s, e, sMin = 0, eMin = 0, timed = false;
    if (ev.allDay) {
      s = ev.start;
      e = addDays(ev.end, -1) < s ? s : addDays(ev.end, -1);
    } else {
      s = day(ev.start);
      e = timeOf(ev.end) === '00:00' ? addDays(day(ev.end), -1) : day(ev.end);
      if (e < s) e = s;
      timed = s === e;
      sMin = mins(timeOf(ev.start));
      eMin = day(ev.end) === s ? mins(timeOf(ev.end)) : 1440;
      if (eMin <= sMin) eMin = Math.min(sMin + 30, 1440);
    }
    if (hit(s, e)) out.push({ kind: 'ev', ev, s, e, timed, sMin, eMin, key: ev.allDay ? '' : timeOf(ev.start), title: ev.title, color: ev.color });
  });
  return out;
}
// days の段に、重ならないように詰めて並べる（済んでいないものを先に。長い期間を先に、次に終日、時刻の順）
function packLanes(items, days) {
  const n = days.length;
  const rows = items.map(x => ({ x, c0: Math.max(0, daysBetween(days[0], x.s)), c1: Math.min(n - 1, daysBetween(days[0], x.e)) }));

  const toMin = el => { const v = el.value.trim(); if (v === '') return ''; const n = Number(v); return isFinite(n) && n >= 0 && n <= 24 ? String(Math.round(n * 60)) : null; };
  const collect = () => ({ calendarIds: cals.value.trim(), weekStart: wstart.value, freeWeekday: toMin(freeW), freeHoliday: toMin(freeH) });
  // v0.35.0（受付18）：保存ボタンをなくし、変えたら少し待って保存。知らせの ↶ で変える前に戻せる（変えたものだけ送る）
  // Codex：保存の列・世代は画面の外（SETQ）に持ち、比べる元はいまの S.settings（先に画面へ入れる）
  const save = () => {
    SETQ.t = 0; SETQ.fn = null;
    const o = collect();
    if (o.freeWeekday === null || o.freeHoliday === null) { status('使える時間は0〜24の数（時間）で入れてください', true); return; }
    const ch = {}, back = {};
    Object.keys(o).forEach(k => { if (o[k] !== setNow(k)) { ch[k] = o[k]; back[k] = setNow(k); } });
    if (Object.keys(ch).length) sendSettings(ch, back, true);
  };
  const later = () => { clearTimeout(SETQ.t); SETQ.fn = save; SETQ.t = setTimeout(save, 800); };
  [freeW, freeH].forEach(x => x.addEventListener('input', later));
  wstart.addEventListener('change', save);
  cals.addEventListener('change', later);
  const tpls = S.templates.map(tp => {
    const del = h('button', { class: 'mini', title: 'このテンプレートを消す' }, ic('close'));
    del.onclick = async () => {
      if (!del.dataset.ask) { del.dataset.ask = '1'; del.textContent = 'もう一度押すと消す'; return; }
      try { S.templates = await call('deleteTemplate', tp.id); status('消しました'); } catch (e) { fail(e); }
      render();
    };
    return h('div', { class: 'att' }, h('span', { style: 'flex:1' }, ic('template'), ' ' + tp.name + (tp.kids ? '（子タスク ' + tp.kids + '）' : '')), del);
  });
  // v0.22.0：設定は全画面。左にカテゴリ、右に中身（狭い画面はカテゴリの一覧 → 中身の2段）
  const sec = (title, ...kids) => h('section', { class: 'sec form' }, h('h3', null, title), ...kids);
  const cats = [
    ['view', '表示', 'sun', () => [themeSection(), viewPrefSection()]],
    ['input', '入力', 'edit', () => [inputPrefSection()]],
    ['time', '1日の時間', 'clock', () => [sec('1日にタスクへ使える時間',
      h('div', { class: 'row' }, h('label', null, '平日（時間）', freeW), h('label', null, '土日・祝日（時間）', freeH)),
      h('p', { class: 'note' }, '今日・明日の見出しの下に「見積 ○／使える時間 ○／残り ○」を出し、超えたら橙色で知らせます。空にすると使える時間は出しません。祝日はGoogleカレンダーの「日本の祝日」から読みます。変えると自動で保存します。'))]],
    ['cal', 'カレンダー', 'calendar', () => [sec('カレンダー',
      h('label', null, '週の始まり', wstart),
      h('div', null, h('div', { class: 'note' }, '表示するカレンダー（チェックしたものの予定をカレンダー画面に出します。カレンダー画面の左のチェックで一時的に隠せます）'), calBox), cals,
      h('p', { class: 'note' }, '一覧にないカレンダーは、Googleカレンダーで「登録」してから開き直すと出ます。祝日は、チェックしなくても日付の色と名前で出ます。変えると自動で保存します。'))]],
    // v0.32.0（A6）：つながりの様子と、TickTick・場所の候補の設定を「接続」にまとめる
    ['conn', '接続', 'link', () => [connSection(), ttSection(), placesSection(sec)]],
    ['tpl', 'テンプレート', 'template', () => [sec('テンプレート',
      tpls.length ? tpls : h('p', { class: 'empty' }, 'まだありません。タスクの詳細の「⋯」から作れます。'))]],
    ['keys', 'キー操作', 'clipboard', () => [sec('キー操作',
      h('div', { class: 'row' }, h('button', { class: 'btn icon-btn', title: 'キーボードでできることの一覧を出す（? キーでも出る）', 'aria-label': 'キー操作の一覧', onclick: openKeys }, '⌨')))]],
    ['backup', 'バックアップ', 'backup', () => [backupSection()]],
    ['about', 'この版・更新', 'note', () => [updateSection(),
      S.perf ? h('p', { class: 'note' }, '前回の読み込み：サーバーとの通信 ' + (S.perf.net / 1000).toFixed(1) + '秒・画面を描く ' + (S.perf.draw / 1000).toFixed(2) + '秒（タスク ' + S.perf.n + '件）') : null,
      h('p', { class: 'note' }, 'To Cal v' + VERSION + '　データはこのアプリのスプレッドシート、添付ファイルはGoogleドライブの「ToDoアプリ_添付」フォルダに保存されています。')]],
  ];
  const narrow = matchMedia('(max-width: 599px)').matches;
  if (!cats.some(c => c[0] === S.setCat)) S.setCat = narrow ? '' : 'view';
  const cur = cats.find(c => c[0] === S.setCat);
  const back = () => {
    if (narrow && S.setCat) { S.setCat = ''; render(); return; }
    S.setCat = ''; goView(S.backView && S.backView !== 'settings' ? S.backView : 'today');
  };
  const top = h('div', { class: 'set-top' },
    h('button', { class: 'icon', title: '戻る', 'aria-label': '戻る', onclick: back }, ic('back')),
    h('h2', null, narrow && cur ? cur[1] : '設定'));
  const nav = h('nav', { class: 'set-nav', 'aria-label': '設定のカテゴリ' }, cats.map(([k, t, icn]) =>
    h('button', { type: 'button', class: k === S.setCat ? 'on' : '', 'aria-current': k === S.setCat ? 'page' : null,
      onclick: () => { S.setCat = k; render(); } }, ic(icn), h('span', null, t), narrow ? h('span', { class: 'set-go' }, '›') : null)));
  const body = h('div', { class: 'set-body' }, cur ? cur[3]() : null);
  m.append(top, h('div', { class: 'set-wrap' + (narrow ? (cur ? ' one' : ' list') : '') }, nav, body));
}

// ---- TickTick と同期（v0.14.0 つなぐ・下見、v0.15.0 取り込み・同期・確認待ち）----
function ttSection() {
  const msg = h('p', { class: 'note', role: 'status' }, '');
  const box = h('div');
  const out = h('div');
  const say = (t, err) => { msg.textContent = t; msg.style.color = err ? 'var(--late)' : ''; };
  const errText = e => (e && e.message) || String(e);
  const btn = (icon, text, title, fn, primary) => h('button', { class: 'btn' + (primary ? ' primary' : ''), title, onclick: fn }, icon ? ic(icon) : null, (icon ? ' ' : '') + text);
  const keyForm = st => {
    const id = h('input', { type: 'text', placeholder: 'Client ID', autocomplete: 'off', 'aria-label': 'Client ID' });
    const sec = h('input', { type: 'password', placeholder: 'Client Secret', autocomplete: 'off', 'aria-label': 'Client Secret' });
    const url = h('input', { type: 'text', readonly: true, value: st.redirectUri || '（ウェブアプリとして公開すると出ます）', 'aria-label': '戻り先の URL' });
    return h('div', null,
      h('label', null, 'TickTick の開発者サイトの「OAuth redirect URL」に入れる URL', url),
      h('div', { class: 'row' }, btn('copy', 'URL を写す', '戻り先の URL を写す', async () => {
        try { await navigator.clipboard.writeText(st.redirectUri); say('写しました'); } catch (e) { url.select(); say('選んだ文字を Ctrl+C で写してください'); }
      })),
      h('label', null, 'Client ID', id),
      h('label', null, 'Client Secret', sec),
      h('div', { class: 'row' }, btn('check', '保存', '2つの鍵をこのアプリのサーバーだけに保存する', async () => {
        say('保存しています…');
        try { const r = await call('ttSaveKeys', id.value, sec.value); sec.value = ''; say('保存しました。次に「つなぐ」を押してください。'); show(r); }
        catch (e) { say(errText(e), true); }
      }, true)),
      h('p', { class: 'note' }, '鍵はこのアプリのサーバー（スクリプトのプロパティ）にだけ保存し、画面にもう一度は出しません。'));
  };
  const show = st => {
    box.textContent = '';
    out.textContent = '';
    if (!st.hasKeys) { box.append(keyForm(st)); say('TickTick の開発者サイトで作った Client ID と Client Secret を入れてください。'); return; }
    if (!st.connected) {
      const link = h('a', { target: '_blank', rel: 'noopener', style: 'display:none' }, 'TickTick の許可の画面を開く');
      box.append(h('div', { class: 'row' },
        btn('arrowRight', 'つなぐ', 'TickTick の許可の画面を開く（別のタブ）', async () => {
          try {
            const u = await call('ttAuthUrl');
            link.href = u; link.style.display = '';
            window.open(u, '_blank', 'noopener');
            say('別のタブで「許可」を押し、「つながりました」と出たら、ここで ↻ を押してください（10分以内）。');
          } catch (e) { say(errText(e), true); }
        }, true),
        btn('refresh', '', 'つながったか確かめる', async () => show(await call('ttStatus'))),
        btn('edit', '鍵を入れ直す', 'Client ID と Client Secret を入れ直す', () => { box.textContent = ''; box.append(keyForm(st)); })),
        link);
      say('鍵は保存してあります。「つなぐ」を押して、TickTick で許可してください。');
      return;
    }
    const disconnect = btn('close', '切る', 'TickTick とのつながりを切る（鍵は残る。同期も止まる）', async () => {
      if (!confirm('TickTick とのつながりを切りますか？（同期も止まります。あとで「つなぐ」でつなぎ直せます）')) return;
      try { if (st.sync) await call('ttSetSync', false); show(await call('ttDisconnect')); say('切りました'); } catch (e) { say(errText(e), true); }
    });
    if (!st.imported) {
      // v0.22.0：最初の取り込み（下見・準備・入れ替え）はやめた
      box.append(h('div', { class: 'row' }, disconnect));
      say('つながっています。最初の取り込みは v0.22.0 でやめたため、ここからは同期できません。');
      return;
    }
    // 取り込み済み：同期のスイッチ・今すぐ同期・確認待ち
    const cbox = h('div');
    const showConflicts = list => {
      cbox.textContent = '';
      S.ttConflicts = list.length; // 上の知らせの数もそろえる
      if (!list.length) return;
      cbox.append(h('h4', null, ic('warn'), ' 確認待ち（' + list.length + '）'),
        h('p', { class: 'note' }, '両方で同じところを変えたタスクです。どちらを残すか選ぶと、次の同期でもう片方に写ります。'),
        ...list.map(c => h('div', { class: 'tt-conf' },
          h('b', null, c.title),
          h('table', null, h('tr', null, h('th', null, ''), h('th', null, 'アプリ'), h('th', null, 'TickTick')),
            c.fields.map(f => h('tr', null, h('td', null, f.name), h('td', null, f.app), h('td', null, f.tt)))),
          h('div', { class: 'row' },
            btn('check', 'アプリを残す', 'アプリの中身を TickTick に写す', async () => { try { showConflicts(await call('ttResolve', c.appId, 'app')); say('選びました。次の同期で写ります。'); } catch (e) { say(errText(e), true); } }),
            btn('check', 'TickTickを残す', 'TickTick の中身をアプリに写す', async () => { try { showConflicts(await call('ttResolve', c.appId, 'tt')); say('選びました。次の同期で写ります。'); } catch (e) { say(errText(e), true); } })))));
    };
    const sw = btn(st.sync ? 'ban' : 'repeat', st.sync ? '同期を止める' : '同期を入れる', st.sync ? '5分ごとの同期を止める' : '5分ごとに TickTick と同期する', async () => {
      // v0.26.0：バックアップから戻したあとの再開は、何が起きるかを見せてから
      if (!st.sync && st.restored && !confirm('バックアップから戻したあと、初めて同期を入れます。\n\n'
        + '普通の同期に戻るので、バックアップのあとに TickTick で足したタスクはアプリに入り、TickTick で直したものはアプリでも直り、TickTick で消したものはアプリでも消えます。\n'
        + 'アプリで戻した中身のうち、TickTick で触っていないものは TickTick にも写ります。\n\n同期を入れますか？')) return;
      try { show(await call('ttSetSync', !st.sync)); say(st.sync ? '止めました' : '入れました。5分ごとに同期します。'); } catch (e) { say(errText(e), true); }
    }, !st.sync);
    box.append(h('div', { class: 'row' }, sw,
      btn('refresh', '今すぐ同期', '今すぐ1回同期する', async () => {
        say('同期しています…');
        try { const r = await call('ttSyncNow'); say(r.msg); showConflicts(await call('ttConflicts')); load(); }
        catch (e) { say(errText(e), true); }
      }),
      disconnect), cbox);
    call('ttConflicts').then(showConflicts).catch(() => {});
    const s1 = st.status;
    if (st.restored) { say('バックアップから戻したので同期を止めています（' + mdt(st.restored) + '）。中身を確かめてから「同期を入れる」で再開してください。', true); return; }
    say((st.sync ? '同期しています（5分ごと）。' : '同期は止めてあります。') + (s1 ? '前回 ' + mdt(s1.at) + '：' + s1.msg : ''), s1 && s1.ok === false);
  };
  call('ttStatus').then(show).catch(e => say('状態を読めませんでした：' + errText(e), true));
  return h('section', { class: 'sec form' }, h('h3', null, 'TickTick と同期'),
    h('p', { class: 'note' }, 'タスクとフォルダ構成を両方向に写します（TickTick のリスト＝フォルダ、TickTick のフォルダ＝上のフォルダ）。写せない設定は、もう片方の決め方をそのまま残します。'),
    box, msg, out);
}

// ---- アプリの更新（⚙ の ⟳）----
// 配布リポの新しい版を、署名とハッシュ値（ファイルの指紋）を確かめてから、このスクリプトに書き込む。
// 書き替える前の中身は控え（バージョン）に残し、途中で失敗したら元に戻す
// v0.25.0（27番）：バックアップ。毎日3時ごろ自動で、ドライブの「ToDoアプリ_バックアップ」に写しを作る（30個まで）。v0.26.0 から戻せる
function backupSection() {
  const errText = e => (e && e.message) || String(e);
  const list = h('div', { class: 'bk-list' }, h('p', { class: 'note' }, '読み込んでいます…'));
  const msg = h('p', { class: 'note', 'aria-live': 'polite' });
  const show = r => {
    msg.textContent = (r.last ? '最後に取れた日時：' + r.last.replace('T', ' ').slice(0, 16) : 'まだ取っていません') + (r.error ? '　自動で取れなかったとき：' + r.error : '');
    msg.classList.toggle('err', !!r.error);
    list.replaceChildren(...(r.items.length ? r.items.map(x => h('div', { class: 'row' },
      h('a', { href: x.url, target: '_blank', rel: 'noopener', title: 'Googleドライブで開く（中を見るだけ）' }, x.at),
      h('span', { class: 'note', style: 'flex:1' }, (x.why || '') + (x.tasks !== '' ? '・タスク ' + x.tasks + '件' : '')),
      h('button', { class: 'icon', title: 'この日時の中身に戻す（先に件数を見せます）', 'aria-label': x.at + 'のバックアップに戻す', onclick: () => restore(x) }, ic('restore')))) : [h('p', { class: 'empty' }, 'まだありません')]));
  };
  // v0.26.0：バックアップから戻す。件数を見せてから、今の状態を「戻す前」として写し、中身を入れ替える。TickTick 同期は止まる（2026-11-07 本人カード）
  const restore = async x => {
    msg.classList.remove('err');

// ---- 繰り返しを選ぶ（TickTick のように、よく使うものを並べ、カスタムで間隔・曜日・第N曜日を選ぶ） ----
function firstFrom(s, ok) {
  for (let i = 0; i < 400; i++) { const x = addDays(s, i); if (ok(toDate(x), x)) return x; }
  return s;
}
// 繰り返しを決める。newDay が今の起点と違えば、実行日（なければ期限）をその日に動かす
function applyRepeat(rule, newDay) {
  FS.repeat = rule;
  if (parseRepeat(rule)) {
    const cur = anchorDay();
    if (!cur) FS.doDate = newDay;
    else if (newDay !== cur) {
      const n = daysBetween(cur, newDay);
      if (FS.doDate) { FS.doDate = shiftKeepTime(FS.doDate, n); FS.doEnd = shiftKeepTime(FS.doEnd, n); }
      else FS.due = shiftKeepTime(FS.due, n);

}
function weekOrder() { const ws = weekStart(); return [0, 1, 2, 3, 4, 5, 6].map(i => (i + ws) % 7); }

  const presets = ['none', 'daily/1', 'weekly/1/1,2,3,4,5', 'weekly/1/1,2,3,4,5/nh', 'weekly/1', 'monthly/1/day', 'monthly/1/nth', isLast ? 'monthly/1/last' : null, 'yearly/1', 'yearly/1/nth'].filter(Boolean);
  const cur = FS.repeat;
  const custom = parseRepeat(cur) && !presets.some(v => sameRepeat(v, cur));
