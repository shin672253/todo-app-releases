<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDoアプリ</title>
<!-- ToDoアプリ 画面（版は下の VERSION）。Apps Script の HTML ファイル「index」に貼り付ける -->
<style>
:root {
  --bg: #ffffff; --panel: #ffffff; --side: #f7f7f8; --text: #1f1f1f; --sub: #8a8a8e; --line: #efeff1;
  --accent: #4772fa; --accent-text: #ffffff; --hover: #f5f5f6; --soft: #edf1fe; --picked: #ececee;
  --late: #e5484d; --soon: #d97a00; --ok: #4772fa; --today-bg: #edf1fe;
  --shadow: none;
  --shadow-lg: 0 10px 34px rgba(0, 0, 0, .16);
  color-scheme: light; /* 入力欄なども、表示に合わせた色にする */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --panel: #1c1c1e; --side: #232325; --text: #ececec; --sub: #8e8e93; --line: #2c2c2e;
    --accent: #6e8fff; --accent-text: #0f1424; --hover: #2a2a2c; --soft: #26304d; --picked: #343436;
    --late: #ff6b6b; --soon: #f2b45c; --ok: #6e8fff; --today-bg: #26304d;
    --shadow: none; --shadow-lg: 0 10px 34px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --panel: #1c1c1e; --side: #232325; --text: #ececec; --sub: #8e8e93; --line: #2c2c2e;
  --accent: #6e8fff; --accent-text: #0f1424; --hover: #2a2a2c; --soft: #26304d; --picked: #343436;
  --late: #ff6b6b; --soon: #f2b45c; --ok: #6e8fff; --today-bg: #26304d;
  --shadow: none; --shadow-lg: 0 10px 34px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
  font: 15px/1.55 "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 17px; font-weight: 700; letter-spacing: .02em; margin: 0; flex: 1; white-space: nowrap; }
.ver { font-size: 11px; color: var(--sub); font-weight: normal; margin-left: 6px; }
.tools { display: flex; gap: 2px; }
/* 線のアイコン：文字と同じ色・大きさで、細い線 */
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon .ic { width: 20px; height: 20px; }
.meta .ic { width: 13px; height: 13px; vertical-align: -2px; }
.meta > span { display: inline-flex; align-items: center; gap: 2px; }
.chk .ic { width: 12px; height: 12px; stroke-width: 2.4; }
.icon { min-width: 38px; height: 38px; border: none; border-radius: 10px; background: transparent;
  cursor: pointer; font-size: 18px; line-height: 1; padding: 0 8px; color: var(--sub); transition: background .15s, color .15s; }
.icon:hover { background: var(--hover); color: var(--text); }
.icon.on { background: var(--soft); color: var(--accent); }
.icon.txt { font-size: 14px; font-weight: 600; }
main { flex: 1; min-width: 0; max-width: 960px; margin: 0 auto; padding: 14px 24px 80px; }
/* 左のフォルダの木。広い画面ではいつも出し、狭い画面では☰で引き出す */
.layout { display: flex; align-items: flex-start; }
#side { flex: none; width: 250px; position: sticky; top: 51px; height: calc(100vh - 51px); overflow: auto; padding: 10px 8px 40px; background: var(--side); border-right: 1px solid var(--line); }
#side.hide { display: none; }
.side-in { }
.fold { display: flex; align-items: center; gap: 2px; border-radius: 6px; min-height: 36px; }
.fold:hover { background: var(--hover); }
.fold.cur { background: var(--picked); font-weight: 600; }
.tw { flex: none; width: 22px; border: none; background: none; color: var(--sub); cursor: pointer; padding: 0; font-size: 11px; }
.fold .nm { flex: 1; min-width: 0; border: none; background: none; text-align: left; cursor: pointer; padding: 6px 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: inherit; color: inherit; }
.fold .cnt { flex: none; margin-right: 8px; }
.side-add { margin: 6px 4px 2px; }
#scrim { display: none; }
/* 左の欄の上：今日・明日・7日間などの画面 */
.nav { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; border: none; background: none; border-radius: 6px;
  padding: 0 8px 0 6px; cursor: pointer; text-align: left; color: var(--text); }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--picked); font-weight: 600; }
.nav .ni { width: 22px; text-align: center; color: var(--accent); font-size: 15px; }
.nav .nl { flex: 1; }
.side-h { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--sub);
  margin: 10px 0 2px; padding: 8px 4px 0 8px; border-top: 1px solid var(--line); }
.side-h .icon { min-width: 28px; height: 28px; font-size: 16px; }
#tabs, #fab { display: none; }
@media (max-width: 599px) {
  #tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; height: 58px; background: var(--bg); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); }
  #tabs button { flex: 1; border: none; background: none; color: var(--sub); font-size: 10px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; cursor: pointer; padding: 0; }
  #tabs button b { font-size: 19px; font-weight: 400; line-height: 1; }
  #tabs button.on { color: var(--accent); }
  #fab { display: block; position: fixed; right: 16px; bottom: 74px; z-index: 16; width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-text); font-size: 28px; line-height: 1; cursor: pointer; box-shadow: var(--shadow-lg); }
  body.no-fab #fab { display: none; }
  #sideBtn { display: none; }
  /* スマホでは追加の帯を隠し、＋ボタンで開く */
  .qa.main-qa:not(.open):not(.typing) { display: none; }
}
@media (max-width: 899px) {
  #side, #side.hide { display: block; position: fixed; top: 0; left: 0; bottom: 0; z-index: 20; width: min(300px, 85vw); max-height: none;
    background: var(--side); padding: 12px; box-shadow: var(--shadow-lg); transform: translateX(-110%); transition: transform .2s; }
  #side.open { transform: none; }
  #scrim.open { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, .4); }
}
h2 { font-size: 22px; font-weight: 700; margin: 6px 0; letter-spacing: .01em; }
h3 { font-size: 13px; font-weight: 700; margin: 0; color: var(--sub); display: flex; align-items: center; gap: 6px; min-height: 32px; }
/* 見出しの ▾／▸ を押すと、その段を畳む */
.sh { border: none; background: none; color: inherit; font: inherit; cursor: pointer; padding: 0 2px; display: inline-flex; align-items: center; gap: 6px; }
.sh .arw { width: 12px; font-size: 10px; }
.sec.left h3 .sh { color: var(--late); }
.cnt { font-size: 12px; color: var(--sub); font-weight: 400; }
.sec { margin: 6px 0 14px; }
.sec.form { border-top: 1px solid var(--line); padding-top: 8px; }
.empty, .note { color: var(--sub); font-size: 13px; margin: 4px 0; }
.qa { display: flex; gap: 6px; margin: 10px 0; }
.qa-in { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; background: var(--hover); }
.qa-in::placeholder { color: var(--sub); }
.qa-in:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.qa-sel { max-width: 38%; height: 40px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.qa .icon { background: var(--accent); color: var(--accent-text); height: 40px; min-width: 40px; border-radius: 8px; }
.qa .icon.tpl { background: var(--hover); color: var(--sub); }
/* 上の追加の欄は「＋ タスクを追加」の帯だけ。打っている間だけ、フォルダとテンプレートと＋を出す */
.qa.main-qa:not(.open):not(.typing) > :not(.qa-in) { display: none; }
.task { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px; border-bottom: 1px solid var(--line); border-radius: 6px;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.task:hover { background: var(--hover); }
/* 一覧のドラッグ：線＝その上下に入れる、枠＝その子タスクにする */
.task.dragging { opacity: .35; }
.task.drop-before { box-shadow: inset 0 3px 0 -1px var(--accent); }
.task.drop-after { box-shadow: inset 0 -3px 0 -1px var(--accent); }
.task.drop-in { background: var(--soft); box-shadow: inset 0 0 0 2px var(--accent); }
.sec.drop, .fold.drop, .tray.drop { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
.task.wont .chk { background: var(--sub); border-color: var(--sub); }
.task.picked { background: var(--picked); }
.chk.sbox { border-radius: 4px; }
.task.picked .sbox { background: var(--accent); border-color: var(--accent); }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 4px; vertical-align: 1px; }
.chk { flex: none; width: 16px; height: 16px; border: 1.5px solid color-mix(in srgb, var(--sub) 80%, transparent); border-radius: 4px;
  background: transparent; cursor: pointer; font-size: 10px; font-weight: 700; line-height: 1; padding: 0; color: var(--accent-text); transition: all .15s; }
.chk:hover { border-color: var(--accent); background: var(--soft); }
.task.done:not(.wont) .chk { background: var(--accent); border-color: var(--accent); }
.task.done .ttl { text-decoration: line-through; color: var(--sub); }
/* 1行：名前は左、補足の記号と日時は右端 */
.body { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 40px; }
.ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { flex: none; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); max-width: 62%; overflow: hidden; }
.meta > span { white-space: nowrap; }
.meta .when { color: var(--accent); }
.meta .when.late, .meta .when.over { color: var(--late); }
.meta .when.soon { color: var(--soon); }
.emo { display: inline-block; flex: none; width: 1.3em; text-align: center; margin-right: 3px; font-size: 14px; line-height: 1; }
.meta .fname { overflow: hidden; text-overflow: ellipsis; max-width: 9em; }
.chip { background: var(--hover); border-radius: 6px; padding: 0 6px; }
.late, .over { color: var(--late); font-weight: 600; }
.soon { color: var(--soon); font-weight: 600; }
.flink { border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; font-weight: 600; text-align: left; }
.acts { display: flex; gap: 4px; flex: none; align-items: center; }
.mini { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 2px 10px; cursor: pointer; font-size: 13px; }
.mini:hover { background: var(--hover); }
/* やり残しの行の ☀ ＋1 📅（スマホでも出す） */
.rb { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 12px; min-width: 26px; height: 26px; border-radius: 6px; padding: 0 4px; }
.rb:hover { background: var(--hover); }
.rb .ic { width: 16px; height: 16px; }
.rb-wrap { position: relative; display: inline-flex; }
.rb-date { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
/* 期限まであと何日・実行日が期限より後 */
.meta .left-days { font-size: 11px; }
.meta .warn { color: var(--late); font-weight: 700; }
/* 完了にした行：四角を青く塗り、0.2秒で薄くして消す */
.task.finishing .chk { background: var(--accent); border-color: var(--accent); }
.task.finishing { animation: finish .2s ease-in forwards; pointer-events: none; }
@keyframes finish { to { opacity: 0; transform: translateX(8px); } }
/* 祝日の名前（カレンダー） */
.hol { font-size: 10px; color: var(--late); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cell .hol { display: inline-block; margin-left: 2px; vertical-align: middle; max-width: calc(100% - 28px); }
.tl-head .hd .hol { font-size: 9px; }
.kid-btn { border: none; background: none; color: var(--sub); opacity: .55; font-size: 16px; padding: 0 6px; cursor: pointer; }
.task:hover .kid-btn, .kid-btn:focus { opacity: 1; color: var(--accent); }
.kid-add { margin: 2px 0 6px; }
.kid-add .qa-in { height: 34px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 13px; color: var(--sub); }
.crumb button { border: none; background: none; color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.crumb button:hover { background: var(--hover); }
.crumb .cur { font-weight: 600; padding: 2px 4px; color: var(--text); }
.lhead { display: flex; align-items: center; gap: 4px; }
/* かかる時間の合計（今日・明日の見出しの下）。使える時間を超えたら橙色と文字で知らせる */
.load { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 2px 0 8px; padding: 6px 10px; border-radius: 9px;
  background: var(--hover); color: var(--sub); font-size: 13px; }
.load b { color: var(--text); font-weight: 600; }
.load.over { background: color-mix(in srgb, var(--soon) 14%, transparent); }
.load.over .ov { color: var(--soon); font-weight: 700; }
/* 左右にすべらせる（スマホ）：行の下に、離すとどうなるかを出す */
.sw-wrap { position: relative; overflow: hidden; border-radius: 6px; }
.sw-bg { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 16px; gap: 6px; font-size: 13px; font-weight: 600;
  color: var(--accent-text); background: var(--sub); pointer-events: none; }
.sw-bg.r { background: var(--accent); justify-content: flex-start; }
.sw-bg.l { background: var(--soon); justify-content: flex-end; }
.sw-bg:not(.armed) { opacity: .55; }
.sw-bg[hidden] { display: none; }
.sw-wrap > .task { position: relative; background: var(--bg); }
/* 朝の段取り */
#planDlg { width: min(640px, calc(100vw - 16px)); }
.pl-steps { display: flex; gap: 6px; margin: 0 0 10px; font-size: 12px; color: var(--sub); }
.pl-steps span { padding: 2px 10px; border-radius: 10px; background: var(--hover); }
.pl-steps span.on { background: var(--accent); color: var(--accent-text); }
.pl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.pl-row .pl-t { flex: 1 1 200px; min-width: 0; }
.pl-row .pl-t small { display: block; color: var(--sub); font-size: 12px; }
.pl-opts { display: flex; flex-wrap: wrap; gap: 4px; }
.pl-opts button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 9px; min-height: 34px; min-width: 40px;
  padding: 2px 8px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 3px; }
.pl-opts button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.pl-opts input[type=date] { min-height: 34px; width: 10.5em; font-size: 13px; }
.pl-note { color: var(--sub); font-size: 13px; margin: 4px 0 8px; }
.pl-err { color: var(--late); font-size: 13px; }
.pl-list { max-height: min(60vh, 520px); overflow: auto; }
.lhead h2 { flex: 1; }
.h2s { font-size: 15px; font-weight: 400; color: var(--sub); }
h2 .emo { font-size: 20px; width: auto; margin-right: 6px; }
.calhead { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.calhead h2 { flex: 1; text-align: center; min-width: 120px; }
.modes { display: flex; gap: 2px; background: var(--hover); border-radius: 12px; padding: 2px; }
.modes .icon { height: 32px; min-width: 40px; }
.modes .icon.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--sub); padding: 6px 0 4px; }
.wd.sun, .cell.sun .dn { color: var(--late); }
.wd.sat, .cell.sat .dn { color: var(--accent); }
/* 月の表示：週ごとの段。下に日のマス、上にタスク・予定（期間は横長の帯）を段に詰めて並べる */
.mcal { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mhead { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.mweek { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 26px; grid-auto-rows: 20px;
  min-height: 100px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.mweek:last-child { border-bottom: none; }
.mbg { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cell { padding: 3px 3px 4px; border-right: 1px solid var(--line); cursor: pointer; transition: background .1s; min-width: 0; }
.mbg .cell:nth-child(7n) { border-right: none; }
.cell:hover { background: var(--hover); }
.cell.other { background: var(--side); }
.cell.other .dn { opacity: .45; }
.cell.sel { background: var(--soft); }
.cell.drop { background: var(--soft); box-shadow: inset 0 0 0 2px var(--accent); }
.dn { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 4px; }
.cell.today .dn { background: var(--accent); color: var(--accent-text); }
.it { font-size: 11px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 5px; padding: 0 4px;
  background: var(--soft); color: var(--text); min-width: 0; }
.it.lane { position: relative; z-index: 1; margin: 1px 2px 0; }
/* カレンダーのタスク・予定は、淡い色で塗った帯。タスクは左に小さな四角、時刻は右 */
.it.task-it { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--bg)); }
.it.task-it::before { content: ''; display: inline-block; width: 7px; height: 7px; border: 1.5px solid var(--c, var(--accent)); border-radius: 2px;
  margin-right: 4px; vertical-align: -1px; }
.it.task-it:hover { box-shadow: inset 0 0 0 1px var(--c, var(--accent)); }
.it.ev { background: color-mix(in srgb, var(--evc, var(--accent)) 14%, var(--bg)); }
.it.due { background: color-mix(in srgb, var(--late) 13%, var(--bg)); color: var(--late); }
.it.due::before { display: none; }
.it.cont-l { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
.it.cont-r { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.it .tm { color: var(--sub); float: right; margin-left: 4px; }
.more { position: relative; z-index: 1; font-size: 11px; line-height: 18px; color: var(--sub); padding-left: 6px; cursor: pointer; }
.more:hover { color: var(--accent); }
/* 週・日の表示：上に終日の段、下に時間の帯（0〜24時） */
.tl { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tl-head, .tl-all, .tl-allbg, .tl-grid { display: grid; }
.tl-head { border-bottom: 1px solid var(--line); }
.tl-head .hd { border: none; background: none; cursor: pointer; padding: 5px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--sub); font-size: 11px; }
.tl-head .hd b { font-size: 15px; color: var(--text); min-width: 28px; height: 28px; line-height: 28px; border-radius: 14px; }
.tl-head .hd.today b { background: var(--accent); color: var(--accent-text); }
.tl-head .hd.sel { background: var(--soft); }
.tl-head .hd:hover { background: var(--hover); }
.tl-all { position: relative; grid-auto-rows: 20px; min-height: 26px; padding: 2px 0 4px; border-bottom: 1px solid var(--line); }
.tl-allbg { position: absolute; inset: 0; }
.tl-allbg .cell { border-right: none; border-left: 1px solid var(--line); padding: 0; }
.gut-l { font-size: 10px; color: var(--sub); text-align: right; padding: 5px 6px 0 0; }
.tl-scroll { max-height: min(64vh, 680px); overflow-y: auto; overscroll-behavior: contain; }
.tl-grid { position: relative; }
.tl-gut { position: relative; }
.tl-gut span { position: absolute; right: 6px; font-size: 10px; color: var(--sub); transform: translateY(-50%); }
.tcol { position: relative; border-left: 1px solid var(--line); cursor: cell; min-width: 0;
  background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hh)); }
.tcol.today { background-color: color-mix(in srgb, var(--accent) 4%, transparent); }

  background: color-mix(in srgb, var(--c, var(--accent)) 20%, var(--bg)); box-shadow: 0 0 0 1px var(--bg);

.form label { display: block; margin: 8px 0 2px; font-size: 13px; color: var(--sub); }

dialog { border: none; border-radius: 18px; background: var(--panel); color: var(--text); width: min(580px, calc(100vw - 24px));
  max-height: calc(100vh - 24px); overflow: auto; padding: 16px 18px; box-shadow: var(--shadow-lg); }

.ci .x { border: none; background: none; color: var(--sub); cursor: pointer; opacity: .5; padding: 2px 6px; }
.ci .x:hover { opacity: 1; color: var(--late); }
.form .ci-add { border: none; border-radius: 6px; background: transparent; padding: 4px 4px; }

.att { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 2px 0; }

.rp-row { display: flex; align-items: center; gap: 6px; margin: 8px 0; flex-wrap: wrap; font-size: 14px; }

#status { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--text); color: var(--bg); z-index: 200;
  padding: 7px 16px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg); }

#status.err { background: var(--late); color: #fff; opacity: 1; pointer-events: auto; cursor: pointer; }

<body>
<header class="bar">
  <button class="icon" id="sideBtn" title="フォルダの一覧を出す・隠す" aria-label="フォルダの一覧を出す・隠す"><i data-ic="menu"></i></button>
  <h1>ToDoアプリ<span class="ver" id="verTag"></span></h1>
  <nav class="tools">
    <button class="icon" id="reloadBtn" title="最新の内容を読み直す" aria-label="最新の内容を読み直す"><i data-ic="refresh"></i></button>
    <button class="icon" id="themeBtn" title="暗い表示にする" aria-label="暗い表示にする"><i data-ic="moon"></i></button>
    <button class="icon" data-view="settings" title="設定を開く" aria-label="設定を開く"><i data-ic="settings"></i></button>
  </nav>
</header>
<div class="layout">
  <aside id="side" aria-label="フォルダ"></aside>

</div>
<div id="scrim"></div>

<nav id="tabs" aria-label="画面の切り替え">

  <button data-view="next7" title="次の7日間を開く" aria-label="次の7日間を開く"><b><i data-ic="week"></i></b>7日間</button>
  <button data-view="cal" title="カレンダーを開く" aria-label="カレンダーを開く"><b><i data-ic="calendar"></i></b>カレンダー</button>
  <button id="tabFold" title="フォルダの一覧を出す" aria-label="フォルダの一覧を出す"><b><i data-ic="folder"></i></b>フォルダ</button>
  <button data-view="search" title="タスクを探す" aria-label="タスクを探す"><b><i data-ic="search"></i></b>探す</button>
</nav>
<button id="fab" title="タスクを追加する" aria-label="タスクを追加する"><i data-ic="plus"></i></button>
<div id="status" role="status"></div>
<div id="selbar" class="selbar" hidden></div>
<div id="menu" class="pop" hidden></div>

<dialog id="taskDlg">
  <form id="taskForm" class="form" novalidate>
    <!-- 上に日時の行（実行日・期限・繰り返し・通知）、その下に大きな名前とメモ。フォルダと親タスクはいちばん下 -->
    <div class="dtop">
      <span class="dk" title="実行日"><i data-ic="calendar"></i></span><button type="button" class="dfield" data-key="doDate" title="実行日を選ぶ"></button>
      <span id="endWrap" hidden>〜 <button type="button" class="dfield" data-key="doEnd" title="期間の終わりを選ぶ"></button></span>

    <p class="dlg-err" id="lateWarn" hidden>⚠ 実行日が期限より後になっています</p>

    <div id="chkList"></div>
    <div class="ci"><span class="cbox" style="visibility:hidden"></span><input type="text" class="ci-add" id="chkIn" placeholder="＋ 項目を追加（Enter）" aria-label="チェックリストに足す項目" autocomplete="off"></div>
    <div class="sub-head"><i data-ic="subtask"></i> 子タスク <span class="cnt" id="subCnt"></span></div>
    <div id="subList" class="sub-box"></div>
    <div class="qa"><input type="text" class="qa-in" id="subIn" placeholder="子タスク名を入れて Enter" aria-label="追加する子タスク名" autocomplete="off">
      <button type="button" class="icon" id="subAdd" title="この子タスクを追加する" aria-label="この子タスクを追加する">＋</button></div>
    <div class="sub-head"><i data-ic="clip"></i> 添付ファイル <span class="note">（Googleドライブに保存・1つ10MBまで）</span></div>

  const monday = (m, n) => 1 + (8 - new Date(y, m - 1, 1).getDay()) % 7 + (n - 1) * 7;
  const k = y - 1980;
  add(1, 1, '元日');
  add(1, monday(1, 2), '成人の日');
  add(2, 11, '建国記念の日');
  add(2, 23, '天皇誕生日');
  add(3, Math.floor(20.8431 + 0.242194 * k) - Math.floor(k / 4), '春分の日');
  add(4, 29, '昭和の日');
  add(5, 3, '憲法記念日');
  add(5, 4, 'みどりの日');
  add(5, 5, 'こどもの日');
  // 2020・2021年はオリンピックで海の日・スポーツの日・山の日が動いた
  const moved = { 2020: [23, 24, 10], 2021: [22, 23, 8] }[y];
  add(7, moved ? moved[0] : monday(7, 3), '海の日');
  add(moved ? 7 : 10, moved ? moved[1] : monday(10, 2), 'スポーツの日');
  add(8, moved ? moved[2] : 11, '山の日');
  add(9, monday(9, 3), '敬老の日');
  add(9, Math.floor(23.2488 + 0.242194 * k) - Math.floor(k / 4), '秋分の日');
  add(11, 3, '文化の日');
  add(11, 23, '勤労感謝の日');
  const base = Object.keys(out).sort();
  // 国民の休日：前の日と次の日がどちらも祝日にはさまれた平日
  base.forEach(s => {
    const mid = addDays(s, 1);
    if (!out[mid] && out[addDays(s, 2)] && toDate(mid).getDay() !== 0) out[mid] = '国民の休日';
  });
  // 振替休日：祝日が日曜日なら、そのあと最初の祝日でない日
  base.forEach(s => {
    if (toDate(s).getDay() !== 0) return;
    let d = addDays(s, 1);
    while (out[d]) d = addDays(d, 1);
    out[d] = '振替休日';
  });
  return (HOLIDAYS[y] = out);
}
// その日の祝日の名前（祝日でなければ空）
function holidayName(d) {
  if (!d) return '';
  const k = day(d);
  if (S.holYears.has(k.slice(0, 4))) return S.holidays[k] || '';
  return holidaysOf(Number(k.slice(0, 4)))[k] || '';
}
// 土日・祝日か（使える時間を「休日用」にする日）
function isOffDay(d) { const w = toDate(d).getDay(); return w === 0 || w === 6 || !!holidayName(d); }

// ---- かかる時間（v0.13.0） ----
// estimate は分の整数。空は「決めていない」で、0分とは別
function hasEst(t) { return t.estimate !== '' && t.estimate != null; }
function fmtMin(m) {
  m = Math.round(Number(m) || 0);
  const hh = Math.floor(m / 60);
  const mm = m % 60;
  return hh ? hh + '時間' + (mm ? mm + '分' : '') : mm + '分';
}
// 打ち込んだかかる時間を読む（45・1:30・1.5h・1時間30分。全角も可）。空は ''、読めなければ null
function parseEst(s) {
  s = String(s).trim().normalize('NFKC').replace(/\s+/g, '');
  if (!s) return '';
  let m = null;
  let x;
  if ((x = /^(\d+)(分)?$/.exec(s))) m = Number(x[1]);
  else if ((x = /^(\d+):(\d{1,2})$/.exec(s))) m = Number(x[1]) * 60 + Number(x[2]);
  else if ((x = /^(\d+(?:\.\d+)?)(h|時間)$/i.exec(s))) m = Math.round(Number(x[1]) * 60);
  else if ((x = /^(\d+)時間(\d+)分$/.exec(s))) m = Number(x[1]) * 60 + Number(x[2]);
  return m != null && m >= 0 && m <= 1440 ? m : null;
}
// その日に使える時間（分）。設定が空なら null
function freeOf(d) {
  const v = S.settings[isOffDay(d) ? 'freeHoliday' : 'freeWeekday'];
  return v === '' || v == null || !isFinite(Number(v)) ? null : Number(v);
}
// その日の見積もりの合計。何日にもまたがるタスクは、始まりの日にだけ数える（毎日に全部は足さない）。
// 子タスクも自分のかかる時間で数える（親は親自身の作業分）。「やらない」で終えたものは数えない
function dayLoad(d) {
  let sum = 0;
  let unset = 0;
  S.tasks.forEach(t => {
    if (t.wontDo || !t.doDate || doFirst(t) !== d) return;
    if (hasEst(t)) sum += Number(t.estimate);
    else if (!t.done) unset++;
  });
  const cont = S.tasks.filter(t => !t.done && t.doDate && doFirst(t) < d && doLast(t) >= d).length;
  return { sum, unset, cont };
}
// 「見積 3時間15分／使える時間 6時間／残り 2時間45分・未設定2件」
function loadBar(d) {
  const L = dayLoad(d);
  const free = freeOf(d);
  if (!L.sum && !L.unset && free == null) return null;
  const over = free != null && L.sum > free;
  return h('div', { class: 'load' + (over ? ' over' : ''), role: 'status' },
    ic('clock'),
    h('span', null, '見積 ', h('b', null, fmtMin(L.sum))),
    free != null ? h('span', null, '使える時間 ', h('b', null, fmtMin(free))) : null,
    free != null ? (over ? h('span', { class: 'ov' }, fmtMin(L.sum - free) + '超過') : h('span', null, '残り ', h('b', null, fmtMin(free - L.sum)))) : null,
    L.unset ? h('span', null, '未設定 ' + L.unset + '件') : null,
    L.cont ? h('span', { title: '前の日から続く期間のタスク（始まりの日に数えています）' }, '続きの期間 ' + L.cont + '件') : null);
}
// その日だけの並び順（dayOrder が「その日:数」のとき）。ないものは後ろに、いつもの順で
function dayOrderOf(t, d) {
  const s = String(t.dayOrder || '');
  return s.slice(0, 11) === d + ':' ? Number(s.slice(11)) : Infinity;
}
function sortByDay(a, d) {
  return sortTasks(a).sort((x, y) => { const p = dayOrderOf(x, d); const q = dayOrderOf(y, d); return p === q ? 0 : p < q ? -1 : 1; });
}
// 日付の見出し（祝日なら名前を添える）
function dayTitle(d) { const n = holidayName(d); return longDate(d) + (n ? ' ' + n : ''); }

// ---- 期限まで・期限より後 ----
// 期限まであと何日か（実行日のある行で、期限が今日以降のときだけ）。今日なら「今日まで」
function dueLeft(t) {
  if (t.done || !t.due || !t.doDate || dueClass(t) === 'over') return '';
  const n = daysBetween(today(), day(t.due));
  return n === 0 ? '今日まで' : 'あと' + n + '日';
}
// 実行日（期間なら終わり）が期限より後か。同じ日はどちらも時刻があるときだけ時刻で比べる
function doAfterDue(t) {
  if (!t.doDate || !t.due) return false;
  const end = t.doEnd || t.doDate;
  if (day(end) !== day(t.due)) return day(end) > day(t.due);
  return !!(timeOf(end) && timeOf(t.due)) && end > t.due;
}

// ---- フォルダ（入れ子） ----
function listOf(id) { return S.lists.find(l => l.id === id); }
function parentOf(l) { return listOf(l.parentId) ? l.parentId : ''; }
function childrenOf(pid) { return S.lists.filter(l => parentOf(l) === pid); }
function pathOf(id) {
  const names = [];
  for (let l = listOf(id), i = 0; l && i < 50; l = listOf(parentOf(l)), i++) names.unshift(l.name);
  return names.join(' / ');
}
function tree(pid, depth, out) {
  out = out || [];
  childrenOf(pid || '').forEach(l => { out.push({ l, depth: depth || 0 }); tree(l.id, (depth || 0) + 1, out); });
  return out;
}
function descendants(id) { return tree(id).map(x => x.l.id); }
function folderOptions(selected, skip) {
  return tree('').filter(x => !(skip && skip.includes(x.l.id)))
    .map(x => h('option', { value: x.l.id, selected: x.l.id === selected }, '　'.repeat(x.depth) + x.l.name));
}
// フォルダの色（なければ上のフォルダの色）
function colorOf(listId) {
  for (let l = listOf(listId), i = 0; l && i < 50; l = listOf(parentOf(l)), i++) if (COLORS[l.color]) return COLORS[l.color][1];
  return '';
}
function colorDot(listId) { const c = colorOf(listId); return c ? h('span', { class: 'dot', style: '--c:' + c }) : null; }
// フォルダの目印：絵文字があれば絵文字、なければ色の点
function folderMark(listId) { const l = listOf(listId); return l && l.icon ? h('span', { class: 'emo' }, l.icon) : colorDot(listId); }

// ---- 子タスク ----
function taskOf(id) { return id ? S.tasks.find(t => t.id === id) : null; }
function kidsOf(id) { return S.tasks.filter(t => t.parentTaskId === id); }
function taskDescendants(id) {
  const out = [];
  const seen = new Set([id]);
  for (const q = [id]; q.length;) {
    const pid = q.shift();
    S.tasks.forEach(t => { if (t.parentTaskId === pid && !seen.has(t.id)) { seen.add(t.id); out.push(t); q.push(t.id); } });
  }
  return out;
}
// id が top の子・孫か
function isUnder(id, top) {
  for (let p = taskOf(id), i = 0; p && i < 100; p = taskOf(p.parentTaskId), i++) if (p.parentTaskId === top) return true;
  return false;
}
// items を親子の順に並べる（親が items に無ければいちばん上に出す）。fold にある親の子は出さない
function flatTree(items, fold, manual) {
  const ids = new Set(items.map(t => t.id));
  const kids = {};
  items.forEach(t => { const p = ids.has(t.parentTaskId) ? t.parentTaskId : ''; (kids[p] = kids[p] || []).push(t); });
  const out = [];
  const seen = new Set();
  const walk = (pid, depth) => sortTasks(kids[pid] || [], manual).forEach(t => {
    if (seen.has(t.id)) return;
    seen.add(t.id);
    const has = !!kids[t.id];
    out.push({ t, depth, has });
    if (has && !(fold && fold.has(t.id))) walk(t.id, depth + 1);
  });
  walk('', 0);
  // 親子が輪になった壊れたデータでも、消えずに出るようにする
  items.forEach(t => { if (!seen.has(t.id) && !(fold && hiddenByFold(t, ids, fold))) { seen.add(t.id); out.push({ t, depth: 0, has: false }); } });
  return out;
}
function hiddenByFold(t, ids, fold) {
  for (let p = t.parentTaskId, i = 0; p && ids.has(p) && i < 50; p = (taskOf(p) || {}).parentTaskId, i++) if (fold.has(p)) return true;
  return false;
}

async function addTask(t) {

  S.tasks.push(tmp);
  render();
  try {
    const [saved, back] = await callU('saveTask', Object.assign({}, tmp, { id: '' }));
    applySaved(saved, tmp.id);
    report('追加しました', back);
  } catch (e) {
    S.tasks = S.tasks.filter(x => x !== tmp);
    fail(e);
  }
  render();
}
// 完了・未完了を切り替える。wont なら「やらない」で終える
async function toggleDone(t, wont) {
  if (t.id.startsWith('tmp') || FINISHING.has(t.id)) return;
  if (!t.done && !wont) await finishMotion(t.id);
  const before = { done: t.done, wontDo: t.wontDo };
  t.done = !t.done;
  t.wontDo = t.done && !!wont;
  render();
  try {
    const [r, back] = await callU('setDone', t.id, t.done, t.wontDo);
    // 返ってくるのは、自分・一緒に変わった子や親・繰り返しの次の回（作った／消した）
    const created = r.some(x => !x.removed && !taskOf(x.id));
    const removed = r.some(x => x.removed);
    r.forEach(x => { if (x.removed) S.tasks = S.tasks.filter(y => y.id !== x.id); else replaceTask(x); });
    report(t.done ? (t.wontDo ? 'やらないにしました' : '完了にしました') + (created ? '。次の回を作りました' : '')
      : (removed ? '未完了に戻し、次の回を取り消しました' : '未完了に戻しました'), back);
  } catch (e) { Object.assign(t, before); fail(e); }
  render();
}
// 完了にするとき、一覧の行の四角を青く塗って ✓ を出し、0.2秒ほどで薄くして消す（動きを減らす設定なら動かさない）。
// 消えたあとは下の知らせの「元に戻す」で戻せる
const FINISHING = new Set();
function finishMotion(id) {
  const rows = [...document.querySelectorAll('#main .task[data-id]')].filter(r => r.dataset.id === id);
  if (!rows.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return Promise.resolve();
  FINISHING.add(id);
  rows.forEach(r => { r.classList.add('finishing'); const c = r.querySelector('.chk'); if (c) c.replaceChildren(ic('check')); });
  return new Promise(res => setTimeout(() => { FINISHING.delete(id); res(); }, 220));
}
// 保存した結果を反映する。フォルダを移したときは、子・孫も一緒に移っている
// 子を足したり戻したりして、完了していた親が未完了に戻ったときは also に入っている
function applySaved(saved, oldId) {
  (saved.also || []).forEach(x => { if (x.removed) S.tasks = S.tasks.filter(y => y.id !== x.id); else replaceTask(x); });
  delete saved.also;
  replaceTask(saved, oldId);
  taskDescendants(saved.id).forEach(c => { c.listId = saved.listId; });
}
// 画面は先に変え、保存に失敗したら元に戻す
async function patchTask(t, patch) {
  if (t.id.startsWith('tmp')) return;
  const old = {};
  Object.keys(patch).forEach(k => { old[k] = t[k]; });
  Object.assign(t, patch);
  render();
  try {
    const [saved, back] = await callU('saveTask', Object.assign({}, t));
    applySaved(saved);
    report('変えました', back);
  } catch (e) { Object.assign(t, old); fail(e); }
  render();
}
// 実行日を newDay から始まるように動かす（期間の長さと時刻はそのまま）。実行日がなければその日にする
function moveDo(t, newDay) {
  if (!t.doDate) { patchTask(t, { doDate: newDay }); return; }
  const n = daysBetween(doFirst(t), newDay);
  if (n) patchTask(t, { doDate: shiftKeepTime(t.doDate, n), doEnd: shiftKeepTime(t.doEnd, n) });
}

function dueClass(t) {
  if (t.done || !t.due) return '';
  const td = today();
  const now = new Date();
  // 時刻付きの期限は、その時刻を過ぎたら期限切れ
  if (t.due < (timeOf(t.due) ? td + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes()) : td)) return 'over';
  if (day(t.due) <= addDays(td, 3)) return 'soon';
  return '';
}

// 一覧の中で、そのタスクのすぐ下に子タスクを打ち込む欄
function kidAdd(p, depth) {
  const inp = h('input', { type: 'text', class: 'qa-in kid-in', placeholder: '「' + p.title + '」の子タスク名を入れて Enter（Escでやめる）',
    'aria-label': '追加する子タスク名', autocomplete: 'off' });
  const stop = () => { if (S.addKidOf === p.id) { S.addKidOf = null; render(); } };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); stop(); return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    const title = inp.value.trim();
    if (!title) { stop(); return; }
    inp.value = '';
    addTask({ title, parentTaskId: p.id, listId: p.listId });
  });
  onPasteLines(inp, () => ({ parentTaskId: p.id, listId: p.listId }));
  // 何も打たずに他を押したらやめる
  inp.addEventListener('blur', () => setTimeout(() => { if (inp.isConnected && !inp.value.trim() && document.activeElement !== inp) stop(); }, 150));
  return h('div', { class: 'qa kid-add', style: 'padding-left:' + (depth * 24 + 30) + 'px' }, inp);
}
// opt.day があれば、その日へタスクをドラッグして実行日を変えられる。opt.extra は見出しの右に足す
function section(m, title, items, empty, opt, cls) {
  opt = opt || {};
  if (!items.length && !empty) return;
  m.append(secBox(title, items.length, cls, { 'data-day': opt.day || null }, opt.extra,
    items.length ? rowsOf(items, opt) : h('p', { class: 'empty' }, empty)));
}
// 見出し付きの段。見出しの ▾／▸ を押すと畳む（画面と見出しの名前ごとに、この端末に覚えておく）
function secBox(title, n, cls, attrs, extra, ...body) {
  const name = typeof title === 'string' ? title : title.textContent;
  const key = S.view + ':' + (S.view === 'lists' ? S.folderId + ':' : '') + name;
  const shut = S.foldS.has(key);
  const tip = shut ? '開く' : '畳む';
  // 見出しがフォルダへの移動（ボタン）のときは、▾／▸ だけを畳むボタンにする
  const head = typeof title === 'string'
    ? h('button', { type: 'button', class: 'sh', title: tip, 'aria-label': name + 'を' + tip, 'aria-expanded': String(!shut),
      onclick: () => { toggleIn(S.foldS, 'todo-fold-secs', key); render(); } }, h('span', { class: 'arw' }, shut ? '▸' : '▾'), title)
    : [h('button', { type: 'button', class: 'sh', title: tip, 'aria-label': name + 'を' + tip, 'aria-expanded': String(!shut),
      onclick: () => { toggleIn(S.foldS, 'todo-fold-secs', key); render(); } }, h('span', { class: 'arw' }, shut ? '▸' : '▾')), title];
  return h('section', Object.assign({ class: 'sec ' + (cls || '') + (shut ? ' shut' : '') }, attrs || {}),
    // 畳んだ段の中身は作らない（見えないタスクを全選択やキー移動で選ばないように）
    h('h3', null, head, h('span', { class: 'cnt' }, n), extra || null), ...(shut ? [] : body));
}
// opt.tree なら親子の形で（子は親の下に字下げして）出す
function rowsOf(items, opt) {
  opt = opt || {};
  if (!opt.tree) return (opt.byDay ? sortByDay(items, opt.byDay) : sortTasks(items, opt.manual)).map(t => taskRow(t, opt));
  const flat = flatTree(items, S.foldT, opt.manual);
  const out = flat.map(x => taskRow(x.t, Object.assign({ addKid: !opt.inDlg }, opt,
    { depth: x.depth, has: x.has, showParent: opt.showParent !== false && x.depth === 0 })));
  // 子タスクを打ち込む欄は、その親の子・孫のいちばん下に出す
  const pi = opt.inDlg ? -1 : flat.findIndex(x => x.t.id === S.addKidOf);
  if (pi >= 0) {
    let end = pi + 1;
    while (end < flat.length && flat[end].depth > flat[pi].depth) end++;
    out.splice(end, 0, kidAdd(flat[pi].t, flat[pi].depth + 1));
  }
  return out;
}
function quickAdd(defaults, withListSelect) {
  const inp = h('input', { type: 'text', class: 'qa-in', placeholder: '＋ タスクを追加', 'aria-label': '追加するタスク名（Enterで追加）' });

    onchange: e => { S.addList = e.target.value; } }, folderOptions(S.addList)) : null;
  const go = () => {
    const title = inp.value.trim();
    if (!title) return;
    inp.value = '';
    const t = Object.assign({ title }, defaults());
    if (sel) t.listId = sel.value;
    addTask(t);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } });
  const base = () => Object.assign({ listId: S.addList }, defaults(), sel ? { listId: sel.value } : {});
  S.addBase = base;
  onPasteLines(inp, base);
  // 打ちかけの間は、フォルダの選択と＋を出したままにする
  const box = h('div', { class: 'qa main-qa' }, inp, sel,
    h('button', { class: 'icon tpl', title: 'テンプレートから作る', 'aria-label': 'テンプレートから作る', onclick: e => tplMenu(e.currentTarget, base) }, ic('template')),
    h('button', { class: 'icon', title: 'このタスクを追加する', 'aria-label': 'このタスクを追加する', onclick: go }, ic('plus')));
  inp.addEventListener('input', () => box.classList.toggle('typing', !!inp.value));
  // 欄に入ったら開き、何も打たずに外へ出たら閉じる（＋や⧉を押す間は待つ）
  box.addEventListener('focusin', () => box.classList.add('open'));
  box.addEventListener('focusout', () => setTimeout(() => {
    if (box.isConnected && !inp.value && !box.contains(document.activeElement) && !menu.contains(document.activeElement) && menu.hidden) box.classList.remove('open');
  }, 250));
  return box;
}

  if (!cur) S.folderId = '';
  // パンくず（今いる場所）
  const crumb = h('div', { class: 'crumb' }, h('button', { onclick: () => goFolder('') }, 'すべて'));
  const chain = [];
  for (let l = cur, i = 0; l && i < 50; l = listOf(parentOf(l)), i++) chain.unshift(l);
  chain.forEach((l, i) => {
    crumb.append('›', i === chain.length - 1 ? h('span', { class: 'cur' }, l.name)
      : h('button', { onclick: () => goFolder(l.id) }, l.name));
  });
  const doneTip = S.showDone ? '完了したタスクを隠す' : '完了したタスクも表示する';
  const newTip = cur ? 'この中にフォルダを作る' : 'フォルダを作る';
  m.append(crumb, h('div', { class: 'lhead' }, h('h2', null, cur ? folderMark(cur.id) : null, cur ? cur.name : 'すべてのフォルダ'),
    cur ? h('button', { class: 'icon', title: 'このフォルダの名前や場所・色を変える', 'aria-label': 'このフォルダの名前や場所・色を変える', onclick: () => openList(cur, '') }, ic('edit')) : null,
    h('button', { class: 'icon', title: newTip, 'aria-label': newTip, onclick: () => openList(null, S.folderId) }, '⊞'),
    h('button', { class: 'icon' + (S.showDone ? ' on' : ''), title: doneTip, 'aria-label': doneTip, onclick: () => { S.showDone = !S.showDone; render(); } }, '✓'),
    selBtn()));
  m.append(quickAdd(() => (cur ? { listId: cur.id } : {}), !cur));
  const shown = cur ? [cur].concat(tree(cur.id).map(x => x.l)) : tree('').map(x => x.l);
  const base = cur ? pathOf(cur.id) + ' / ' : '';
  const rowOpt = { showList: false, tree: true, manual: true, drag: true };
  let any = false;
  shown.forEach(f => {
    const open = S.tasks.filter(t => !t.done && t.listId === f.id);
    if (f === cur) { section(m, 'このフォルダ', open, '未完了のタスクはありません。', rowOpt); return; }
    if (!open.length) return;
    any = true;
    const p = pathOf(f.id);
    section(m, h('button', { class: 'flink', title: '「' + p + '」を開く', onclick: () => goFolder(f.id) }, folderMark(f.id), p.startsWith(base) ? p.slice(base.length) : p),
      open, '', rowOpt);
  });
  if (!cur) {
    const lost = S.tasks.filter(t => !t.done && !listOf(t.listId));
    if (lost.length) section(m, 'フォルダなし', lost, '', { tree: true });
    if (!S.lists.length) m.append(h('p', { class: 'empty' }, 'フォルダがありません。⊞で作ってください。'));
    else if (!any && !lost.length) m.append(h('p', { class: 'empty' }, '未完了のタスクはありません。'));
  }
  if (S.showDone) {
    const ids = shown.map(f => f.id);
    const dn = S.tasks.filter(t => t.done && (ids.includes(t.listId) || (!cur && !listOf(t.listId))))
      .sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
    m.append(secBox('完了', dn.length, '', null, null,
      dn.length ? dn.map(t => taskRow(t, { showList: shown.length > 1 })) : h('p', { class: 'empty' }, '完了したタスクはありません。')));
  }
}

// ids を渡さなければ、選んでいるタスクをまとめて変える。終わったら「元に戻す」を出す
async function bulk(action, value, ids) {
  hideMenu();
  ids = (ids || [...(S.sel || [])]).filter(id => !id.startsWith('tmp') && taskOf(id));
  if (!ids.length) return;
  status('まとめて変えています…');
  try {
    const [r, back] = await callU('bulkTasks', ids, action, value || '');

    if (S.sel) S.sel = new Set();
    const n = ids.length;
    const msg = ({ done: n + '件を完了にしました', wont: n + '件をやらないにしました', delete: n + '件を削除しました' })[action] || n + '件を変えました';
    if (r.failed) status(msg + '（' + r.failed + '件はできませんでした）', true); else report(msg, back);

}

// ---- 体の外に出す小さなメニュー（まとめて変える・テンプレートを選ぶ） ----
const menu = document.getElementById('menu');
let menuFor = null;
function showMenu(btn, ...kids) {
  menu.replaceChildren(...kids);

  menuFor = btn;

// 押したボタンの下（入らなければ上）に出す。狭い画面では下から出す
function placeAt(el, anchor) {
  const sheet = innerWidth < 560;
  el.classList.toggle('sheet', sheet);
  if (sheet) return;
  const r = anchor.getBoundingClientRect();
  let y = r.bottom + 6;
  if (y + el.offsetHeight > innerHeight - 8) y = Math.max(8, r.top - el.offsetHeight - 6);
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + 'px';
  el.style.top = y + 'px';
}

async function useTpl(tp, base) {

// テンプレートに残す中身（日付は残さない。チェックリストは未チェックに）
function tplData(t, withKids, depth) {
  const o = { title: t.title, memo: t.memo || '', checklist: (t.checklist || []).map(x => ({ t: x.t, d: false })),
    repeat: t.repeat || 'none', reminders: t.reminders || [], estimate: hasEst(t) ? t.estimate : '' };
  if (withKids && depth < 20) o.kids = sortTasks(kidsOf(t.id).filter(k => !k.wontDo), true).map(k => tplData(k, true, depth + 1));

// ---- カレンダー ----
function weekStart() { return S.settings.weekStart === 'mon' ? 1 : 0; }
function startOfWeek(d) { const x = toDate(d); return addDays(d, -((x.getDay() - weekStart() + 7) % 7)); }
function hourH() { return innerWidth < 560 ? 40 : 46; } // 時間の帯の1時間の高さ
function eventsOn(d) {
  const ev = S.events[d.slice(0, 7)] || [];
  const next = addDays(d, 1);
  // 時間指定の予定は、その日の0時〜翌日0時と重なっていれば出す（日をまたぐ予定も両方の日に出る）
  return ev.filter(e => e.allDay ? (e.start <= d && d < e.end) : (e.start < next + 'T00:00' && e.end > d + 'T00:00'));
}
function needEvents(days) {
  // 月表示は前月・当月・翌月の3か月にまたがることがあるので、表示する日すべての月を読む
  const keys = [...new Set(days.map(d => d.slice(0, 7)))];
  keys.forEach(key => {
    if (S.events[key] !== undefined) return;
    S.events[key] = null; // 読み込み中
    const [y, mo] = key.split('-').map(Number);
    loadEvents(key, key + '-01', ymd(new Date(y, mo, 1)));
  });
  return keys.some(k => S.events[k] === null);
}
async function loadEvents(key, from, to) {
  try { S.events[key] = await call('getEvents', from, to); }
  catch (e) { S.events[key] = []; fail(e); }
  if (S.view === 'cal') render();
}
// from〜to の日にかかる予定（月ごとに読んでいるので、月をまたぐ予定は1つにまとめる）
function eventsIn(from, to) {
  const seen = new Set();
  const out = [];
  for (let k = from.slice(0, 7), i = 0; k <= to.slice(0, 7) && i < 4; k = addDays(k + '-28', 7).slice(0, 7), i++) {
    (S.events[k] || []).forEach(e => {
      const key = e.title + '|' + e.start + '|' + e.end;
      if (!seen.has(key)) { seen.add(key); out.push(e); }
    });
  }
  return out;
}
// from〜to に出すもの。s〜e は日（期間なら最初と最後の日）。timed は時間の帯に置けるもの（1日の中で時刻があるもの）
function calItems(from, to) {
  const out = [];
  const hit = (s, e) => s <= to && e >= from;
  S.tasks.forEach(t => {
    if (t.done) return;
    const color = colorOf(t.listId);
    if (t.doDate) {
      const s = doFirst(t);
      const e = doLast(t) < s ? s : doLast(t);
      if (hit(s, e)) {
        const tm = timeOf(t.doDate);
        const sMin = tm ? mins(tm) : 0;
        const hasEnd = !!(tm && t.doEnd && timeOf(t.doEnd) && s === e);
        let eMin = hasEnd ? mins(timeOf(t.doEnd)) : sMin + 30; // 終わりがなければ30分の帯
        if (eMin <= sMin) eMin = sMin + 30;
        out.push({ kind: 'do', t, s, e, timed: !!tm && s === e, sMin, eMin: Math.min(eMin, 1440), hasEnd, key: tm, title: t.title, color });
      }
    }
    if (t.due && hit(day(t.due), day(t.due))) {
      const tm = timeOf(t.due);
      const sMin = tm ? mins(tm) : 0;
      out.push({ kind: 'due', t, s: day(t.due), e: day(t.due), timed: !!tm, sMin, eMin: Math.min(sMin + 30, 1440), key: tm, title: '⚑' + t.title, color });
    }
  });
  eventsIn(from, to).forEach(ev => {
    let s, e, sMin = 0, eMin = 0, timed = false;
    if (ev.allDay) {
      s = ev.start;
      e = addDays(ev.end, -1) < s ? s : addDays(ev.end, -1);
    } else {
      s = day(ev.start);
      e = timeOf(ev.end) === '00:00' ? addDays(day(ev.end), -1) : day(ev.end);
      if (e < s) e = s;
      timed = s === e;
      sMin = mins(timeOf(ev.start));
      eMin = day(ev.end) === s ? mins(timeOf(ev.end)) : 1440;
      if (eMin <= sMin) eMin = Math.min(sMin + 30, 1440);
    }
    if (hit(s, e)) out.push({ kind: 'ev', ev, s, e, timed, sMin, eMin, key: ev.allDay ? '' : timeOf(ev.start), title: ev.title, color: ev.color });
  });
  return out;
}
// days の段に、重ならないように詰めて並べる（長い期間を先に、次に終日、時刻の順）
function packLanes(items, days) {
  const n = days.length;
  const rows = items.map(x => ({ x, c0: Math.max(0, daysBetween(days[0], x.s)), c1: Math.min(n - 1, daysBetween(days[0], x.e)) }));
  rows.sort((a, b) => (b.c1 - b.c0) - (a.c1 - a.c0) || a.c0 - b.c0 || (a.x.key ? 1 : 0) - (b.x.key ? 1 : 0) || a.x.key.localeCompare(b.x.key));
  const lanes = [];
  rows.forEach(r => {
    let l = 0;
    while (lanes[l] && lanes[l].some(([a, b]) => a <= r.c1 && r.c0 <= b)) l++;
    (lanes[l] = lanes[l] || []).push([r.c0, r.c1]);
    r.lane = l;
  });
  return rows;
}
// 段に並べる1つ（rowOff・colOff はグリッドの何行目・何列目から使うか）
function laneEl(r, days, rowOff, colOff) {
  const x = r.x;
  const cont = (x.s < days[0] ? ' cont-l' : '') + (x.e > days[days.length - 1] ? ' cont-r' : '');
  const style = 'grid-row:' + (r.lane + rowOff) + ';grid-column:' + (r.c0 + colOff) + '/' + (r.c1 + colOff + 1) + ';';
  const tm = x.key && !cont ? tmLabel(x.key) : '';
  if (x.kind === 'ev') {
    return h('div', { class: 'it ev lane' + cont, style: style + '--evc:' + (x.color || ''), title: x.title },
      tm ? h('span', { class: 'tm' }, tm) : null, x.title);
  }
  return taskChip(x.t, x.kind, days[r.c0], tm, 'lane' + cont, style + (x.color ? '--c:' + x.color : ''));
}
// カレンダーのタスク。押すと開き、ドラッグ（スマホは長押ししてから）で別の日・時刻へ動かせる
function taskChip(t, kind, d, tm, cls, style) {
  const tip = (kind === 'due' ? '期限：' : '実行日：') + t.title + '（押すと開く・ドラッグで動かす）';
  return h('div', { class: 'it task-it' + (kind === 'due' ? ' due' : '') + (cls ? ' ' + cls : ''), style: style || (colorOf(t.listId) ? '--c:' + colorOf(t.listId) : null),
    title: tip, 'data-id': t.id, 'data-kind': kind, 'data-day': d,
    onclick: e => { e.stopPropagation(); S.cur = t.id; openTaskSmart(t); }, oncontextmenu: e => chipMenu(e, t) },
    tm ? h('span', { class: 'tm' }, tm) : null, (kind === 'due' ? '⚑' : '') + t.title);
}

function viewCal(m) {
  const td = today();
  if (!S.calDay) S.calDay = td;
  if (!S.calMonth) S.calMonth = S.calDay.slice(0, 7);
  const mode = S.calMode;
  let days, title;
  if (mode === 'month') {
    const [y, mo] = S.calMonth.split('-').map(Number);
    const start = startOfWeek(S.calMonth + '-01');
    days = [];
    for (let i = 0; i < 42; i++) days.push(addDays(start, i));
    if (days[35].slice(0, 7) !== S.calMonth) days.length = 35;
    title = y + '年' + mo + '月';
  } else if (mode === 'week') {
    const start = startOfWeek(S.calDay);
    days = [];
    for (let i = 0; i < 7; i++) days.push(addDays(start, i));
    title = md(days[0]) + '〜' + md(days[6]);
  } else {
    days = [S.calDay];
    title = dayTitle(S.calDay);
  }
  const loading = needEvents(days);
  const move = calMove;
  const setMode = md => { S.calMode = md; if (md === 'month') S.calMonth = S.calDay.slice(0, 7); render(); };
  m.append(h('div', { class: 'calhead' },
    h('div', { class: 'modes' }, [['month', '月', '月で表示する'], ['week', '週', '週で表示する（時間の帯）'], ['day', '日', '1日で表示する（時間の帯）']]
      .map(([k, t, tip]) => h('button', { class: 'icon txt' + (mode === k ? ' on' : ''), title: tip, 'aria-label': tip, onclick: () => setMode(k) }, t))),
    h('button', { class: 'icon', title: '前を表示する', 'aria-label': '前を表示する', onclick: () => move(-1) }, '‹'),
    h('h2', null, title),
    h('button', { class: 'icon', title: '今日に戻る', 'aria-label': '今日に戻る', onclick: () => { S.calDay = td; S.calMonth = td.slice(0, 7); render(); } }, ic('today')),
    h('button', { class: 'icon', title: '次を表示する', 'aria-label': '次を表示する', onclick: () => move(1) }, '›')));
  if (loading) m.append(h('p', { class: 'note' }, 'Googleカレンダーを読み込み中…'));
  trayView(m);
  if (mode === 'month') monthView(m, days, td); else timelineView(m, days, td);
  if (mode !== 'day') m.append(h('h2', null, dayTitle(S.calDay)));

  // 選んだ日の中身
  const d = S.calDay;
  const evs = eventsOn(d);
  const tasks = S.tasks.filter(t => onDay(t, d) || day(t.due) === d);
  m.append(quickAdd(() => ({ doDate: S.calDay }), true));
  if (evs.length) {
    const next = addDays(d, 1);
    const tmText = e => {
      if (e.allDay) return '終日';
      const s = e.start.slice(0, 10) === d ? hm(e.start) : md(e.start) + ' ' + hm(e.start);
      const en = e.end.slice(0, 10) === d || e.end === next + 'T00:00' ? hm(e.end) : md(e.end) + ' ' + hm(e.end);
      return s + '〜' + en;
    };
    m.append(h('section', { class: 'sec' }, h('h3', null, '予定', h('span', { class: 'cnt' }, evs.length)),
      evs.slice().sort((a, b) => (a.allDay ? '' : a.start).localeCompare(b.allDay ? '' : b.start))
        .map(e => h('div', { class: 'evrow', style: '--evc:' + (e.color || '') }, h('span', { class: 'tm' }, tmText(e)), h('span', null, e.title)))));
  }
  section(m, 'タスク（実行日・期限がこの日）', tasks, 'この日のタスクはありません。');
}

// 前・次の月（週・日）へ。キーの ← → からも使う
function calMove(n) {
  if (S.calMode === 'month') {
    const [y, mo] = S.calMonth.split('-').map(Number);
    S.calMonth = ymd(new Date(y, mo - 1 + n, 1)).slice(0, 7);
  } else {
    S.calDay = addDays(S.calDay, n * (S.calMode === 'week' ? 7 : 1));
    S.calMonth = S.calDay.slice(0, 7);
  }
  render();
}

// 月の表示。日のマスを押すとその日を選び、選んだ日をもう一度押すとタスクを作る
function monthView(m, days, td) {
  const ws = weekStart();
  const maxL = innerWidth < 560 ? 3 : 4;
  const box = h('div', { class: 'mcal' }, h('div', { class: 'mhead' },
    [0, 1, 2, 3, 4, 5, 6].map(i => { const w = (i + ws) % 7; return h('div', { class: 'wd' + (w === 0 ? ' sun' : w === 6 ? ' sat' : '') }, WEEK[w]); })));
  for (let i = 0; i < days.length; i += 7) {
    const wd = days.slice(i, i + 7);
    const rows = packLanes(calItems(wd[0], wd[6]), wd);
    const els = rows.filter(r => r.lane < maxL).map(r => laneEl(r, wd, 2, 1));
    // 入りきらない分は「+数」。押すとその日を選んで、下に全部出す
    wd.forEach((d, c) => {
      const n = rows.filter(r => r.lane >= maxL && r.c0 <= c && c <= r.c1).length;
      if (n) els.push(h('div', { class: 'more', style: 'grid-row:' + (maxL + 2) + ';grid-column:' + (c + 1), title: 'この日を全部見る',
        onclick: () => { S.calDay = d; render(); } }, '+' + n));
    });
    box.append(h('div', { class: 'mweek' }, h('div', { class: 'mbg' }, wd.map(d => monthCell(d, td))), els));
  }
  m.append(box);
}
function monthCell(d, td) {
  const w = toDate(d).getDay();

// ---- アプリの更新（⚙ の ⟳）----
// 配布リポの新しい版を、署名とハッシュ値（ファイルの指紋）を確かめてから、このスクリプトに書き込む。
// 書き替える前の中身は控え（バージョン）に残し、途中で失敗したら元に戻す
function updateSection() {
  const msg = h('p', { class: 'note', role: 'status' }, '');
  const box = h('div', { class: 'row' });
  const say = (t, err) => { msg.textContent = t; msg.style.color = err ? 'var(--late)' : ''; };
  const errText = e => (e && e.message) || String(e);
  const btn = (icon, text, title, fn) => h('button', { class: 'btn', title, onclick: fn }, ic(icon), ' ' + text);
  const show = info => {
    box.textContent = '';
    if (!info.ready) {
      box.append(btn('settings', '更新の準備', '持ち主と、切り替えるデプロイ（Web アプリと API 実行可能）を覚える。最初に1回だけ', async () => {
        say('準備しています…');
        try { const r = await call('setupUpdate'); say('準備できました（切り替えるデプロイ：' + r.deployments.length + '個）'); show(await call('updateInfo')); }
        catch (e) { say('準備できませんでした：' + errText(e), true); }
      }));
      say('最初に1回「更新の準備」を押してください。');
      return;
    }
    box.append(
      btn('search', '新しい版を確かめる', '配布リポに新しい版があるかだけを見る（書き替えない）', async () => {
        say('確かめています…');
        try { const r = await call('checkUpdate'); say(r.newer ? '新しい版 v' + r.latest + ' があります。⟳ を押すと入れ替えます。' : 'もう最新です（v' + r.current + '）'); }
        catch (e) { say('確かめられませんでした：' + errText(e), true); }
      }),
      btn('refresh', '更新', '新しい版に入れ替える。終わったらページを開き直す', async () => {
        say('入れ替えています…（1分ほどかかることがあります。閉じずに待ってください）');
        try {
          const r = await call('selfUpdate');
          if (r.updated) say('✓ ' + r.message + '。ページを開き直すと新しい版になります。');
          else if (r.recovered) say(r.message + (r.error ? '（理由：' + r.error + '）' : ''), !!r.error);
          else say(r.message);
          if (r.reload) show(await call('updateInfo'));
        } catch (e) { say('更新できませんでした：' + errText(e), true); }
      }));
    if (info.pending) {
      box.append(btn('undo', '戻す', '途中で止まった更新を元に戻す', async () => {
        say('戻しています…');
        try { const r = await call('recoverUpdate'); say(r.message); show(await call('updateInfo')); }
        catch (e) { say(errText(e), true); }
      }));
      say('前の更新が途中で止まっています（v' + info.pending.from + ' → v' + info.pending.to + '）。↶ 戻す を押してください。', true);
    }
  };
  call('updateInfo').then(show).catch(e => say('更新の状態を読めませんでした：' + errText(e), true));
  return h('section', { class: 'sec form' }, h('h3', null, 'アプリの更新'),
    h('p', { class: 'note' }, '今の版：v' + VERSION + '。新しい版は、作った人の署名が合うときだけ入れます。Android版の更新は、Android版の ⚙ から行います。'),
    box, msg);
}

// 打ち込んだ時刻を読む（9:30、930、21、全角も可）。空は ''、読めなければ null
function parseTime(s) {
  s = String(s).trim().replace(/[０-９：]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  if (!s) return '';
  const m = s.match(/^(\d{1,2})(?::(\d{1,2}))?$/) || s.match(/^(\d{1,2})(\d{2})$/);
  if (!m || Number(m[1]) > 23 || Number(m[2] || 0) > 59) return null;
  return pad(Number(m[1])) + ':' + pad(Number(m[2] || 0));
}
// 日付と時刻を選ぶ小窓。押すとすぐ欄に入る
function datePicker(btn, key) {
  const f = FIELD[key];

  const set = v => {
    FS[key] = v;
    // 期間の始まりを動かして終わりより後になったら、終わりも動かす。日を消したら期間もやめる
    if (key === 'doDate' && v && periodChk.checked && FS.doEnd <= v) FS.doEnd = defaultEnd(v);
    if (!v && (key === 'doDate' || key === 'doEnd')) periodChk.checked = false;
    showFields();
    draw();
  };
  const pickDay = d => { month = d.slice(0, 7); set(joinDT(d, timeOf(FS[key]) || (f.time === 'need' ? '09:00' : ''))); };
  function draw() {

// ---- 繰り返しを選ぶ（TickTick のように、よく使うものを並べ、カスタムで間隔・曜日・第N曜日を選ぶ） ----
function firstFrom(s, ok) {
  for (let i = 0; i < 400; i++) { const x = addDays(s, i); if (ok(toDate(x), x)) return x; }
  return s;
}
// 繰り返しを決める。newDay が今の起点と違えば、実行日（なければ期限）をその日に動かす
function applyRepeat(rule, newDay) {
  FS.repeat = rule;
  if (parseRepeat(rule)) {
    const cur = anchorDay();
    if (!cur) FS.doDate = newDay;
    else if (newDay !== cur) {
      const n = daysBetween(cur, newDay);
      if (FS.doDate) { FS.doDate = shiftKeepTime(FS.doDate, n); FS.doEnd = shiftKeepTime(FS.doEnd, n); }
      else FS.due = shiftKeepTime(FS.due, n);
    }
  }
  showFields();
}
function weekOrder() { const ws = weekStart(); return [0, 1, 2, 3, 4, 5, 6].map(i => (i + ws) % 7); }
function repeatPicker(btn) {
  const base = anchorDay() || today();
  const isLast = toDate(base).getDate() + 7 > daysInMonth(base);
  const presets = ['none', 'daily/1', 'weekly/1/1,2,3,4,5', 'weekly/1/1,2,3,4,5/nh', 'weekly/1', 'monthly/1/day', 'monthly/1/nth', isLast ? 'monthly/1/last' : null, 'yearly/1'].filter(Boolean);
  const cur = FS.repeat;
  const custom = parseRepeat(cur) && !presets.some(v => sameRepeat(v, cur));
  showPop(btn, h('div', { class: 'rp-list' },
    presets.map(v => h('button', { type: 'button', class: 'rp-opt' + (sameRepeat(v, cur) ? ' sel' : ''),
      onclick: () => { applyRepeat(v, base); hidePop(); } }, repeatLabel(v, base))),
    custom ? h('button', { type: 'button', class: 'rp-opt sel', onclick: () => customRepeat(btn) }, repeatLabel(cur, base)) : null,
    h('button', { type: 'button', class: 'rp-opt', onclick: () => customRepeat(btn) }, 'カスタム…（間隔・曜日・第N曜日・祝日を飛ばす）')));
}
function customRepeat(btn) {
  const base = anchorDay() || today();
  const bd = toDate(base);
  const r0 = parseRepeat(FS.repeat) || { freq: 'weekly', interval: 1, days: [], by: 'day' };
  const c = { freq: r0.freq, interval: r0.interval, days: new Set(r0.days.length ? r0.days : [bd.getDay()]),
    mode: r0.by === 'day' ? 'day' : 'week', mday: bd.getDate(), nth: r0.by === 'last' ? 'L' : Math.ceil(bd.getDate() / 7), wd: bd.getDay(), nh: !!r0.nh };
  // 選んだ中身から、ルールの文字と、起点にする日（今の起点から見て最初に当てはまる日）を出す
  const result = () => {
    const r = { freq: c.freq, interval: c.interval, days: [], by: 'day', nh: c.nh };
    let nd = base;
    // 起点は繰り返しの決まりどおりの日のまま（祝日でも動かさない）。祝日を飛ばすのは次の回から（サーバーの advance_）
    if (c.freq === 'weekly') {
      r.days = [...c.days].sort((x, y) => x - y);
      nd = firstFrom(base, d => c.days.has(d.getDay()));
    } else if (c.freq === 'monthly' && c.mode === 'day') {
      nd = firstFrom(base, d => d.getDate() === c.mday);
    } else if (c.freq === 'monthly') {
      r.by = c.nth === 'L' ? 'last' : 'nth';
      nd = firstFrom(base, (d, x) => d.getDay() === c.wd && (c.nth === 'L' ? d.getDate() + 7 > daysInMonth(x) : Math.ceil(d.getDate() / 7) === c.nth));
    }
    return { rule: ruleOf(r), day: nd };
  };
  const prev = h('p', { class: 'rp-prev' });
  const showPrev = () => {
    const r = result();
    const what = FS.doDate || !FS.due ? '実行日' : '期限';
    prev.textContent = '→ ' + repeatLabel(r.rule, r.day) + (r.day !== anchorDay() ? '（' + what + 'を ' + rel(r.day) + ' にします）' : '');
  };
  const seg = (items, isOn, pick, cls) => h('div', { class: 'seg ' + (cls || '') },
    items.map(([v, l]) => h('button', { type: 'button', class: isOn(v) ? 'on' : '', onclick: () => { pick(v); draw(); } }, l)));
  function draw() {
    const num = h('input', { type: 'number', min: 1, max: 99, 'aria-label': '何回ごとに繰り返すか' });
    num.value = c.interval;
    num.addEventListener('input', () => { c.interval = Math.min(Math.max(parseInt(num.value, 10) || 1, 1), 99); showPrev(); });
    const parts = [h('div', { class: 'rp-row' }, num,
      seg([['daily', '日'], ['weekly', '週'], ['monthly', 'か月'], ['yearly', '年']], v => c.freq === v, v => { c.freq = v; }), 'ごと')];
    if (c.freq === 'weekly') {
      parts.push(seg(weekOrder().map(i => [i, WEEK[i]]), i => c.days.has(i),
        i => { if (!c.days.has(i)) c.days.add(i); else if (c.days.size > 1) c.days.delete(i); }, 'days'));
    }
    if (c.freq === 'monthly') {
      parts.push(h('div', { class: 'rp-row' }, seg([['day', '日付で'], ['week', '曜日で']], v => c.mode === v, v => { c.mode = v; })));
      if (c.mode === 'day') {
        const ds = [];
        for (let i = 1; i <= 31; i++) ds.push([i, i]);
        parts.push(seg(ds, i => c.mday === i, i => { c.mday = i; }, 'mdays'));
      } else {
        parts.push(seg([[1, '第1'], [2, '第2'], [3, '第3'], [4, '第4'], [5, '第5'], ['L', '最終']], v => c.nth === v, v => { c.nth = v; }),
          h('div', { style: 'height:6px' }),
          seg(weekOrder().map(i => [i, WEEK[i]]), i => c.wd === i, i => { c.wd = i; }, 'days'));
      }
    }
    if (c.freq === 'yearly') parts.push(h('p', { class: 'note' }, '毎年、起点の日（' + md(base) + '）に繰り返します。'));
    const nh = h('input', { type: 'checkbox', checked: c.nh, onchange: e => { c.nh = e.target.checked; showPrev(); } });
    parts.push(h('div', { class: 'rp-row' }, h('label', { class: 'pchk', title: '次の回が祝日に当たったら、その回を飛ばして次の回にする' }, nh, ' 祝日は飛ばす')));
    showPrev();
    parts.push(prev, h('div', { class: 'pop-acts' },
      h('button', { type: 'button', class: 'btn', onclick: () => repeatPicker(btn) }, '戻る'),
      h('span', { class: 'sp' }),
      h('button', { type: 'button', class: 'btn primary', onclick: () => { const r = result(); applyRepeat(r.rule, r.day); hidePop(); } }, '決定')));
    showPop(btn, ...parts);
  }
  draw();
}

// ---- チェックリスト（期日などはなく、項目を並べて済みにするだけ） ----
const chkList = document.getElementById('chkList');

function renderChecklist(focusAt) {

      if (e.key === 'Enter') { e.preventDefault(); FS.checklist.splice(i + 1, 0, { t: '', d: false }); renderChecklist(i + 1); }

// 添付の結果は、編集画面がまだ同じタスクを開いているときだけ反映する
function keepEditing(saved) {

  S.editing = saved; renderAttachments();
}
function renderAttachments() {
  const box = document.getElementById('attList');

      try {

document.getElementById('attPick').onclick = () => document.getElementById('attInput').click();
document.getElementById('attInput').addEventListener('change', async e => {
  const files = [...e.target.files];

  const id = S.editing.id;

      const saved = await call('addAttachment', id, f.name, f.type, b64);

// 開いたときの入力欄の中身。外側を押したとき、変えていなければ保存せずに閉じる
const FORM_KEYS = ['title', 'listId', 'parentTaskId', 'doDate', 'doEnd', 'due', 'repeat', 'notifyAt', 'reminders', 'memo', 'checklist', 'estimate'];
let taskSnap = {};
function formValues() {

    notifyAt: FS.notifyAt,

    estimate: String(FS.estimate)
  };
}
function formChanged() { const f = formValues(); return FORM_KEYS.some(k => f[k] !== taskSnap[k]); }
// 開いた後にタスクが変わることがある（子の操作で親の完了や繰り返しが戻るなど）。
// 利用者が変えた欄だけ入力の値を使い、ほかは最新のタスクの値を使う
function readForm() {
  const t = Object.assign({}, taskOf(S.editing.id) || S.editing);
  const f = formValues();
  FORM_KEYS.forEach(k => {

    t[k] = k === 'checklist' ? JSON.parse(f[k]) : k === 'reminders' ? f[k].split(',').filter(Boolean)

  if (!listOf(t.listId)) TF('listId').prepend(h('option', { value: '', selected: true }, '（フォルダなし）'));
  parentOptions(t.listId, t.parentTaskId || '');
  TF('title').value = t.title || '';
  Object.assign(FS, { doDate: t.doDate || '', doEnd: t.doEnd || '', due: t.due || '', notifyAt: t.notifyAt || '',
    repeat: t.repeat || 'none', checklist: (t.checklist || []).map(x => ({ t: x.t, d: !!x.d })), reminders: (t.reminders || []).slice(),
    estimate: hasEst(t) ? String(t.estimate) : '' });

  TF('memo').value = t.memo || '';

    const [r, back] = await callU('bulkGroups', [{ ids: [...P.soon], action: 'date', value: P.td }], P.td);
    S.tasks = r.tasks;
    report('期限が近いタスクを今日にしました', back);
    render();
    P.busy = false;
    const msg = planFails(r);
    P.soon = new Set();
    planNext(3);
    if (msg) { P.err = msg; drawPlan(); }
  } catch (e) { P.busy = false; P.err = 'うまくいきませんでした：' + ((e && e.message) || e); drawPlan(); }
}
async function applyOrder() {
  const P = PLAN;

// ---- 左右にすべらせる（スマホのブラウザ。v0.13.0） ----
// 右へ：完了（終えたものは未完了に戻す）、左へ：実行日を選ぶ小窓（今日・明日・1週間後・選ぶ・外す）。
// 横に動かしたと分かるまでは、ふつうの縦のスクロール。十分に動かして離したときだけ行う（速さだけでは行わない）。
// 選んでいる間・ドラッグ中・編集画面の中では行わない。ボタンとメニューからも同じことができる
let swipe = null;
function swipeEnd(cancel) {
  const w = swipe;
  swipe = null;
  if (!w || !w.wrap) return;
  w.row.style.transition = 'transform .15s ease-out';
  w.row.style.transform = '';
  setTimeout(() => {
    if (!w.wrap.isConnected) return;
    w.row.style.transition = '';
    w.wrap.replaceWith(w.row);
  }, 160);
  if (cancel || !w.armed) return;
  eatClick = true;
  setTimeout(() => { eatClick = false; }, 300);
  const t = taskOf(w.id);
  if (!t) return;

}
// 左へすべらせたとき：実行日を選ぶ小窓（右クリックの「日付を選ぶ」と同じ）
function openSwipeDates(t, rect) {

  const b = menu.querySelector('button');
  if (b) b.focus();
}
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || !e.target.closest) return;
  const row = e.target.closest('#main .task[data-id]');
  // 右端の ⋯ から左へなでても始められるようにする（ほかのボタンや入力欄の上からは始めない）
  if (!row || S.sel || (e.target.closest(NO_DRAG) && !e.target.closest('.more-btn')) || row.closest('.sw-wrap') || row.dataset.id.startsWith('tmp')) return;
  const p = e.touches[0];
  swipe = { row, id: row.dataset.id, x0: p.clientX, y0: p.clientY, dx: 0, on: false, armed: false, wrap: null };
}, { passive: true });
document.addEventListener('touchmove', e => {
  const w = swipe;
  if (!w) return;
  if (drag && drag.on) { swipe = null; return; }
  const p = e.touches[0];
  const dx = p.clientX - w.x0;
  const dy = p.clientY - w.y0;
  if (!w.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { swipe = null; return; } // 縦のスクロール
    if (Math.abs(dx) < 14 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (drag) dragCancel(); // 長押しのドラッグ待ちはやめる
    w.on = true;
    const t = taskOf(w.id);
    const bgR = h('div', { class: 'sw-bg r', 'aria-hidden': 'true' }, ic(t && t.done ? 'undo' : 'check'), t && t.done ? '未完了に戻す' : '完了');
    const bgL = h('div', { class: 'sw-bg l', 'aria-hidden': 'true' }, 'やる日を変える', ic('calendar'));
    w.wrap = h('div', { class: 'sw-wrap' });
    w.row.replaceWith(w.wrap);
    w.wrap.append(bgR, bgL, w.row);
    w.bgR = bgR; w.bgL = bgL;
  }
  e.preventDefault();
  w.dx = dx;
  const lim = Math.min(120, w.row.offsetWidth * 0.35);
  const armed = Math.abs(dx) >= lim;
  if (armed && !w.armed && navigator.vibrate) navigator.vibrate(10);
  w.armed = armed;
  w.bgR.hidden = dx < 0;
  w.bgL.hidden = dx >= 0;
  (dx >= 0 ? w.bgR : w.bgL).classList.toggle('armed', armed);
  w.row.style.transform = 'translateX(' + dx + 'px)';
}, { passive: false });
document.addEventListener('touchend', () => { if (swipe) swipeEnd(false); });

// ---- 元に戻す（Ctrl+Z）。直前の操作から順に、30回まで ----
const UNDO = [];
let undoing = false;
// 元に戻せる操作としてサーバーを呼ぶ。[結果, 戻し方] を返す（戻し方は、変わる前の行を書き戻す）
async function callU(fn, ...args) {
  const r = await call('undoable', fn, args);
  const u = r.undo;
  const back = u && (u.rows.length || u.created.length) ? () => call('restoreRows', u).then(all => { S.tasks = all; }) : null;
  return [r.result, back];
}
// 知らせを出す。run（戻し方）があれば、元に戻せるように覚えておく
function report(msg, run) {
  if (!run || undoing) { status(msg); return; }
  UNDO.push({ msg, run });
  if (UNDO.length > 30) UNDO.shift();
  status(msg, false, true);
}
async function undo() {
  if (undoing) return;
  const u = UNDO.pop();
  if (!u) { status('元に戻せる操作はありません'); return; }
  undoing = true;
  status('元に戻しています…');
  try { await u.run(); status('元に戻しました（' + u.msg + '）'); } catch (e) {
    // 別の画面で変えられていたときは、その最新の内容を見せる
    if (/別の画面/.test(String(e && e.message || e))) { try { useData(await call('getAll')); } catch (e2) { /* そのまま */ } }
    fail(e);
  }
  undoing = false;
  render();
}

// ---- 選ぶ・今のタスク ----
// 画面に出ている順のタスク（作っている途中のものは除く）
function visibleIds() {
  const out = [];
  document.querySelectorAll('#main .task[data-id]').forEach(r => {
    const id = r.dataset.id;
    if (!id.startsWith('tmp') && !out.includes(id)) out.push(id);
  });
  return out;
}
// キーや右クリックで操作する相手：選んでいればそれ全部、なければ今のタスク
function targets() {
  if (S.sel && S.sel.size) return [...S.sel].filter(taskOf);
  return S.cur && taskOf(S.cur) ? [S.cur] : [];
}
// a から b までをまとめて選ぶ。replace なら選び直す（Shift＋↑↓）
function selectRange(a, b, replace) {
  const ids = visibleIds();
  let i = ids.indexOf(a);
  let j = ids.indexOf(b);
  if (j < 0) return;
  if (i < 0) i = j;
  if (i > j) [i, j] = [j, i];
  if (!S.sel || replace) S.sel = new Set();
  ids.slice(i, j + 1).forEach(id => S.sel.add(id));
  S.cur = b;
  render();
}
// 行を押したとき。Ctrl＋クリックで1つずつ選ぶ、Shift＋クリックで間をまとめて選ぶ
function rowClick(t, e, opt) {
  if (t.id.startsWith('tmp') || e.target.closest('.ren-in')) return;
  // 編集画面の中の子タスクを押したときは、今の画面を保存してから子タスクを開く
  if (opt.inDlg) { if (commitTask(false)) openTask(t); return; }
  const multi = LIST_VIEWS.includes(S.view);
  if (multi && (e.ctrlKey || e.metaKey)) {
    if (!S.sel) S.sel = new Set(S.cur && S.cur !== t.id && taskOf(S.cur) ? [S.cur] : []);
    S.anchor = t.id;
    S.cur = t.id;
    toggleSel(t);
    return;
  }
  if (multi && e.shiftKey) { selectRange(S.anchor || S.cur || t.id, t.id); return; }
  if (S.sel) { S.anchor = t.id; S.cur = t.id; toggleSel(t); return; }
  S.cur = t.id;
  S.anchor = t.id;
  // 右側の欄に開いているタスクの名前を押したら、その場で名前を直す
  if (panelMode() && taskDlg.open && S.editing && S.editing.id === t.id && e.target.closest('.ttl')) { startRename(t); return; }
  openTaskSmart(t);
}

// ---- 名前をその場で直す ----
function startRename(t) {
  if (!t || t.id.startsWith('tmp')) return;
  if (S.renaming && S.renaming.id !== t.id) finishRename(true);

}
// save なら保存する（空なら元の名前に戻す）。next があれば、続けてそのタスクの名前を直す
function finishRename(save, next) {
  const r = S.renaming;
  if (!r) return;
  S.renaming = null;
  const t = taskOf(r.id);
  const v = r.value.trim();
  if (t && save && v && v !== t.title) patchTask(t, { title: v });
  else {
    if (t && taskDlg.open && S.editing && S.editing.id === t.id) { TF('title').value = t.title; taskSnap.title = t.title; }
    render();
  }

    if (taskDlg.classList.contains('panel')) openTaskSmart(next);

  }
}
function renameInput(t) {
  const inp = h('input', { type: 'text', class: 'ren-in', 'aria-label': 'タスク名', autocomplete: 'off' });
  inp.value = S.renaming.value;
  // 右側の欄に同じタスクを開いていれば、そちらの名前もそろえる
  inp.addEventListener('input', () => {
    if (!S.renaming || S.renaming.id !== t.id) return;
    S.renaming.value = inp.value;
    if (taskDlg.open && S.editing && S.editing.id === t.id) { TF('title').value = inp.value; taskSnap.title = inp.value; }
  });
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.isComposing) return;
    if (e.key === 'Enter') { e.preventDefault(); finishRename(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finishRename(false); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const ids = visibleIds();
      finishRename(true, taskOf(ids[ids.indexOf(t.id) + (e.key === 'ArrowUp' ? -1 : 1)]));
    }
  });
  inp.addEventListener('click', e => e.stopPropagation());
  // ほかを押したら保存する（描き直しで入れ替わっただけのときは続ける）
  inp.addEventListener('blur', () => setTimeout(() => {
    const r = S.renaming;
    const a = document.activeElement;
    if (r && r.id === t.id && !(a && a.classList.contains('ren-in'))) finishRename(true);
  }, 150));
  return inp;
}

// ---- 何行もの文章を貼り付けたら、1行ずつタスクにする ----
function splitLines(text) {
  return String(text).split(/\r?\n/)
    .map(s => s.replace(/^\s*(?:[-・*•□☐■]\s*|\d+[.)．）]\s+|\[[ xX]?\]\s*)/, '').trim()).filter(Boolean);
}
function onPasteLines(inp, baseFn) {
  inp.addEventListener('paste', e => {
    const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
    if (splitLines(text).length < 2) return;
    e.preventDefault();
    e.stopPropagation();
    pasteLines(text, baseFn(), inp);
  });
}
function pasteLines(text, base, anchor) {
  const titles = splitLines(text);

    h('p', { class: 'note', style: 'margin:4px 8px' }, titles.length + '行の文章です'),
    h('button', { type: 'button', class: 'rp-opt', onclick: () => { hideMenu(); addMany(titles, base); } }, '☰ 1行ずつ ' + titles.length + ' 件のタスクにする'),
    h('button', { type: 'button', class: 'rp-opt', onclick: () => { hideMenu(); addTask(Object.assign({}, base, { title: titles[0], memo: titles.slice(1).join('\n') })); } },
      '▭ 1つのタスクにする（2行目からはメモ）'),
    h('button', { type: 'button', class: 'rp-opt', onclick: hideMenu }, '✕ やめる')));
  menu.querySelector('.rp-opt').focus();
}

// ---- 複製・コピー・貼り付け ----
// listId が空なら、元と同じフォルダに作る

// 名前とメモを文字にする
function taskText(ids) {
  return ids.map(id => {
    const t = taskOf(id);
    const cl = (t.checklist || []).map(x => (x.d ? '☑ ' : '☐ ') + x.t);
    return [t.title].concat(t.memo ? [t.memo] : [], cl).join('\n');
  }).join('\n\n');
}
function copyText(text, msg) {
  const ok = () => status(msg || 'コピーしました');
  const old = () => {
    const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    ta.remove();
    if (done) ok(); else status('コピーできませんでした', true);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, old); else old();
}
// 文字を打っている・小窓やメニューの中にいる
function typing() {

}

// 一覧を隠すポップアップが開いている（右側の欄は除く）

}
// Ctrl+C：選んだタスク（なければ今のタスク）の名前をコピーする。Ctrl+V で複製になる

// Ctrl+V：コピーしたタスクなら複製（フォルダの画面ならそのフォルダへ）、ほかの文章ならタスクを作る

  if (inUi() || modalOpen() || !e.clipboardData) return;
  if (!LIST_VIEWS.includes(S.view) && S.view !== 'cal') return;

// ---- 右クリックのメニュー（スマホは ⋯ から） ----

      dBtn(ic('week'), '実行日を1週間後にする', () => bulk('date', addDays(td, 7), ids)),

// カレンダーの帯・予定のタスクを右クリックしたとき
