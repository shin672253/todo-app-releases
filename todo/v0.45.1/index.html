    presets.map(v => h('button', { type: 'button', class: 'rp-opt' + (sameRepeat(v, cur) ? ' sel' : ''),
      onclick: () => { applyRepeat(v, base); hidePop(); } }, repeatLabel(v, base))),
    custom ? h('button', { type: 'button', class: 'rp-opt sel', onclick: () => customRepeat(btn) }, repeatLabel(cur, base)) : null,
    h('button', { type: 'button', class: 'rp-opt', onclick: () => customRepeat(btn) }, 'カスタム…（間隔・曜日・第N曜日・毎年◯月の第N曜日・祝日を飛ばす・終わりの日）')));
}
function customRepeat(btn) {
  const base = anchorDay() || today();
  const bd = toDate(base);
  const r0 = parseRepeat(FS.repeat) || { freq: 'weekly', interval: 1, days: [], by: 'day' };
  const c = { freq: r0.freq, interval: r0.interval, days: new Set(r0.days.length ? r0.days : [bd.getDay()]),
    mode: r0.by === 'day' ? 'day' : 'week', mday: bd.getDate(), nth: r0.by === 'last' ? 'L' : Math.ceil(bd.getDate() / 7), wd: bd.getDay(), mon: bd.getMonth(), nh: !!r0.nh, until: r0.until || '' };
  // 選んだ中身から、ルールの文字と、起点にする日（今の起点から見て最初に当てはまる日）を出す
  const result = () => {
    const r = { freq: c.freq, interval: c.interval, days: [], by: 'day', nh: c.nh, until: c.until };
    let nd = base;
    // 起点は繰り返しの決まりどおりの日のまま（祝日でも動かさない）。祝日を飛ばすのは次の回から（サーバーの advance_）
    if (c.freq === 'weekly') {
      r.days = [...c.days].sort((x, y) => x - y);
      nd = firstFrom(base, d => c.days.has(d.getDay()));
    } else if (c.freq === 'monthly' && c.mode === 'day') {
      nd = firstFrom(base, d => d.getDate() === c.mday);
    } else if (c.freq === 'monthly') {
      r.by = c.nth === 'L' ? 'last' : 'nth';
      nd = firstFrom(base, (d, x) => d.getDay() === c.wd && (c.nth === 'L' ? d.getDate() + 7 > daysInMonth(x) : Math.ceil(d.getDate() / 7) === c.nth));
    } else if (c.freq === 'yearly' && c.mode === 'week') {
      // 毎年◯月の第◯◯曜日（起点から見て最初に当てはまる日。第1〜第4・最終なら1年以内に必ずある）
      if (c.nth === 5) c.nth = 'L';
      r.by = c.nth === 'L' ? 'last' : 'nth';
      nd = firstFrom(base, (d, x) => d.getMonth() === c.mon && d.getDay() === c.wd && (c.nth === 'L' ? d.getDate() + 7 > daysInMonth(x) : Math.ceil(d.getDate() / 7) === c.nth));
    }
    if (r.until && r.until < nd) r.until = ''; // 起点より前の終わりの日は使わない
    return { rule: ruleOf(r), day: nd };
  };
  const prev = h('p', { class: 'rp-prev' });
  const showPrev = () => {
    const r = result();
    const what = FS.doDate || !FS.due ? '実行日' : '期限';
    prev.textContent = '→ ' + repeatLabel(r.rule, r.day) + (r.day !== anchorDay() ? '（' + what + 'を ' + rel(r.day) + ' にします）' : '');
  };
  const seg = (items, isOn, pick, cls) => h('div', { class: 'seg ' + (cls || '') },
    items.map(([v, l]) => h('button', { type: 'button', class: isOn(v) ? 'on' : '', onclick: () => { pick(v); draw(); } }, l)));
  function draw() {
    const num = h('input', { type: 'number', min: 1, max: 99, 'aria-label': '何回ごとに繰り返すか' });
    num.value = c.interval;
    num.addEventListener('input', () => { c.interval = Math.min(Math.max(parseInt(num.value, 10) || 1, 1), 99); showPrev(); });
    const parts = [h('div', { class: 'rp-row' }, num,
      seg([['daily', '日'], ['weekly', '週'], ['monthly', 'か月'], ['yearly', '年']], v => c.freq === v, v => { c.freq = v; }), 'ごと')];
    if (c.freq === 'weekly') {
      parts.push(seg(weekOrder().map(i => [i, WEEK[i]]), i => c.days.has(i),
        i => { if (!c.days.has(i)) c.days.add(i); else if (c.days.size > 1) c.days.delete(i); }, 'days'));
    }
    if (c.freq === 'monthly') {
      parts.push(h('div', { class: 'rp-row' }, seg([['day', '日付で'], ['week', '曜日で']], v => c.mode === v, v => { c.mode = v; })));
      if (c.mode === 'day') {
        const ds = [];
        for (let i = 1; i <= 31; i++) ds.push([i, i]);
        parts.push(seg(ds, i => c.mday === i, i => { c.mday = i; }, 'mdays'));
      } else {
        parts.push(seg([[1, '第1'], [2, '第2'], [3, '第3'], [4, '第4'], [5, '第5'], ['L', '最終']], v => c.nth === v, v => { c.nth = v; }),
          h('div', { style: 'height:6px' }),
          seg(weekOrder().map(i => [i, WEEK[i]]), i => c.wd === i, i => { c.wd = i; }, 'days'));
      }
    }
    if (c.freq === 'yearly') {
      parts.push(h('div', { class: 'rp-row' }, seg([['day', '日付で'], ['week', '曜日で']], v => c.mode === v, v => { c.mode = v; })));
      if (c.mode === 'day') parts.push(h('p', { class: 'note' }, '毎年、起点の日（' + md(base) + '）に繰り返します。'));
      else {
        const mons = [];
        for (let i = 0; i < 12; i++) mons.push([i, (i + 1) + '月']);
        // 毎年の第5◯曜日は、ない年が何年も続くことがあるので選べない（第1〜第4・最終だけ）
        if (c.nth === 5) c.nth = 'L';
        parts.push(seg(mons, i => c.mon === i, i => { c.mon = i; }, 'mdays'),

          seg([[1, '第1'], [2, '第2'], [3, '第3'], [4, '第4'], ['L', '最終']], v => c.nth === v, v => { c.nth = v; }),
          h('div', { style: 'height:6px' }),

    parts.push(h('div', { class: 'rp-row' }, h('label', { class: 'pchk', title: '次の回が祝日に当たったら、その回を飛ばして次の回にする' }, nh, ' 祝日は飛ばす')));
    // v0.23.0：終わりの日も同じカレンダーで選ぶ（8番）
    parts.push(h('div', { class: 'rp-row' }, h('span', { title: 'この日より後の回は作らない（空なら終わりなし）' }, '終わりの日 '),
      h('button', { type: 'button', class: 'dfield' + (c.until ? ' set' : ' empty'), 'aria-expanded': String(!!c.calOpen), onclick: () => { c.calOpen = !c.calOpen; c.calMonth = (c.until || base).slice(0, 7); draw(); } }, c.until ? longDate(c.until) : 'なし'),
      c.until ? h('button', { type: 'button', class: 'mini', title: '終わりの日をなくす', 'aria-label': '終わりの日をなくす', onclick: () => { c.until = ''; c.calOpen = false; draw(); } }, ic('close')) : null));
    if (c.calOpen) parts.push(calEl({ month: c.calMonth || (c.until || base).slice(0, 7), sel: c.until, onPick: d => { c.until = d; c.calOpen = false; draw(); }, onMonth: m => { c.calMonth = m; draw(); } }));
    showPrev();
    parts.push(prev, h('div', { class: 'pop-acts' },
      h('button', { type: 'button', class: 'btn icon-btn', title: '戻る', 'aria-label': '戻る', onclick: () => repeatPicker(btn) }, ic('back')),
      h('span', { class: 'sp' }),
      h('button', { type: 'button', class: 'btn primary', onclick: () => { const r = result(); applyRepeat(r.rule, r.day); hidePop(); } }, '決定')));
    showPop(btn, ...parts);
  }
  draw();
}

// 文字を打っている・小窓やメニューの中にいる
function typing() {
  const a = document.activeElement;
  return !!a && (a.matches('input, textarea, select') || a.isContentEditable);
}
function inUi() {
  const a = document.activeElement;
  return typing() || !!(a && (taskDlg.contains(a) || menu.contains(a) || pop.contains(a)));
}
// 一覧を隠すポップアップが開いている（右側の欄は除く）
function modalOpen() {
  return listDlg.open || keyDlg.open || (taskDlg.open && !taskDlg.classList.contains('panel')) || !!inlineBox;
}
// Ctrl+C：選んだタスク（なければ今のタスク）の名前をコピーする。Ctrl+V で複製になる
document.addEventListener('copy', e => {
  if (inUi() || modalOpen() || !e.clipboardData) return;
  const s = getSelection();
  if (s && String(s).trim()) return; // 文字を選んでいるときは、ふつうのコピー
  const ids = targets();
  if (!ids.length) return;
  const text = ids.map(id => taskOf(id).title).join('\n');
  e.clipboardData.setData('text/plain', text);
  e.preventDefault();
  S.clip = { ids, text };
  status(ids.length + '件をコピーしました（Ctrl+V で複製）');
});
// Ctrl+V：コピーしたタスクなら複製（フォルダの画面ならそのフォルダへ）、ほかの文章ならタスクを作る
document.addEventListener('paste', e => {
  if (inUi() || modalOpen() || !e.clipboardData) return;
  if (!LIST_VIEWS.includes(S.view) && S.view !== 'cal') return;
  const text = e.clipboardData.getData('text/plain');
  if (!text.trim()) return;
  e.preventDefault();
  const ids = S.clip && text === S.clip.text ? S.clip.ids.filter(taskOf) : [];
  if (ids.length) { duplicate(ids, S.view === 'lists' ? S.folderId : '', '貼り付けました'); return; }
  const base = S.addBase ? S.addBase() : { listId: S.addList };
  pasteLines(text, base, document.querySelector('#main .qa-in') || document.getElementById('main'));
});

// ---- 右クリックのメニュー（スマホは ⋯ から） ----
// rect の所に出す。選んでいるタスクを右クリックしたら、選んだもの全部が相手になる
function openCtx(t, rect, chip) {
  if (!t || t.id.startsWith('tmp')) return;
  const ids = S.sel && S.sel.has(t.id) ? [...S.sel].filter(taskOf) : [t.id];
  const one = ids.length === 1;
  if (!S.sel) { S.cur = t.id; S.anchor = t.id; }
  const anchor = { getBoundingClientRect: () => rect, contains: () => false, ctx: true };
  const td = today();
  const run = fn => () => { hideMenu(); fn(); };
  const dBtn = (sym, tip, fn) => h('button', { type: 'button', class: 'icon', title: tip, 'aria-label': tip, onclick: fn }, sym);
  const item = (sym, label, fn, cls) => h('button', { type: 'button', class: 'rp-opt' + (cls ? ' ' + cls : ''), onclick: fn }, ic(sym), '　' + label);
  const addKid = () => {
    if (LIST_VIEWS.includes(S.view)) {
      S.addKidOf = t.id;
      S.kidFocus = true;
      S.foldT.delete(t.id);
      saveSet('todo-fold-tasks', S.foldT);
      render();
    }
    // この画面に子タスクを打ち込む欄が出せないときは、編集画面の子タスクの欄へ
    if (!document.querySelector('#main .kid-in')) {
      S.addKidOf = null;
      openTaskSmart(t);
      setTimeout(() => subIn.focus(), 0);
    }
  };
  showMenu(anchor, h('div', { class: 'rp-list' },
    h('div', { class: 'cm-dates' },
      dBtn(ic('sun'), '実行日を今日にする', () => bulk('date', td, ids)),
      dBtn(ic('tomorrow'), '実行日を明日にする', () => bulk('date', addDays(td, 1), ids)),
      dBtn(ic('week'), '実行日を1週間後にする', () => bulk('date', addDays(td, 7), ids)),
      dBtn(ic('calendar'), '実行日を選ぶ', () => pickDateMenu(anchor, day(t.doDate), d => bulk('date', d, ids), '実行日を選ぶ')),
      dBtn(ic('close'), '実行日を外す', () => bulk('clearDate', '', ids))),
    one && !t.done ? item('plus', '子タスクを追加', run(addKid)) : null,
    one && t.done ? item('undo', t.wontDo ? '「やらない」を取り消す' : '再開する', run(() => toggleDone(t)))
      : item('ban', 'やらない', run(() => { if (one) toggleDone(t, true); else bulk('wont', '', ids); })),
    item('folderMove', '移動先…', () => folderMenu(anchor, ids)),
    // v0.23.0：ピン留め（v0.24.0 で優先度は外した）
    item('pin', t.isPinned ? '固定を外す' : '上に固定', run(() => pinRow(ids, !t.isPinned))),
    one && !t.parentTaskId && !t.done ? (() => {
      // 押すと、消えるものを見せて「もう一度押すと」にする（2026-11-07 本人のカード：確認して全部消す）
      const b = item('convert', 'フォルダにする', () => {
        const lost = lostOnFolder(t);
        if (!lost.length || b.dataset.armed) { hideMenu(); taskToFolder(t); return; }
        b.dataset.armed = '1'; b.classList.add('danger');
        b.replaceChildren(ic('convert'), '　もう一度押すとフォルダにする（' + lost.join('・') + 'は消えます。元に戻すで戻せます）');
      });
      return b;
    })() : null,
    h('div', { class: 'cm-sep' }),
    item('copy', '複製する', () => duplicate(ids, '')),
    item('clipboard', 'テキストをコピーする', run(() => copyText(taskText(ids), one ? 'コピーしました' : ids.length + '件をコピーしました'))),
    one && !chip ? item('edit', '名前を変える（F2）', run(() => startRename(t))) : null,
    h('div', { class: 'cm-sep' }),
    item('trash', ids.length > 1 ? ids.length + '件を削除' : '削除', run(() => { if (one) deleteOne(t.id); else bulk('delete', '', ids); }), 'danger')));
  render();
  menu.querySelector('button').focus();
}
// カレンダーの帯・予定のタスクを右クリックしたとき
function chipMenu(e, t) {
  e.preventDefault();
  e.stopPropagation();
  if (drag) return;
  openCtx(t, new DOMRect(e.clientX, e.clientY, 0, 0), true);
}
document.addEventListener('contextmenu', e => {
  if (drag || e.defaultPrevented) return;
  if (Date.now() - lastTouch < 1500 && e.target.closest('#main .task[data-id], #side .fold')) { e.preventDefault(); return; } // v0.30.0：指の長押しは「選ぶ」
  const row = e.target.closest('#main .task[data-id]');
  if (!row || e.target.closest('input, textarea, select')) return;
  const t = taskOf(row.dataset.id);
  if (!t || t.id.startsWith('tmp')) return;
  e.preventDefault();
  openCtx(t, new DOMRect(e.clientX, e.clientY, 0, 0));
});

// ---- Tab で子タスクに、Shift+Tab で1つ上へ戻す（フォルダの画面だけ） ----
function indent(ids, out) {
  const vis = visibleIds();
  const set = new Set(ids);
  // 親も一緒に選んでいる子は、親と一緒に動くのでそのまま
  ids = vis.filter(id => set.has(id) && !ids.some(o => o !== id && isUnder(id, o)));
  const next = {}; // 同じ親の下に続けて入れるときの並び順
  const items = [];
  ids.forEach((id, n) => {
    const t = taskOf(id);
    if (!out) {
      let p = null;
      for (let i = vis.indexOf(id) - 1; i >= 0; i--) {
        const x = taskOf(vis[i]);
        if (!x || set.has(x.id)) continue;
        if (x.id === t.parentTaskId) break; // 上にきょうだいがいない
        if ((x.parentTaskId || '') === (t.parentTaskId || '') && x.listId === t.listId) { p = x; break; }
      }
      if (!p) return;
      if (!(p.id in next)) {
        const os = kidsOf(p.id).map(orderOf);
        next[p.id] = os.some(o => o === Infinity) ? '' : (os.length ? Math.max(...os) : 0) + 10;
      }
      items.push({ id, parentTaskId: p.id, order: next[p.id] });
      if (next[p.id] !== '') next[p.id] += 10;
      S.foldT.delete(p.id);
    } else {
      const par = taskOf(t.parentTaskId);
      if (!par) return;
      items.push({ id, parentTaskId: par.parentTaskId || '', order: par.order === '' || par.order == null ? '' : Number(par.order) + 0.5 + n * 0.01 });
    }
  });
  saveSet('todo-fold-tasks', S.foldT);
  if (!items.length) { status(out ? 'これ以上は上へ戻せません' : '上に同じ高さのタスクがないので、子タスクにできません'); return; }
  patchMany(items, out ? '1つ上へ戻しました' : '子タスクにしました');
}

// ---- キー操作（TickTick に合わせる。ブラウザが使う Ctrl+N などは別のキーに） ----
const keyDlg = document.getElementById('keyDlg');
document.getElementById('keyClose').onclick = () => keyDlg.close();
closeOnOutside(keyDlg, () => keyDlg.close());
const KEYS_HELP = [
  ['タスク', [['N', 'タスクを追加する欄へ'], ['↑ ↓ ・ J K', '上・下のタスクへ'], ['Enter', '開く'], ['F2', '名前をその場で直す'],
    ['Space ・ Ctrl + M', '完了にする（もう一度で戻す）'], ['Delete', '削除する（Ctrl+Z で戻せる）'], ['Ctrl + D', '実行日を変える'],
    ['Ctrl + Shift + D', '実行日を外す'], ['Tab', '上のタスクの子タスクにする'], ['Shift + Tab', '1つ上へ戻す'], ['右クリック', 'メニュー（スマホは ⋯）']]],
  ['選ぶ・コピー', [['Ctrl + クリック', '1つずつ選ぶ'], ['Shift + クリック', '間をまとめて選ぶ'], ['Shift + ↑ ↓', '選ぶ範囲を広げる'],
    ['Ctrl + A', '表示しているタスクを全部選ぶ'], ['Ctrl + C', '名前をコピーする'], ['Ctrl + V', 'コピーしたタスクを複製する（文章ならタスクを作る）'],
    ['Ctrl + Z', '元に戻す'], ['Esc', '選ぶのをやめる・右の欄を閉じる']]],
  ['画面', [['G → T', '今日'], ['G → N', '7日間'], ['G → A', 'すべてのフォルダ'], ['G → C', 'カレンダー'], ['G → S', '設定'],
    ['/ ・ Ctrl + F', '探す'], ['?', 'この一覧']]],
  ['カレンダー', [['M ・ W ・ 3 ・ D', '月・週・3日・日で表示する'], ['T', '今日に戻る'], ['← ・ →', '前・次へ']]],
  ['追加の欄', [['Enter', '追加する（「明日9時 会議 #仕事 30分」の日時・フォルダ・所要時間を読み取る）'], ['Shift + Enter', '読み取らずにそのまま追加する'],
    ['札の ×', '読み取った言葉を名前に戻す']]],
  ['貼り付け', [['何行もの文章', '1行ずつタスクにするか選べる']]]];
function openKeys() {
  const kb = s => s.split(' ').map(p => p === '+' || p === '→' || p === '・' ? ' ' + p + ' ' : h('kbd', null, p));
  document.getElementById('keyBody').replaceChildren(h('h2', null, '⌨ キー操作'),
    ...KEYS_HELP.map(([title, rows]) => h('div', null, h('h3', null, title),
      h('table', null, rows.map(([k, v]) => h('tr', null, h('td', null, k.includes(' ') || k.length < 4 ? kb(k) : k), h('td', null, v)))))));
  hideMenu();
  keyDlg.showModal();
}
// 今のタスクの行（なければ一覧のいちばん上）
function curRow() {
  return (S.cur && document.querySelector('#main .task[data-id="' + CSS.escape(S.cur) + '"]')) || document.getElementById('main');
}
let gAt = 0;
document.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229 || drag) return;
  const k = e.key;
  const lk = k.length === 1 ? k.toLowerCase() : k;
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && !e.shiftKey && !e.altKey && lk === 'z' && !inUi() && !modalOpen()) { e.preventDefault(); undo(); return; }
  if (modalOpen()) return;
  if (!menu.hidden) {
    if (k === 'Escape') { e.preventDefault(); hideMenu(); return; }
    // ↑↓ でメニューの中を動く
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      const bs = [...menu.querySelectorAll('button, input')];
      const i = bs.indexOf(document.activeElement);
      const b = bs[(i + (k === 'ArrowUp' ? -1 : 1) + bs.length) % bs.length];
      if (b) { e.preventDefault(); b.focus(); }
    }
    return;
  }
  if (!pop.hidden) { if (k === 'Escape') { e.preventDefault(); hidePop(); } return; }
  // 右側の欄の中では Esc で一覧に戻る（小窓が出ていればそれを閉じる）
  // v0.45.0：行を押すと欄そのもの（dialog）に焦点が移る。そのときは一覧の矢印・Shift＋矢印に回す（欄の中の入力欄・ボタンにいるときだけ欄の操作）
  if (taskDlg.open && taskDlg.contains(document.activeElement) && document.activeElement !== taskDlg) {
    if (k === 'Escape') { e.preventDefault(); document.activeElement.blur(); }
    return;
  }
  if (typing() || side.classList.contains('open')) return;
  const onBtn = document.activeElement && document.activeElement.matches('button, a, summary');
  if (onBtn && (k === 'Enter' || k === ' ')) return;

  // G に続けて押すキーで画面を切り替える
  if (gAt && Date.now() - gAt < 1500 && !ctrl && !e.altKey) {
    gAt = 0;
    if (lk === 'a') { e.preventDefault(); goFolder(''); return; }
    const v = { t: 'today', n: 'next7', c: 'cal', s: 'settings', f: 'search' }[lk];
    if (v) { e.preventDefault(); goView(v); return; }
  }
  gAt = 0;
  if (lk === 'g' && !ctrl && !e.altKey && !e.shiftKey) { gAt = Date.now(); return; }
  if (!ctrl && !e.altKey && (k === '?' || (k === '/' && e.shiftKey))) { e.preventDefault(); openKeys(); return; }
  if (ctrl && k === '/') { e.preventDefault(); openKeys(); return; }
  if ((k === '/' && !ctrl) || (ctrl && !e.shiftKey && lk === 'f')) { e.preventDefault(); goView('search'); return; }

  if (S.view === 'cal' && !ctrl && !e.altKey) {
    const mode = { m: 'month', w: 'week', 3: '3day', d: 'day' }[lk];
    if (mode) { e.preventDefault(); S.calMode = mode; if (mode === 'month') S.calMonth = S.calDay.slice(0, 7); render(); return; }
    if (lk === 't') { e.preventDefault(); S.calDay = today(); S.calMonth = S.calDay.slice(0, 7); render(); return; }
    if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); calMove(k === 'ArrowLeft' ? -1 : 1); return; }
  }
  if (lk === 'n' && !ctrl && !e.altKey && !e.shiftKey) {
    e.preventDefault();
    if (!document.querySelector('#main .main-qa')) goView('today');
    const q = document.querySelector('#main .main-qa');
    if (q) { q.classList.add('open'); q.querySelector('.qa-in').focus(); }
    return;
  }
  // v0.45.0：矢印は「いま触っている側」で。サイドバーを触っていたらフォルダを移る・Shift で範囲を選ぶ
  if (KBZ === 'side' && S.view !== 'cal' && (k === 'ArrowUp' || k === 'ArrowDown') && !ctrl && !e.altKey) {
    const fids = [...side.querySelectorAll('.fold[data-list]')].map(r => r.dataset.list);
    if (!fids.length) return;
    e.preventDefault();
    const down = k === 'ArrowDown';
    const at = S.fcur && fids.includes(S.fcur) ? S.fcur : (S.view === 'lists' && fids.includes(S.folderId) ? S.folderId : '');
    let i = fids.indexOf(at);
    i = i < 0 ? (down ? 0 : fids.length - 1) : Math.max(0, Math.min(fids.length - 1, i + (down ? 1 : -1)));
    const id = fids[i];
    if (e.shiftKey) {
      if (!S.fanchor || !fids.includes(S.fanchor)) S.fanchor = at || id;
      const a = fids.indexOf(S.fanchor);
      S.fsel = new Set(fids.slice(Math.min(a, i), Math.max(a, i) + 1));
      S.fcur = id;
      renderSide();
    } else {
      S.fsel = null; S.fanchor = id; S.fcur = id;
      goFolder(id);
    }
    const row = side.querySelector('.fold[data-list="' + CSS.escape(id) + '"]');
    if (row) row.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (KBZ === 'side' && k === 'Enter' && S.fcur && !ctrl && !e.altKey && S.fsel) { e.preventDefault(); const id = S.fcur; S.fsel = null; goFolder(id); return; }
  const vis = visibleIds();
  const ids = targets();
  const cur = taskOf(S.cur);
  // v0.19.0：J・K でも上下へ
  const arrow = (lk === 'j' || lk === 'k') && !e.shiftKey ? (lk === 'j' ? 'ArrowDown' : 'ArrowUp') : k;
  if ((arrow === 'ArrowUp' || arrow === 'ArrowDown') && !ctrl && !e.altKey) {
    if (!vis.length) return;
    e.preventDefault();
    const down = arrow === 'ArrowDown';
    let i = vis.indexOf(S.cur);
    i = i < 0 ? (down ? 0 : vis.length - 1) : Math.max(0, Math.min(vis.length - 1, i + (down ? 1 : -1)));
    const id = vis[i];
    if (e.shiftKey && LIST_VIEWS.includes(S.view)) {
      if (!S.anchor || !vis.includes(S.anchor)) S.anchor = S.cur && vis.includes(S.cur) ? S.cur : id;
      selectRange(S.anchor, id, true);
    } else {
      S.anchor = id;
      S.cur = id;
      if (taskDlg.classList.contains('panel') && !S.sel) openTaskSmart(taskOf(id)); else render();
    }
    const row = document.querySelector('#main .task[data-id="' + CSS.escape(id) + '"]');
    if (row) row.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (k === 'Escape') {
    if (S.sel) { S.sel = null; render(); } else if (taskDlg.open) commitTask(false); else if (S.cur) { S.cur = null; render(); }
    return;
  }
  if (ctrl && !e.shiftKey && lk === 'a') {
    const all = S.view === 'cal' ? calIds() : vis;
    if (!(LIST_VIEWS.includes(S.view) || S.view === 'cal') || !all.length) return;
    e.preventDefault();
    S.sel = new Set(all);
    render();
    return;
  }
  if (!ids.length) return;
  if (k === 'Enter' && !ctrl && cur) { e.preventDefault(); openTaskSmart(cur); if (taskDlg.classList.contains('panel')) TF('title').focus(); return; }
  // v0.19.0：Space で完了（もう一度で戻す）
  if (k === ' ' && !ctrl && !e.altKey && !e.shiftKey) {
    e.preventDefault();
    if (ids.length === 1) toggleDone(taskOf(ids[0])); else bulk('done', '', ids);
    return;
  }
  if (k === 'F2' && cur) { e.preventDefault(); startRename(cur); return; }
  if ((ctrl && lk === 'm') || (ctrl && k === 'Enter')) {
    e.preventDefault();
    if (ids.length === 1) toggleDone(taskOf(ids[0])); else bulk('done', '', ids);
    return;
  }
  if (k === 'Delete' || (e.metaKey && k === 'Backspace')) {
    e.preventDefault();
    // 消したあとは、すぐ下（なければ上）のタスクへ
    const rest = vis.filter(id => !ids.includes(id) && !ids.some(o => isUnder(id, o)));
    const at = vis.indexOf(ids[0]);
    S.cur = rest.find(id => vis.indexOf(id) > at) || rest.filter(id => vis.indexOf(id) < at).pop() || null;
    S.anchor = S.cur;
    if (taskDlg.open && ids.includes(S.editing && S.editing.id)) taskDlg.close();
    if (ids.length === 1) deleteOne(ids[0]); else bulk('delete', '', ids);
    return;
  }
  if (ctrl && lk === 'd') {
    e.preventDefault();
    if (e.shiftKey) { bulk('clearDate', '', ids); return; }
    dateMenu(curRow(), ids);
    menu.querySelector('button').focus();
    return;
  }
  if (k === 'Tab' && !ctrl && !e.altKey && S.view === 'lists') { e.preventDefault(); indent(ids, e.shiftKey); }
});

load();
// v0.32.0（B5）：上のバーの高さを覚える（見出しの貼り付け位置）
{ const bar = document.querySelector('header.bar'); const set = () => document.documentElement.style.setProperty('--barh', barH() + 'px');

// v0.41.0（受付19 A）：広い画面では上の帯をやめ、ロゴ・☰を左の列の上へ、同期・⟳を下へ移す。狭い画面では帯を透明にして、☰と⟳だけを左上・右上に浮かせる
function placeBar() {
  const bar = document.querySelector('header.bar'), tools = bar.querySelector('.tools');
  const logo = bar.querySelector('h1') || document.querySelector('#railTop h1');
  const btns = ['updBadge', 'saveSt', 'reloadBtn'].map(id => document.getElementById(id)), side = document.getElementById('sideBtn');
  const wide = matchMedia('(min-width: 600px)').matches, railTop = document.getElementById('railTop'), railBot = document.getElementById('railBot');
  if (wide && logo.parentElement !== railTop) {
    logo.title = 'To Cal v' + VERSION;
    railTop.append(logo, side); railBot.append(...btns);
  } else if (!wide && logo.parentElement === railTop) {
    bar.prepend(side, logo); tools.append(...btns);
  }
  document.documentElement.style.setProperty('--barh', barH() + 'px');
}
placeBar(); matchMedia('(min-width: 600px)').addEventListener('change', placeBar);
// v0.32.0（B1）：キーボードで動かしたかどうか
addEventListener('keydown', e => { if (/^(Arrow|Tab$|Home$|End$|PageUp$|PageDown$)/.test(e.key) || (!e.ctrlKey && !e.metaKey && !e.altKey && /^[jk]$/.test(e.key) && !inUi())) document.body.classList.add('kbnav'); }, true);
addEventListener('pointerdown', e => {
  document.body.classList.remove('kbnav');
  // v0.45.0：矢印を効かせる側（サイドバーかリスト）。最後に押した所で決める
  const t = e.target instanceof Element ? e.target : null;
  if (t && t.closest('#side')) KBZ = 'side'; else if (t && t.closest('#main, #taskDlg')) KBZ = 'main';
}, true);
