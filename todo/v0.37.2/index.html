<body>
<header class="bar">
  <button class="icon" id="sideBtn" title="フォルダの一覧を出す・隠す" aria-label="フォルダの一覧を出す・隠す"><i data-ic="menu"></i></button>
  <h1 aria-label="To Cal" title="To Cal"><svg class="appmark" viewBox="28 26 52 52" aria-hidden="true"><g fill="none" stroke="var(--appmark,#4772FA)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M38,36h32a5,5 0,0 1,5 5v28a5,5 0,0 1,-5 5H38a5,5 0,0 1,-5 -5V41a5,5 0,0 1,5 -5z"/><path d="M33,46h42M43,31v9M65,31v9"/><path d="M44,59l6,6 13,-13" stroke-width="6"/></g></svg><span class="ver" id="verTag"></span></h1>
  <nav class="tools">
    <button class="btn upd-badge" id="updBadge" hidden title="新しい版があります。設定の「この版・更新」で ⟳ を押すと入れ替わります"><i data-ic="refresh"></i> 新しい版</button>
    <button class="icon save-st" id="saveSt" hidden onclick="retrySave()"></button>
    <button class="icon" id="reloadBtn" title="最新の内容を読み直す" aria-label="最新の内容を読み直す"><i data-ic="refresh"></i></button>
  </nav>
</header>
<!-- v0.26.0（20番）：TickTick のように、いちばん左に記号だけの細い帯（広い画面）。狭い画面では下のタブが同じ4つ -->
<nav id="rail" aria-label="画面の切り替え">
  <div id="railTop" class="rail-grp"></div>
  <button data-rail="list" title="ToDoリストを開く" aria-label="ToDoリストを開く"><i data-ic="tasks"></i></button>
  <button data-rail="cal" title="カレンダーを開く" aria-label="カレンダーを開く"><i data-ic="calendar"></i></button>
  <button data-rail="search" title="タスクを探す" aria-label="タスクを探す"><i data-ic="search"></i></button>
  <span class="rail-sp"></span>
  <div id="railBot" class="rail-grp"></div>
  <button data-rail="settings" title="設定を開く" aria-label="設定を開く"><i data-ic="settings"></i></button>
</nav>
<div class="layout">
  <aside id="side" aria-label="フォルダ"></aside>
  <main id="main"><p class="note">読み込み中…</p></main>
</div>
<div id="scrim"></div>
<!-- スマホでは、下に画面を切り替えるタブと、右下に追加の＋ボタンを出す。フォルダの一覧は左上の ☰ で開く（v0.22.0、Android と同じ） -->
<nav id="tabs" aria-label="画面の切り替え">
  <button data-rail="list" title="ToDoリストを開く" aria-label="ToDoリストを開く"><b><i data-ic="tasks"></i></b>ToDo</button>
  <button data-rail="cal" title="カレンダーを開く" aria-label="カレンダーを開く"><b><i data-ic="calendar"></i></b>カレンダー</button>
  <button data-rail="search" title="タスクを探す" aria-label="タスクを探す"><b><i data-ic="search"></i></b>探す</button>
  <button data-rail="settings" title="設定を開く" aria-label="設定を開く"><b><i data-ic="settings"></i></b>設定</button>
</nav>
<button id="fab" title="タスクを追加する" aria-label="タスクを追加する"><i data-ic="plus"></i></button>
<div id="status" role="status"></div>
<div id="selbar" class="selbar" hidden></div>
<div id="menu" class="pop" hidden></div>

<!-- v0.28.0（9番）：開いたとき最初の入力欄（フォルダ欄）に入らないよう、窓そのものに入る（iPad でフォルダの一覧が勝手に開いていた） -->
<dialog id="taskDlg" tabindex="-1" autofocus>
  <div class="dgrab" id="taskGrab" aria-hidden="true"><span></span></div>
  <form id="taskForm" class="form" novalidate>
    <!-- 上に日時の行（実行日・期限・繰り返し・通知）、その下に大きな名前とメモ。フォルダと親タスクはいちばん下 -->
    <div class="dbar">
      <label title="フォルダ">▤ <select name="listId" aria-label="フォルダ"></select></label>
      <select name="parentTaskId" aria-label="親タスク" hidden></select>
      <span class="dbtns">
      <button type="button" class="icon" id="taskPin" title="上に固定（フォルダの一番上）" aria-label="上に固定"><i data-ic="pin"></i></button>
      <button type="button" class="icon" id="taskMore" title="そのほか（テンプレート・やらない・フォルダにする・削除）" aria-label="そのほか" aria-haspopup="menu" aria-expanded="false">⋯</button>
      <span class="dmenu" id="taskMenu" hidden>
      <button type="button" class="icon" id="taskTpl" title="テンプレートとして残す" aria-label="テンプレートとして残す"><i data-ic="template"></i><span class="ml">テンプレートとして残す</span></button>
      <button type="button" class="icon" id="taskWont" title="やらないで終える" aria-label="やらないで終える"><i data-ic="ban"></i><span class="ml">やらないで終える</span></button>
      <button type="button" class="icon" id="taskConv" title="フォルダにする" aria-label="フォルダにする"><i data-ic="convert"></i><span class="ml">フォルダにする</span></button>
      <button type="button" class="btn danger icon-btn" id="taskDel" title="このタスクを消す" aria-label="このタスクを消す"><i data-ic="trash"></i><span class="ml">消す</span></button>
      </span>
      </span>
    <button type="submit" class="icon dx" id="taskClose" title="閉じる（変えた分は保存されます）" aria-label="閉じる"><i data-ic="close"></i></button>
    </div>
    <div class="dhead">
    <button type="button" class="dchk" id="taskDone" title="完了にする" aria-label="完了にする" role="checkbox" aria-checked="false"></button>
    <div class="dcol">
    <div class="dtop">
      <div class="drow"><span class="dk" title="期限"><i data-ic="flag"></i></span><button type="button" class="dfield" data-key="due" title="期限を選ぶ"></button></div>
      <div class="drow"><span class="dk" title="実行日"><i data-ic="calendar"></i></span><button type="button" class="dfield" data-key="doDate" title="実行日を選ぶ"></button>
      <span id="endWrap" hidden>〜 <button type="button" class="dfield" data-key="doEnd" title="期間の終わりを選ぶ"></button></span>
      <label class="pchk" hidden><input type="checkbox" id="periodChk"> 期間</label></div>
      <div class="drow"><span class="dk" title="所要時間"><i data-ic="clock"></i></span><button type="button" class="dfield" data-key="estimate" title="所要時間を選ぶ"></button></div>
      <div class="drow" hidden><span class="dk" title="優先度"><i data-ic="prio"></i></span><button type="button" class="dfield" id="prioBtn" title="優先度を選ぶ（□ の枠の色）"></button></div>
    </div>
    </div>
    </div>
    <div class="dpath" id="taskPath"></div>
    <input name="title" class="ttl-in" required autocomplete="off" placeholder="タスク名" aria-label="タスク名">
    <textarea name="memo" class="memo-in" rows="3" placeholder="メモ" aria-label="メモ"></textarea>
    <div id="chkWrap" hidden>
    <div class="sub-head"><i data-ic="checklist"></i> チェックリスト <span class="cnt" id="chkCnt"></span></div>
    <div id="chkList"></div>
    <div class="ci"><span class="cbox" style="visibility:hidden"></span><input type="text" class="ci-add" id="chkIn" placeholder="＋ 項目を追加（Enter）" aria-label="チェックリストに足す項目" autocomplete="off"></div>
    </div>
    <div hidden id="subWrap">
    <div class="sub-head"><i data-ic="subtask"></i> 子タスク <span class="cnt" id="subCnt"></span></div>
    <div id="subList" class="sub-box"></div>
    <div class="qa"><input type="text" class="qa-in" id="subIn" placeholder="子タスク名を入れて Enter" aria-label="追加する子タスク名" autocomplete="off">
      <button type="button" class="icon" id="subAdd" title="この子タスクを追加する" aria-label="この子タスクを追加する">＋</button></div>
    </div>
    <div id="attBox" hidden>
    <div id="attList"></div>
    <input type="file" id="attInput" multiple hidden aria-label="添付するファイルを選ぶ">
    <button type="button" class="mini" id="attPick" title="添付するファイルを選ぶ（Googleドライブに保存・1つ10MBまで）">＋ ファイルを添付</button>
    </div>
    <div class="dtop dbottom">
      <button type="button" class="dfield" id="chkBtn" title="チェックリスト" aria-label="チェックリスト"><i data-ic="checklist"></i><span id="chkBtnCnt"></span></button>
      <span class="dk" title="繰り返し"><i data-ic="repeat"></i></span><button type="button" class="dfield" data-key="repeat" title="繰り返しを選ぶ"></button>
      <span class="dk" title="通知"><i data-ic="bell"></i></span><span id="remChips" class="rchips"></span>
      <button type="button" class="dfield" data-key="notifyAt" title="日時の通知（押すと変える）" hidden></button>
      <button type="button" class="dfield empty" id="remAdd" title="通知を足す（実行日・期限の◯分前／日時を決める）" aria-label="通知を足す" aria-haspopup="menu"><i data-ic="bell"></i>＋</button>
      <button type="button" class="dfield" id="attFold" title="添付ファイル" aria-label="添付ファイル" aria-expanded="false"><i data-ic="clip"></i><span id="attCnt"></span></button>
    </div>
    <p class="dlg-err" id="taskErr" hidden></p>
    <div class="dlg-acts">
      <span class="sp"></span>
      <span class="saved" id="savedMark" aria-live="polite"></span>
    </div>
  </form>
  <div id="pop" class="pop" hidden></div>
</dialog>

<dialog id="keyDlg">
  <div class="keys" id="keyBody"></div>
  <button type="button" class="dlg-x" id="keyClose" title="閉じる" aria-label="閉じる"><i data-ic="close"></i></button>
</dialog>
<dialog id="planDlg" aria-label="朝の段取り"><div id="planBody"></div></dialog>
<dialog id="listDlg">
  <form id="listForm" class="form">
    <button type="button" class="dlg-x" id="listClose" title="閉じる" aria-label="閉じる"><i data-ic="close"></i></button>
    <label>フォルダの名前<input name="name" required autocomplete="off"></label>
    <label>入れる場所<select name="parentId"></select></label>
    <label>目印の絵文字（なしなら色の点）</label>
    <div class="emos"><input name="icon" maxlength="16" autocomplete="off" aria-label="目印の絵文字" placeholder="なし"><span id="emoPick"></span></div>
    <label>予定を入れるカレンダー（このフォルダの「＋予定」で入れる先）<select name="calId"></select></label>
    <label>目印の言葉（工事番号など。名前にこの言葉がある予定もこのフォルダに出し、＋予定で名前の後ろに付ける。空白で区切って複数）<input name="keyword" autocomplete="off" placeholder="例 R7-23"></label>
    <label>色（カレンダーの色。なしなら上のフォルダの色）</label>
    <div class="swatches" id="listColors"></div>
    <div class="dlg-acts">
      <button type="button" class="btn danger icon-btn" id="listDel" title="このフォルダを消す" aria-label="このフォルダを消す"><i data-ic="trash"></i></button>
      <span class="sp"></span>
      <button type="submit" class="btn primary icon-btn" title="保存する" aria-label="保存する"><i data-ic="save"></i></button>
    </div>
  </form>
